真实习得的，并早早暴露\n4. 30 年前的家族秘密 → 让秘密在当下发生（实时阴谋）\n5. 配偶有不能说的秘密身世 → 让秘密是经济/政治/职业层面，而非血缘\n6. 助听器/拐杖/眼镜盒藏证据 → 用调取记录、第三方作证等现代手段\n7. 重男轻女家庭逼女主联姻 → 让女主自己布局，反过来利用婚姻\n8. 女主重生第一件事是报复前世闺蜜 → 让她先去做“前世没机会做的小事”\n9. 男主对女主一秒破防 → 先理性后破防，给破防一个具体触发点\n10. 绿茶白莲花反派假柔弱实毒辣 → 给反派至少一个动机和人性挣扎\n\n二级黑名单（还能救，用则要有反差）：婆婆刁难、女主被陷害、男主的白月光、穿越后现代知识降维打击、西装霸总撑墙吻、父母假死回归、反派下毒、隐藏财阀千金、“沈/苏/陆/顾 + 玥/曼/砚/锦”式人名、“我等这一天等了 30 年”式台词。\n\n三级黑名单（一集只能用一个）：寿宴/婚礼/葬礼当众撕脸、录音笔、DNA 报告、监控录像反转、银行流水截图、微信聊天记录截图。\n```\n"}, {"id": "3.8", "title": "剧本去 AI 味（锁剧情只改措辞）", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/de-ai", "path": "03-revision/de-ai/3.8-剧本去-AI-味.md", "body": "\n**用法**：剧本定稿后，读起来有 AI 腔、书面腔时用。它的关键是先锁住剧情、分镜、金句，只改措辞、节奏和动作线，不会把剧情改跑。一部剧可以分批跑（比如每次 10 集）。和 3.3 的区别：3.3 是按标准重构台词，这条是在不动结构的前提下做最后一遍润色。\n\n**来源**：[艾玛短剧 · 编剧 Skills](https://github.com/adoria111/emma-screenwriting-skills) skills/drama-humanizer，MIT（收集页面）。摘编：原技能会先问 5 个问题、再调用另一个技能，这里改成一段可以直接粘贴的指令，开头的信息由你自己填。\n\n**提示词正文**：\n\n```\n请对下面这批剧集（第__集到第__集）做“去 AI 味”润色。在绝不改动剧情、结构、节拍、金句的前提下，只改措辞、节奏和动作线，让台词一听就懂、口语、情绪直给，让动作线能被真人演出来、能被实际拍摄。\n\n【我先告诉你】\n1. 题材与基调：____（如：都市重生复仇，爽）\n2. 主要角色和各自的“声音”：____（如：A：话少、带交易感｜B：具体现实、会设条件）\n3. 观众是谁、在什么场景看：____（默认：下沉市场、睡前刷手机、不想动脑只要爽）\n4. 必须逐字保留的金句、人工锁定的剧情点：____\n\n【开始前】先扫描剧本，列出你认为应该锁定的内容（金句、场次标题、▲动作镜、钩子、付费卡点、集尾悬念点），和我提供的合并成一张锁定清单给我确认。\n\n【只能改这四类】\n1. 台词措辞；2. 句子长度与节奏；3. 动作线的写法（改成能表演、能拍的指示）；4. 必要的停顿、打断、没说完的话、括号里的表演提示。\n\n【绝对不能改】碰到就停手、标出来给我：\n剧情事件、信息顺序、场景结果、动作顺序；人物动机、关系、各角色掌握的信息；道具、伏笔、关键事实；场次标题、▲动作镜、钩子（不增删镜头）；节拍、付费卡点、真相释放顺序、世界规则；集尾钩子的事件和悬念点（只能改措辞和停顿）。\n\n【重点去掉的 AI 味】\n- 破折号过多；三段式排比；“不是……是……”“没……也没……”这类否定排比；\n- “一字一句”“第一次”这类口头禅式叙述；\n- 书面连接词、宣传腔、夸大的象征、空泛的总结句，改成可演的具体动作或一句口语短台词；\n- 动作线里的读心和作者判断（“她忽然意识到”“是问她更是问自己”），改成动作、停顿后的选择，或一句能说出口的短台词。\n\n【其他要求】\n- 每个角色说话方式要不一样，不要都改成同一种“自然腔”；\n- 括号提示只在台词和动作推不出该怎么演时才加，不用括号描述看得见的动作或显而易见的情绪；\n- 每集时长不能明显变长，不新增解释性的长对话。\n\n【输出】\n1. 本批修改后的完整剧本；\n2. 变更日志：逐处“原句 → 新句”；\n3. 碰到锁定、没有改的地方清单，交给我决定。\n```\n"}, {"id": "2.14", "title": "剧情保真删减：只删纯冗余，节奏靠表达密度不靠砍节点", "chapter": "二、小说转剧本", "license": "外部·可直接用", "folder": "03-revision/trim", "path": "03-revision/trim/2.14-剧情保真删减.md", "body": "\n**用法**：小说改剧本、压缩剧本时用，专门防止“为了节奏快把剧情删没了”。核心是分清“精简表达”和“删减内容”：要快就写短句、切得密、台词精炼，剧情节点一个都不能消失。压完后逐段对照原文自检。和 2.12（长篇小说改编压缩）、3.9（剧本删减）配合用：2.12 定压缩比和集数预算，这条管“删什么、不能删什么”。\n\n**来源**：[senmanx/novel-to-manju](https://github.com/senmanx/novel-to-manju) SKILL.md 第 2.5 节“剧情保真原则”、第 3.1 和 4.1 节的精简规则，CC0（公共领域，可自由使用）。摘编。\n\n**提示词正文**：\n\n```\n请按“剧情保真”原则压缩下面的原文（或剧本）。剧情保真优先级最高，高于所有“精简 / 删减 / 节奏快”的要求。\n\n【一、不能删的】\n推动主线的情节、关键转折、人物成长、重要伏笔、世界观设定，一律完整保留；不得以“节奏快”为由跳过或合并。\n与主线人物、结局、伏笔有关的支线必须保留；只有完全独立、与主线零交集的支线，先标出来，由我决定去留。\n拿不准能不能删的，一律保留。\n\n【二、可以删的（纯冗余）】\n只有同时满足以下四条的内容才能删：不影响剧情理解、不塑造人物、不铺垫后续、不渲染氛围。\n典型的纯冗余：凑字数的重复描写、无意义的修辞、同一心理活动的反复描写、大段环境堆砌。\n\n【三、要快，靠表达密度】\n精简的是表达方式，不是内容：\n- 冗长修饰改成短句，重复心理描写改成一个动作或一句台词；\n- 一个剧情节点可以用两个快切镜头讲完，但不能直接消失；\n- 背景信息用对话、动作、内心独白穿插交代，不直接砍掉；\n- 一集装不下就拆成两集，不靠删剧情凑时长。\n\n【四、压完自检】\n逐段对照原文，确认每个事件、每次对话、每个伏笔都还在；\n若某段被压缩，标明它的信息并进了哪一段，而不是丢了；\n最后列出：①删掉了哪些内容（应全部属于纯冗余）；②被标出待我决定的独立支线。\n```"}, {"id": "3.9", "title": "剧本删减：A—B—C 试删法", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "status": "二轮实测：已用于生产", "folder": "03-revision/trim", "path": "03-revision/trim/3.9-剧本删减.md", "body": "\n> **实测（11/03 第二轮）：已用于生产。** 和 3.11、3.12 一起被并进了视频专用提示词（6.0）。\n\n**用法**：单集字数超了、节奏拖沓时用。1.0 的 3.2 里有一条「删减台词、动作、环境描写」的指令，这条把「怎么删才不伤剧情」讲清楚了，可以替换或配合那条用。\n\n**来源**：[艾玛短剧 · 编剧 Skills](https://github.com/adoria111/emma-screenwriting-skills) skills/em-script-trim，MIT（收集页面）。摘编。\n\n**提示词正文**：\n\n```\n请删减这一集剧本中的无效过场、重复信息和冗余表达，保留必要的因果、情绪和表演过程。先看整段，再看句子，最后删词。\n\n【A—B—C 试删】\nA 是保留的前段，B 是准备删的段，C 是保留的后段。标清 B 的起止，然后把 A 直接接 C 连读，检查：\n- 回应还有没有对象？人物的位置和手里的东西还接不接得上？\n- B 是否带来了别处没有的信息、选择或情绪回报？\n如果 B 的作用已经被别处承担，指出是哪一句或哪个动作承担的。观众知道不等于人物知道；剧情接得上，也不等于情绪没有损失（要说明会少掉什么笑点、释放或必要的停顿）。\n\n【怎么删】\n1. 先找：重复到达、完整重演、没有新结果的争吵、反复解释、进入关键事件前的冗长手续。\n2. 整段确实多余就删整段，不要只删几个词却留着多余的一轮戏。如果删了必须新补一句解释才接得上，标出来作为“需要修复的候选”。\n3. 删完查依赖：删了举拳，后面就不能还写“握住拳头”；删一句话，要检查针对它的反驳；删了道具的来源，后面的道具不能凭空出现。\n4. 所有删改同时生效后再连读一遍。\n\n【边界】\n- 同一个秘密分别告诉两个不知情的人，不算重复；同一句质问从试探变成宣判，可能是关系在推进。\n- “有气氛”不是自动保留的理由，“没有新事实”也不是自动删除的理由，要落到具体后果上判断。\n- 不设固定删字比例；保持角色的说话方式和结尾不变。\n\n【输出】\n先给建议：每处删除的确切范围、A→C 怎么接、理由和取舍；我确认后再给完整修订稿和简要变更说明，注明删减前后的字数。\n```\n"}, {"id": "3.17", "title": "连续性检查：局部事实账", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/review", "path": "03-revision/review/3.17-连续性检查.md", "body": "\n**用法**：剧本写到中后段、或者改稿之后，担心前后穿帮时用：时间线、谁知道什么、道具在谁手上、人能不能赶到、世界规则有没有自相矛盾。它会分“确定冲突 / 需要补交代 / 待确认”三级，不会把没写出来的过渡都判成错误。\n\n**来源**：[geslie1/kunka-screenwriting-master](https://github.com/geslie1/kunka-screenwriting-master) plugins/kunka-screenwriting/skills/kunka-continuity，MIT（11/02 整理人新增到收集页面）。原文照录，只把开头改成了指令语气。\n\n**提示词正文**：\n\n```\n请检查下面剧本的连续性。先确定覆盖范围和以哪份材料为准（正文、人物表、年表或我明确给的设定）。材料互相矛盾时分别列证据，不要悄悄选一份当真相。\n\n【建立局部事实账】只追踪本次相关的人和物。按场次记录时间、地点、在场人物、持有物、发生的行动，以及谁通过什么途径知道了什么。观众知道的和角色知道的分开记。\n\n| 场次 | 文本证据 | 状态进入 → 离开 | 谁知道什么 | 待核实 |\n\n时间缺失时用先后顺序，不编日期。镜头之间省略的日常动作可能是合理的，出现异常不等于一定出错。\n\n【重点检查】\n- 时间：通勤、伤口恢复、昼夜和倒叙位置，是否和已写条件冲突？\n- 信息：角色的推断有没有证据或合理的误会？后面才揭露给观众，不代表角色之前不知道。\n- 道具：钥匙、信件、手机等，有没有交接、复制或其他合理途径？\n- 空间：某人能不能听见、看见或及时赶到？画外发生的事不自动当作不存在。\n- 世界规则：能力、禁令和代价是否一致？例外有没有说明或伏笔？\n\n【结论分三级】\n- 确定冲突：有互相不能同时成立的文本证据；\n- 需要补交代：可以成立，但缺了关键的过渡；\n- 待确认：缺少时间、距离、前文，或者是不可靠的叙述。\n例：第 2 场写唯一的钥匙锁进柜子，第 4 场人物拿钥匙开门，但中间第 3 场没给我——先报告“缺少交接依据”，不能直接判穿帮。\n\n【交付】列出冲突两端的位置、影响和最小修复建议。我只要求检查时不自动重写；改完之后只复查受影响的那条链。\n```\n"}, {"id": "3.22", "title": "剧本评审与修复：问题卡 + 意见先核验 + 改坏了就回退", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/review", "path": "03-revision/review/3.22-剧本评审与修复.md", "body": "\n**用法**：剧本要评审、要按意见改稿时用。它把“评审”和“修改”分成两个角色：先评后修，评审只给有原文证据的问题卡，修改前先核对每条意见在当前版本是否还成立，改完检查有没有改坏（逻辑顺了但人物平了、笑点和压迫感没了等）。适合编剧组收到多方修改意见、意见互相打架时用。和 3.16（问题五栏卡）的区别：3.16 是一张卡怎么写，这条管整个“评审—核验—修复—回退”的流程。\n\n**来源**：[short-drama-factory](https://github.com/lixiaoxiao9888-create/short-drama-factory) references/script-doctor-protocol.md，MIT（收集人提供，11/06 继续深挖）。摘编：去掉了机检编号，“红果档位”相关的部分保留了通用判据。\n\n**提示词正文**：\n\n```\n请按“先评后修”处理下面的剧本。评审和修改分开输出：评审报告里不夹带改好的正文，修改交付里不夹带长篇自评。\n\n【一、两个角色】\n- 评审官：判断这稿是否兑现了约定的观看体验，给出可以核对的问题和修订目标；不代替作者改稿（除非我明确要改）。\n- 修复器：在授权范围内做最小足够的改动，交付可以直接替换的完整稿；不擅自扩大范围、不重写未授权部分、不“顺手美化”。\n\n【二、评审强度（我会指定，没指定用快审）】\n- 快审：只读指定范围，给 3~5 条最影响观看的问题 + 必须保留的长板。\n- 专项：只查某一项（对白 / 断章 / 连续性 / 付费卡点），其他维度标“未测”。\n- 终审：通读约定范围，给完整维度状态和没读到的部分。读不完就说读不完，不宣称完整通过。\n\n【三、问题卡】\n编号（同一根因合并成一条）｜范围（第几集第几场）｜按影响定级｜证据（逐字短原文）｜观察到什么｜为什么损害目标｜想改善的观众体验（写体验，不写“把第 3 句改成……”）｜必须保住的现有长处｜允许的改动范围｜连带要复查什么｜状态（待处理 / 已解决 / 已否决 / 待核）\n证据必须逐字核对原文；找不到支撑就标“待核”，不凑问题数量。\n\n【四、按影响定级】\n- 阻断：核心观看承诺失败——胜负看不懂、结局靠无来源信息成立、全篇对白难懂、约定的核心情绪始终没发生、该断章的地方没有钩子。\n- 重大：重要段落或反复出现的问题明显削弱体验，例如一整集攻防原地打转、主角的结果不是自己争来的。\n- 局部：单场信息复述、称呼不统一、某句台词不符合身份。\n单一关键错误也可以是阻断；次数多不等于阻断；任何关键失败不能被其他长处抵消。不输出总分和爆款预测。\n\n【五、修改前先核验意见】\n修复器拿到问题卡，第一件事是核对它在当前版本是否成立。以下情况尤其要复核：意见来自旧版本；没有引原文；把直说、沉默、有依据的次优选择一律判差；没说明适用条件；意见的前提已经被正文满足。\n每条意见四选一：采纳 / 部分采纳 / 否决 / 待核，并简述理由。审稿人的审美偏好不是命令，直白还是留白、强爽还是温情，按项目目标判断。\n\n【六、修复纪律】\n1. 先读要改的段落和前后依赖，明确要改善什么、必须保留什么。\n2. 选够用的修复层级：表达 → 场景 → 单集 → 核心关系 → 单元重构。局部补丁解决不了就回上游整段重写，但能微调就微调。\n3. 优先替换，确实缺了才补；先删重复说明、重复证明同一种情绪的段落。\n4. 修了某一句，扫一遍同一集里所有同类问题。\n\n【七、改坏了就回退】出现任一项，回滚或换写法：逻辑更顺了，但人物更平了；笑点、压迫感、亲密感、缺陷或余味消失了；情绪被提前解决了；风格化的完整句被改成统一的碎句；为了过检查而注水或删掉必要过程。\n同一个问题连续两次修改没有改善，就换写法、缩小范围或回到上游构思，不无限循环，也不假称通过。\n\n【交付】评审：结论与最大影响 → 必须保留的长处 → 按优先级排列的问题卡 → 下一步。修改：完整替换稿 + 每条意见的处置结果。\n```\n"}, {"id": "3.16", "title": "有依据的改稿：问题五栏卡", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/review", "path": "03-revision/review/3.16-有依据的改稿.md", "body": "\n**用法**：要 AI 审一部剧本、给修改意见时用。它要求每个问题都写出“位置、原稿写了什么、为什么是问题、确定程度、最小改法”，避免 AI 泛泛地说“第二幕拖沓”“人物不够立体”。审完要直接改，也可以继续用这段。\n\n**来源**：[geslie1/kunka-screenwriting-master](https://github.com/geslie1/kunka-screenwriting-master) plugins/kunka-screenwriting/skills/kunka-revision，MIT（11/02 整理人新增到收集页面）。原文基本照录，删去了多文件版本控制的说明。\n\n**提示词正文**：\n\n```\n请审读并修改下面的剧本。先识别我想解决的问题与不可改变的内容。只有片段时明确覆盖范围，不能宣称已经审查完整剧本。\n\n【两种任务】我要审读：给问题、证据和可执行改法。我要直接改：完成修改并简要说明。我只问某处，不自动重构整部作品。\n\n【按影响排序】先查故事是否成立：重要行动缺依据、因果矛盾、关键设定前后不一。再查观众体验：信息重复、铺垫与回收失衡、情感跳跃。最后处理语句和排版。优先级来自对作品目标的影响。\n\n【每个问题按五栏写，数量以实质问题为限】\n位置：第几集、哪一场，或一句短引文\n观察：原稿实际写了什么\n影响：为什么妨碍这次的作品目标\n判断：明确矛盾 / 依赖前情 / 风格建议\n修法：最小改动，以及会影响到后面哪些位置\n\n没有页码时用场次和短引文定位，不编页码。不把“我更喜欢”写成技术错误。\n\n【实际修改】选择能修好问题、又最少改动已确认设定的方法。如果必须改关键结局或人物关系，先完成不依赖该改变的部分，再把分歧列出来让我决定。改完检查问题是否消失，并检查相邻场次的动机、时间和谁知道什么。\n\n【完成说明】分成三类：已经改动的、只提出建议的、还缺材料的。\n```\n"}, {"id": "3.6", "title": "剧本五席圆桌审核（两位主编 + 三类观众）", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/review", "path": "03-revision/review/3.6-剧本五席圆桌审核.md", "body": "\n**用法**：一批剧本（比如前 5 集或前 10 集）写完后，把这段和剧本一起发给 AI，让它模拟五个评审角色分别打分，再汇总出等级和返修清单。适合在交给编剧群反馈之前先自查一轮，也可以作为「剧本审核标准」的参考。注意：这是 AI 模拟的评审意见，不能当作真实观众数据。\n\n**来源**：[漫剧老李 manju-laoli-skill](https://github.com/lixiaoxiao9888-create/manju-laoli-skill) sd-script-engine/references/roundtable-review.md，MIT（收集页面）。原文约 5 万字，这里摘编了五个席位、十维评分、六项硬门和等级标准，去掉了文件交接和台账格式。\n\n**提示词正文**：\n\n```\n请模拟以下五位评审，先各自独立审读这一批剧本（互相不参考），再汇总。每位评审都要指出具体位置（第几集/第几场/哪句台词），不能只给笼统评价。\n\n【五个席位】\n1. 故事主编（权重 25%）：改编是否忠于原作的事实、人物动机、关系和关键台词；这一批能否用“因为—但是—于是—结果”连续复述；每集有没有目标、反制、换策、代价和局部结果；人物和关系的变化是在累积还是被重置。不得因为“更刺激”就原谅跑偏原作。\n2. 商业主编（权重 25%）：前 10 秒有没有可见爆点、人物处境和紧迫感；冲突是否升级，主角是否主动；爽点/甜点/虐点/悬念有没有建立、延迟、见证和兑现；集尾是否在给了一点回报之后留下具体的下一步；同一种冲突、羞辱方式、钩子是否重复太多。不得把吵闹、打脸次数当作节奏。\n3. 题材核心观众（权重 17%）：类型期待有没有被满足或被破坏，在哪里；角色是否讨喜；有没有名场面潜力；想不想追更。\n4. 信息流新观众（权重 17%）：假设没看过简介和上一集。前 10 秒能否知道谁遇到了什么麻烦；人名、关系、时空和规则是否一次就懂；哪里需要倒回去看；哪里会划走；看完能否复述这集发生了什么。\n5. 连刷挑剔观众（权重 16%）：假设刚连看了上一批。上集结尾有没有在本集开头兑现；信息、关系、伤势、道具、情绪有没有莫名复位；连续三到五集是否重复同一套路；钩子是否按期兑现还是一直拖。\n\n三位观众各给一个追更意愿：必追 / 会追 / 可能弃 / 弃。\n\n【十维评分】每位评审对以下十项打 0~10 分（括号内为权重，合计 100）：\n改编忠实度（12）、故事清晰完整（13）、冲突与策略推进（10）、节奏与信息密度（10）、爽点兑现（10）、集尾钩子与点下一集欲望（12）、角色魅力（10）、台词可演性（8）、单集可懂与上下集承接（8）、同题材差异化（7）。\n个人总分 = Σ(维度分 × 权重) ÷ 10；综合分 = 五人总分按席位权重加权。\n\n【六项硬门】任一不通过，直接判为“未达标”：\n1. 没有未经授权的核心改写；2. 没有碎片化或因果断裂；3. 上下集状态连续；4. 首看观众能看懂人物、困境、目标和结果；5. 钩子有来源、有兑现，本批没有失约；6. 价值导向与内容合规没有阻断性问题。\n\n【等级】\n- S（强爆款潜力）：综合分 ≥90，两位主编 ≥88，五人都 ≥80，至少两位观众“必追”，硬门全过。\n- A（有平台竞争力）：综合分 80~89，两位主编 ≥78，五人都 ≥70，至少两位观众“必追”或“会追”，硬门全过。\n- B（基础成立，未到爆款）：综合分 70~79，硬门全过。\n- 未达标：综合分低于 70，或任一硬门不过。\n\n【输出】\n1. 五位评审各自的十维分数、个人总分、主要问题（附位置）；\n2. 六项硬门逐条 通过/不通过；\n3. 综合分和等级；\n4. 返修清单，按优先级排序：必须改（影响硬门）/ 建议改 / 可选优化，每条写清楚改哪里、为什么、怎么改。\n```\n"}, {"id": "3.7", "title": "剧本质量门 10 条（自检清单）", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/review", "path": "03-revision/review/3.7-剧本质量门-10-条.md", "body": "\n**用法**：剧本写完后让 AI 逐条自查，适合交稿前快速过一遍。和 3.6 相比这是「硬指标」检查，不打分。\n\n**来源**：[shuohao-skills](https://github.com/eternityspring/shuohao-skills) skills/novel-script，Apache-2.0（1.5k star，收集页面）。原仓库用脚本自动检查，这里改写成了让 AI 自查的指令。\n\n**提示词正文**：\n\n```\n请按以下 10 条逐集检查剧本，每条给出 通过/不通过，不通过的写出位置和修改建议：\n1. 每集时长在目标时长 ±15% 以内（台词按 4.5 字/秒折算，每个动作约 2.5 秒）；\n2. 单句台词不超过 35 字；\n3. 每句台词的说话人都在本场出场人物里，画外音标明 VO；\n4. 每集都有写在纸面上的钩子悬念；\n5. 钩子在全集前 3 拍内就开始兑现（冷开场直接接上集悬念）；\n6. 每场至少有一个动作节拍，不是纯对话；\n7. 动作描写里不夹带带引号的台词；\n8. 每集都能指出一个明确的爽点；\n9. 出场角色和人物表一致，没有凭空多出来或改了名字的人；\n10. 场景、光线（日/夜）、道具和前后集对得上。\n```\n"}, {"id": "3.13", "title": "审稿铁律 38 条（红果 Top100 操盘经验）", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/review", "path": "03-revision/review/3.13-审稿铁律-38-条.md", "body": "\n**用法**：审剧本或改稿时，把这 38 条和剧本一起发给 AI，让它逐条对照指出问题。规则来自作者参与的爆款拆解和改稿实战，偏商业判断，和 3.6（五席圆桌打分）、3.7（硬指标自查）可以搭配用。\n\n**来源**：[Vi7QY/screenwriter-skill](https://github.com/Vi7QY/screenwriter-skill) references/iron_rules.md，MIT（10/30 从 awesome-short-drama-skills 清单里发现）。规则原文照录，只去掉了来源类型一栏（原文标注来自“S+级古装权谋爆款”“女频仙侠改稿实战”等）。作者说明为“红果 Top100 操盘经验”，具体项目未公开。\n\n**提示词正文**：\n\n```\n请对照以下 38 条铁律审查剧本，逐条标出“符合 / 违反 / 不适用”，违反的写出位置（第几集、哪一场）和修改建议。最后按影响大小列出最该先改的 5 处。\n\n一、结构与节奏\n1. 第一集必须建立权力秩序。\n2. 世界观要简洁但容量大。\n3. 每集结尾必须有情绪钩子。\n4. 五分钟三钩子：暴力/刺激（钩子1）→ 情感（钩子2）→ 亲情/共情（钩子3），五分钟内完成。\n5. 负反馈可以给很多，但必须在某个节点给足够强的正反馈，否则观众放弃。\n6. 高层博弈对话要凝练精准，一两句话说清权力与利益关系。\n7. 世界观核心设定必须一句话说清，说不清就是太复杂了。\n8. 重复结构 + 变化情绪 = 熟悉但不无聊：每个篇章框架可以相同，情感内核必须不同。\n9. 关键信息必须前置：反派动机、角色关系、核心设定不能拖到第 10 集才揭示。\n10. 核心设定和道具要反复提醒，在关键节点反复出现。\n11. 正反馈不足是最大的问题：第一集不能只有受虐，必须给观众一个明确的“爽”。\n\n二、角色与人设\n12. 女主从不需要被救，只需要被看见。\n13. 配角必须有完整的人性弧线。\n14. 女角色要有高光情节。\n15. 权力秩序不靠自报家门，靠别人的反应：一品大员对你弯腰，观众自然知道你多大。\n16. 女主可以很强，但代价必须可见；无代价的无敌才是问题。\n17. 反派的恶必须有可理解（但不可认同）的理由。\n18. 设定好不等于写出来了：人设小传里有、剧本里没有对应情节和台词，就等于没有。\n19. 角色状态切换（失忆/未失忆、弱/强）必须有明确规则，并提前说明。\n20. 扮猪吃虎必须有清晰动机：为什么隐藏、隐藏的代价、什么情况下不得不暴露——第一集至少回答两个。\n21. 短剧要做人物魅力，而不是人物弧光：魅力必须在事件中直接体现，不能靠铺垫背景。\n\n三、台词与表达\n22. 设定不靠台词说教，靠场景化叙事，让画面自己讲世界观。\n23. 一句台词要同时完成多件事：悬念 + 人设 + 动机。\n24. 冲突用台词吵出来，不要用内心独白，观众想看面对面的冲突。\n\n四、爽感与情绪\n25. 观众不想被虐，只想被爽：负反馈是铺垫，正反馈是目的。\n26. 笑点、燃点、感动点要设想观众会在评论区说什么。\n27. 女频逆袭剧的爽感要逐项兑现：遇到帅哥、变强、打脸、帮旧友、得财宝、撩人名场面、复仇成功。\n28. 爽感不只看有没有，还看够不够重：第一集的屈辱要让观众肉疼，打脸才有快感。\n29. 编剧的核心能力不是还原情节，是放大情绪：讲清楚只是及格线。\n\n五、感情线\n30. 感情线在有限篇幅里可以去拉扯化，干净利落地处理。\n31. 感情线的终极验证 = 知道代价后仍然选择留下。\n32. 甜宠剧不能过于清水，适当的肢体接触、暧昧台词、撩人场面是留存的必需品。\n33. 感情线需要事件支撑：说“我爱你”之前，必须有足够的共同经历和考验。\n\n六、金手指与设定\n34. 金手指必须在前三集说清，后续每个决策都要体现金手指在起作用。\n35. 给主角一个“交易规则”作为叙事引擎，每次交易都产生新悬念。\n36. 反派可以省笔墨：不出脸、画外音加台词交代存在感即可。\n37. 精改过的剧本和没改过的剧本，数据差距是数量级的。\n38. AI 制作只还原 30% 也能打出好成绩，说明内容是最大杠杆。\n```\n\n**注意**：第 24 条（冲突不要用内心独白）和 3.11（独白与旁白规程）方向一致；第 32 条涉及尺度，全年龄线按 7.1 合规红线把握，成人线另按「成人线与全年龄线分开原则」。\n"}, {"id": "3.11", "title": "独白与旁白规程（OS/VO 用在哪、用多少）", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "status": "二轮实测：已用于生产", "folder": "03-revision/shootability", "path": "03-revision/shootability/3.11-独白与旁白规程.md", "body": "\n> **实测（11/03 第二轮）：已用于生产。** 6.0【六】第 2 条“区分现场对白、OS、VO，不让角色为 OS/VO 做口型”即来自这里。\n\n**用法**：写剧本时作为 OS/VO 的使用规则发给 AI，或者拿来检查已经写好的剧本。正好对应 1.0 里指出的问题：「这一段大量的 OS 跟 VO，对应的视频画面是什么？」。核心一句话：独白不是禁区，是有配额的工具，写「具体的账」，不写抽象的情绪。\n\n**来源**：[short-drama-factory](https://github.com/lixiaoxiao9888-create/short-drama-factory) references/inner-monologue-vo.md，MIT（收集人提供）。摘编：去掉了机检编号。原作者注明，配额和位置规则是防注水的工程约束，不是平台官方规则；所举热剧例子来自 2026 年 9 月的抖音实搜。\n\n**提示词正文**：\n\n```\n写剧本时，内心独白（OS）和旁白（VO）按以下规则使用：\n\n【三个通道分开】\n- 台词：场内所有人都听得见，用来攻防交锋。\n- 内心独白（OS）：只有观众听得见，用来立住委屈、外化心事。\n- 旁白/字幕（VO）：只有观众听得见，用来点题转折、标时间。\n独白不是台词，不能拿独白代替本该发生的冲突。\n\n【只有这五种情况可以用独白】\n1. 委屈立住：情绪到顶后补最后一脚。例：我给他生了五个孩子。\n2. 点题转折：单元或全剧的转折处给一句定调。例：老实人周韶华反抗了。\n3. 立人设：一句话说清人物的能耐或立场。例：上山能打野猪。\n4. 心事外化：说不出口的话。必须和同场动作形成反差或补充，不能复述动作（▲ 已经拍了她攥紧围裙，独白就不能再说“我攥紧了围裙”）。\n5. 时间/年龄锚：重生、穿越时确认坐标。例：我竟然回到了42岁这年。（金手指本身不靠独白揭示）\n\n【四条禁令】\n1. 不用独白交代设定和前情（独白讲背景是最重的 AI 腔）；\n2. 不复述已经演过的动作；\n3. 不用独白代替冲突；\n4. 不连排：两条独白/旁白之间必须隔着动作或台词。\n\n【配额】\n- 90~120 秒一集：独白最多 1 处、不超过 25 字；旁白最多 1 处、不超过 12 字。\n- 150~195 秒一集：独白最多 2 处、每处不超过 30 字；旁白最多 1 处。\n- 60~90 秒漫剧：独白最多 1 处、不超过 20 字；旁白最多 1 处。\n- 转折集可以用，余波集不用；旁白每个单元最多 1 次。\n\n【位置】\n- 开头 3 秒不用独白（开场必须是冲突）；\n- 集尾断章不用独白（断章要落在画面或事件上）；\n- 独白放在“最狠那句话说完之后”，不放在之前（放之前等于预告，会提前泄气）。\n\n【写法】独白写“具体的账”，不写抽象情绪：\n- ✗ 我心里五味杂陈、思绪万千 / 这一切都要从三十年前说起 / 这一世我一定要让你们付出代价\n- ✓ 我给他生了五个孩子，他走那天我还在缝他的棉袄。\n三种模板：委屈账 = 数字/年份 + 付出 + 被辜负；点题句 = 主语 + 转折动词 + 短句；立人设句 = 能耐 + 具体场景。\n\n【题材差异】家庭伦理、中老年向：自述委屈接受度最高，但一集只给一次；重生逆袭：旁白和字幕用来点题，别和画面信息重复；男频爽剧：尽量不用独白，用动作和对手反应代替。\n\n请按以上规则检查剧本，列出每一处 OS/VO：属于哪种用途（或不属于任何一种）、是否超配额、位置是否违规、建议删除还是改写成动作或台词。\n```\n"}, {"id": "3.19", "title": "把内心戏写成能演的动作（意义与载体、可表演动词、VO 能演不说）", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "status": "已用于生产", "folder": "03-revision/shootability", "path": "03-revision/shootability/3.19-把内心戏写成能演的动作.md", "body": "\n**用法**：剧本里“她终于明白……”“他很心虚，内心挣扎”这类写不进画面的句子多时，把剧本和这段一起发给 AI，让它逐处换成演员能做、观众能看懂的动作。和 3.11（OS/VO 规程，已用于生产）配套：3.11 管旁白用多少、放哪里，这条管内心意义怎么换成动作，换完了自然就不需要那么多 OS/VO。剧本这一步改好，后面 6.0 的“不写镜头无法呈现的心理解释”就好落实。\n\n**来源**：[zenstory-ai/drama-skills](https://github.com/zenstory-ai/drama-skills) skills/short-drama-write/references/script-craft.md 第 4 节，MIT（收集页面第 9 条，11/04 深挖剧本部分）。摘编：去掉了规则编号和脚本统计口径。\n\n**提示词正文**：\n\n```\n请检查下面的剧本，找出只存在于作者说明里、演员演不出来的心理和认知，逐处换成可表演的载体。\n\n【一、区分意义和载体】\n例：作者意图是“她终于意识到父亲一直不相信她”。这不是不能写，而是要给它找载体，可选：\n- 行为选择：她停止解释，把准备交出的证件收回；\n- 证据反应：父亲先核对陌生人的签名，却把她的证词推到一边；\n- 空间动作：她从父亲身旁走到被质疑的人那一侧；\n- 关系动作：她把一直替父亲保管的钥匙放下；\n- 明确的声音：有意使用 VO，让主观声音成为叙事选择。\n载体不必把意义解释完，演员能执行、观众有依据推断即可。\n\n【二、用可表演的动词】\n优先写人物能做的事：压住、抽回、避开、递出、擦掉、停下、拆开、锁上、挡住、对齐、撕下、重新摆放。\n不要为了“看得见”堆满微表情；动作的价值在于改变空间、物件、注意力或关系，不是记录每次眨眼。\n弱：他很心虚，眼神复杂，内心充满挣扎。\n好：他把盖章页翻过去，只递出没有签名的那一面。门外的人伸手时，他仍按着纸角。\n后者没有说出全部情绪，却给了演员目标、阻力和手里东西的状态。\nAI 生成时少见的精细动作（运动中截住某物、以厘米计的位移、复杂的双手配合），优先用常见动作的组合和时机来承担同一份戏剧信息；剧本阶段先标出风险，不提前削弱戏剧作用。\n\n【三、让反应承担后果】\n反应不是每句台词后面配一个表情。值得写的反应至少做到一项：证明这句话击中了对方；暴露对方早就知道；改变下一步策略；转移现场的权力或注意力；造成后面要接的连续性事实。重大信息或关系动作之后，给受影响的人一个有后果的反应；普通的一来一回不需要逐句配动作。\n\n【四、能演的不说】\n- 画面已经演出来的事，VO 不再说一遍。她当众把欠条撕成两半，已经说明不认这笔账，旁白就不必再补“这钱我不会还”。反过来，台词已经说清的事，下一场也不再演一遍。两种载体重复时，留演出来的那个。\n- VO 只承担画面给不出的东西：和画面相反的判断、被隐瞒的打算、跨时间的认知。\n- 内心独白能外化就外化：大段“我穿越了”“我一定要……”换成一个动作加一句台词；让旁人把心里话说出口；让手机屏幕、证件、胎记这类物件交代身份；回忆只保留当前行动需要的闪回。系统提示交给画面文字，不让系统声替主角想事情。\n- 痛点写成观众亲眼看见的一场戏。“他一直被人看不起”不是痛点；“酒席上，反派当众把酒泼在他脸上”才是。观众看见了被压下去的那一下，后面的回报才有落点。\n\n【输出】逐处列出：位置｜原句｜问题（为什么演不出来）｜改写后的动作或台词。审查时引用具体句子说明为什么无法表演，不要只凭出现了心理词就下结论。\n```\n"}, {"id": "3.1", "title": "Seedance 2.0 剧本改编准则", "chapter": "三、剧本修改与精修", "license": "内部 1.0", "folder": "03-revision/shootability", "path": "03-revision/shootability/3.1-Seedance-2.0-剧本改编准则.md", "body": "\n**用法**：见上方 1.0 原用法。\n\n**提示词正文**：\n\n```\nSeedance 2.0 剧本改编准则（执行版）\n\n一、 结构与排版\n单行原则： 场景行、人物行、动作行（以 ▲ 开头）、台词行、转场行必须严格独立成行，绝不混排。\n动作明确： 动作行需由“主语+动作+对象”组成（如：▲陆骁反手握住苏清影），严禁用形容词代替行为。\n\n二、 台词规范\n字数限制： 单句台词（含标点）严禁超过 25 字。\n拆分原则： 超过 25 字必须拆分，拆分后单句不得超过 15 字，确保语音断句自然、AI 表情不僵硬。\n\n三、 括号标注规范（关键）\n内容逻辑： 括号 () 内必须是 “动作 + 情绪” 或 “单一动词/形容词”。拒绝废话描述，必须是指导角色“怎么演”。\n换行重标： 只要台词换行，无论是否同一人，每一行都必须重新标注，不得省略。\n情绪递进： 同一场戏内，标注词严禁重复，应根据角色心理变化体现层级（如：由“冷笑”递进至“咆哮”或“森寒”）。\n禁止堆叠： 标注文字限制在 1-2 个词，拒绝长句子。\n\n四、 视觉生成准则（适配AI）\n具象行为优先： 尽量写入涉及道具、位置、肢体交互的动作指令（如：指着鼻子、猛地拍桌、贴耳低语），以触发 Seedance 2.0 的高水准画面重构。\n镜头语言： 动作行中可适当穿插简单的镜头指令（如：镜头推进、特写、俯拍），引导画面重心。\n\n【准则自检范例】\n错误写法：\n陆骁（语气非常严厉，而且很生气）：现在的政策变了，我们这是正当买卖，根本不是什么投机倒把。\n\n正确写法（适配版）：\n陆骁（一字一顿，冷峻）：现在的政策早就变了。\n陆骁（挥手，严肃）：这是正当买卖。\n陆骁（冷哼）：根本不是什么投机倒把。\n```\n"}, {"id": "3.25", "title": "导演剧本微调：先修“不可拍”，再调动作、台词、画面", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/shootability", "path": "03-revision/shootability/3.25-导演剧本微调.md", "body": "\n**用法**：剧本定稿后、拆分镜表之前用，是从导演角度做的最后一轮微调。第一步只把“角色觉得 / 气氛变得紧张”这类拍不出来的句子改成看得见的动作，同时明确 OS/VO 属于正常的声音呈现，不要当问题改掉。第二步按节奏需要拆或合动作、延长或缩短台词、删掉没有用的画面。和 3.9（剧本删减）、3.11（独白与旁白规程）、3.18（AI 可拍性改写）配合用。\n\n**来源**：[山音超级导演大师](https://github.com/Shanyin-ai/shanyin-director-master) director-master/references/core-methodology.md “剧本微调原则”和“叙事目的分析法”，MIT（作者要求保留 @山音 署名）。摘编。\n\n**提示词正文**：\n\n```\n请对这一集剧本做导演微调。只改表达，不改故事。\n\n【第一步：视听化修正（小手术）】\n只改摄影机拍不到的内容：\n- “他觉得 / 她感受到 / 他意识到……” → 改成可见的动作或表情；\n- “气氛变得紧张” → 改成具体的环境变化或人物的身体反应。\n以下是正常的视听语言，不要改：特效描述、内心独白和旁白（角色（OS）：……）、音效和配乐指示、字幕和画面文字。\n\n【第二步：每场戏先问“为什么必须存在”】\n逐场写出它的叙事功能（交代信息 / 立人物 / 推进或升级冲突 / 埋或回收伏笔 / 节奏呼吸点），每场一到三个。\n找不到任何功能的场次，建议删除或合并。\n\n【第三步：四个微调焦点】\n1. 动作节奏\n   - 情感重场：把笼统动作拆成多个具体小动作，给观众时间感受情绪。\n     例：“她打开信，看完后放下” → 拿起信封、翻看背面、撕开、展开、视线下移、折好放回、手指在信封边缘停一下。\n   - 过场：把碎步动作合成一个干脆动作。\n     例：“他站起来，走到门口，打开门，走出去，关上门” → “他起身出门。”\n2. 台词\n   - 关键情感节点可以延长：加犹豫、重复、岔开，让“说不到点上”本身成为表演；\n   - 冗长解释压成一个词或一句话，必要时删掉台词，用沉默代替；\n   - 改得更口语、更贴人物此刻的情绪，但信息不变；\n   - 调断句：“我不想……走”和“我——不想走”节奏不同，每个断句都是可能的切镜点。\n3. 画面\n   - 情感重场可以加细节表演（例：听到坏消息先笑了一下，再崩溃）；\n   - 既不推进情节、也不传递情感、也不建立氛围的画面，删掉；\n   - 同一个目的有两种画面可选时，选视觉冲击更强的。\n4. 呼吸点\n   不要把所有安静时刻都压掉，保留必要的停顿场。\n\n【不做的事】\n不改核心戏剧动作，不改人物弧光方向，不加新的主要角色或情节线，不把旁白、OS、特效、字幕当成“不可拍”去改。\n\n【输出】\n按场列出：原句 → 改后 → 理由（属于哪一步、哪个焦点）；最后列出建议删除或合并的场次。\n```\n\n---\n"}, {"id": "3.18", "title": "剧本 AI 可拍性改写：难生成的戏怎么改", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/shootability", "path": "03-revision/shootability/3.18-剧本-AI-可拍性改写.md", "body": "\n**用法**：剧本定稿后、做分镜表之前，把剧本和这段一起发给 AI，让它标出 AI 视频难生成的场面，并给出不改剧情的改写方案（内心戏改成可见动作、打斗改成特写加音效、大场面改成局部等）。对应专用提示词（6.0）【一】第 4 条“难以生成的镜头可以调整”——在剧本阶段先改好，分镜阶段就少返工。\n\n**来源**：[YubAI-DramaFlow](https://github.com/xiaoqinyudan2022-hue/YubAI-DramaFlow) references/剧本AI适配原则.md + templates/AI可行性评估模板.md，MIT（收集页面，11/03）。摘编：去掉了 emoji、评分签名表和案例。**注意**：原文的“擅长/困难/几乎不可能”是作者 2024 年按当时工具总结的，我们现在用 Seedance 2.5 + 画布素材，双人戏、人物一致性已经不是大问题，下面的难度分级请按实际出片情况调整；有价值的是后半部分的改写方法。\n\n**提示词正文**：\n\n```\n请检查下面的剧本在 AI 视频生成上的可拍性，标出高风险场面，并给出不改变剧情结果的改写方案。\n\n【一、风险分级（按我们实际使用的模型调整）】\n- 低风险：固定或缓慢运镜；单人近景、特写；转身、抬手、行走、坐下等简单动作；室内柔光、暖光、黄昏。\n- 中风险：吃东西、拥抱、奔跑；雨雪夜景；精细道具（书页、茶杯）；三人以上同框。\n- 高风险：打斗、舞蹈等复杂肢体动作；写字、弹琴等精细手部动作；需要看清的文字内容；爆炸、法术等大特效；千军万马等大场面；强闪光、极暗环境。\n\n【二、改写方法（只改呈现方式，不改事件结果）】\n内心戏：\n- 心想“我一定要成功” → 眼神坚定，握紧拳头；\n- 内心纠结 → 低头沉默，手指无意识地绞着衣角；\n- 回忆过去 → 叠化转场 + 旁白。\n动作戏：\n- 激烈打斗 → 拔剑特写 + 音效 + 关键一击的结果镜头；\n- 奔跑追逐 → 回头特写 + 脚步声；\n- 舞蹈 → 舞姿定格 + 音乐。\n特效戏：\n- 法术攻击 → 手部特写 + 光效 + 音效；\n- 爆炸 → 火光闪烁 + 音效 + 远景；\n- 暴风雨 → 人物在雨中 + 雨声 + 闪电光。\n大场面：\n- 宫殿金碧辉煌、宫女成群 → 镜头 1 主角端坐特写；镜头 2 宫女剪影；\n- 战场刀光剑影 → 镜头 1 主将拔剑特写；镜头 2 战场远景虚化。\n\n【三、场景与人物控制】\n- 相近场景合并（同一地点不拆多场），能复用的场景复用，室内优先。\n- 主要角色 2~3 人详细设计，次要角色 1~2 人可用侧影、背影，群演省略或虚化。\n- 主角单人镜头尽量占多数。\n\n【输出】\n1. 高风险场面表：位置（第几集第几场）｜原文｜风险类型｜改写方案；\n2. 改写后检查：情节是否完整、情感表达是否还在、叙事是否流畅。\n```\n"}, {"id": "3.20", "title": "分遍修订法：一遍只改一种问题", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/craft", "path": "03-revision/craft/3.20-分遍修订法.md", "body": "\n**用法**：一集剧本问题多、不知道从哪改时用。让 AI 每次只做其中一遍（比如先做“因果遍”，再做“场景遍”），改完一遍确认了再做下一遍，避免一次全改把已经确认的东西改坏。最后的“扫读遍”很实用：用比平时快的速度扫一遍，记下需要停下来想的地方——那通常是指代不清或信息挤在一起，也正是 6.0 要求“避免多个他、她造成指代混乱”的源头。\n\n**来源**：[zenstory-ai/drama-skills](https://github.com/zenstory-ai/drama-skills) skills/short-drama-write/references/script-craft.md 第 9 节，MIT（11/04 深挖）。摘编：去掉了“所有权遍”和指向其他文件的引用。\n\n**提示词正文**：\n\n```\n请按下面的顺序修订剧本。每一遍只解决一种问题，保护已经确认的选择。我说做哪一遍，你就只做那一遍。\n\n1. 因果遍：在每个主要动作旁写——它因何发生？人物为何此刻选择它？对手如何回应？它改变了什么？下一个动作为何因此被迫发生？删掉可以互换顺序、又没有后果的重复。\n2. 选择遍（只在本集有“艰难选择”时做）：标出两个仍然可走的方向，只读剧本，检查观众能否说出各自的价值、人物为何不能兼得、这次行动新增了什么损失。普通决定不要硬补第二条路。\n3. 证据遍（只在重大判断依赖可争议证据时做）：写出“证明了什么 / 没证明什么 / 还有哪些解释”，再决定当场验证、保留不确定还是有意延后。不要给普通事实加取证流程，也不要破坏有意保留的误会和悬念。\n4. 场景遍：标出每场必要的变化和退出状态。没有变化的场景：与相邻场合并；让证据、关系或决定在这里真正改变；或者删掉，把必要信息挪到正在发生的冲突里。\n5. 可表演遍：圈出只存在于作者说明中的认知和情绪，为关键项选择行为、证据、空间、关系动作或有意的声音；不要给每个形容词补微表情。\n6. 具体性遍：替换不产生行动的泛词——“资料”是登记页、录音还是钥匙卡？“威胁”具体让谁失去什么？“关系破裂”通过哪个承诺、称呼、手里的东西或站位变化出现？只补对识别、因果、表演或连续性有用的细节。\n7. 生产事实遍：检查画面里要能读出的文字、声音、画外对白、转场和连续性。去掉模型、镜头和素材说明，留给分镜和视频环节。\n8. 声音与潜台词遍：朗读台词，检查删掉角色名后，能否凭策略、关系和措辞认出是谁在说，而不是靠口头禅。\n9. 扫读遍：用比平时快的速度扫一遍，不停顿、不回看，然后回答：\n   - 有没有需要停下来才想明白的地方（谁说的这句、刚才那个人做了什么、这个东西从哪来）？记下位置——通常是信息挤在一起、指代不清，或者一句台词承担了太多任务；\n   - 扫完后情绪上有没有起伏？还是只知道发生了一串事？答不上来，说明每场都成立，但合起来没有形成运动。\n10. 经济性遍：最后检查四类冗余——没要求的精确数字和记录、为同一结论叠加的验证、复述动作的标签或对白、回报之后多个同方向的决定或解释。删掉没有新作用的，保留必要的选择、证据、时限、人物和连续性。\n\n每一遍结束时列出：改了哪几处、为什么改、哪些地方有意保留。会改变剧情走向的方案先列出来让我确认，不直接改。\n```\n"}, {"id": "3.2", "title": "微调指令", "chapter": "三、剧本修改与精修", "license": "内部 1.0", "folder": "03-revision/craft", "path": "03-revision/craft/3.2-微调指令.md", "body": "\n**用法**：接下来就是对剧本进行微调，这个阶段需要大量的指令，以下是我用到的部分指令，可以酌情增加或减少，需要针对剧本进行调整。可以自行补充\n\n**提示词正文**：\n\n```\n1. 台词长度不再机械卡死\n“15字以内”应该是精炼倾向，不是绝对切割标准。\n以后优先顺序是：\n1.语义完整。\n2.情绪连贯。\n3.符合人物说话习惯。\n4.推动剧情。\n5.在此基础上尽量精炼。\n不能为了少几个字，把一句有情绪的话拆成几句机器式对白。\n\n第XX集的剧本字数过多了，请在不改变第六集主线剧情的情况下，删减台词、动作、环境描写等内容，要求：删减后的剧本内容台词连贯，动作正确，表达内容不缺失\n```\n"}, {"id": "3.10", "title": "写作红线与潜台词", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/craft", "path": "03-revision/craft/3.10-写作红线与潜台词.md", "body": "\n**用法**：写作或改稿时，把这段作为「写作红线」发给 AI。原文是一整套编剧提示词（约 13 万字，覆盖概念短片、长片、剧集），作者说明可以把整份文件直接拖进任何 AI 对话框使用；这里只摘了最通用的写作红线和潜台词部分。\n\n**来源**：[山音超级编剧大师](https://github.com/Shanyin-ai/shanyin-screenwriting-master)（作者 @山音），MIT（收集页面）。作者附加要求：使用时保留「@山音」署名；可以用来创作商业剧本，但不能把这个提示词本身拿去售卖。\n\n**注意和 1.0 的一处差别**：这里禁止的「括号暗示」，是指括号里写心理解释，比如「（其实是在掩饰紧张）」。1.0 要求的括号标注（「冷笑」「一字一顿」这类表演提示）不受影响，两者可以同时用。\n\n**提示词正文**：\n\n```\n写作红线（所有内容输出前先自检，发现问题先改再输出）：\n\n绝对不要：\n- 写心理描写（“他意识到”“她领会到”“内心涌起”）\n- 在括号里写心理解释（“（其实是在掩饰紧张）”）\n- 让角色用台词解释设定或主题\n- 说教片段、强行催泪、煽情独白\n- 过度的比喻、类比和书面化的 AI 腔台词\n- 任何摄影机拍不到的内容\n\n必须做到：\n- 台词口语化，像真人说话；不同角色用词、句子长短、习惯表达各不相同\n- 用动作代替解释：把所有台词删掉后，观众仍然能大致看懂发生了什么\n- 对话像冰山，只露一角：用动作、停顿、回避、转移话题表达真意\n- 不让角色说出双方都已经知道的事情\n\n示例：\n✗ “他终于理解了父亲的苦心。”\n✓ 他站在那里看了一会儿，然后把外套脱下来盖在父亲身上。\n✗ “我很害怕失去你。”\n✓ “你走的时候把那件外套带上。……外面冷。”\n\n开场自检：\n- 第一个画面有没有视觉冲击或悬念？\n- 观众在前 30 秒内会不会产生一个具体的疑问（“这是怎么回事？”）？\n- 开场是不是在交代状态的同时就在制造张力，而不是“先交代再开始”？\n\n场景自检：有心理描写吗（有就不合格）？有括号心理解释吗（有就不合格）？是不是用画面叙事？对话是不是太直白？有没有角色在“解释设定”而不是“应对设定”？\n```\n"}, {"id": "3.27", "title": "单集节奏体检：一集一个变化 + 按掉点位置找病因", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/craft", "path": "03-revision/craft/3.27-单集节奏体检.md", "body": "\n**用法**：单集写完后做节奏体检，或者拿到后台留存数据后反推哪里出了问题。先确认这一集交付了一个明确的“从 A 变成 B”，填不出来的集要合并或删掉；再按观众划走的位置对照病因表找最小修法。和 1.9（弱开场五种失效）、3.22（剧本评审与修复）配合用。\n\n**来源**：[liuxiao20051106-prog/ai-manga-drama](https://github.com/liuxiao20051106-prog/ai-manga-drama) references/craft-short-form-narrative.md，MIT。摘编。\n\n**提示词正文**：\n\n```\n请给这一集剧本做节奏体检。\n\n【一、这一集交付的“变化”】\n写出一句：本集什么从 A 变成了 B？（关系 / 处境 / 认知 / 情绪，四选一或多选）\n填不出来的，建议与相邻集合并，或删掉。\n\n【二、按区间检查（参考节奏，不要机械套秒数）】\n| 区间 | 观众在问 | 必须给的 |\n| 0–3 秒 | 值得停吗？ | 冲突、异常或强情绪画面；不放世界观和人物介绍 |\n| 3–15 秒 | 发生了什么？ | 一次交代清：谁、要什么、被什么挡住 |\n| 中段 | 接下来呢？ | 每 5–10 秒一个信息增量或小转折 |\n| 最后 20% | 结果是什么？ | 兑现本集回报（那个 A→B） |\n| 结尾 | 然后呢？ | 钩子：悬念 / 反转 / 情绪停在最尖处 / 停在选择的那一刻 |\n钩子必须由剧情自然产生；故意藏起观众已经看见的信息，会被当成剪辑错误。\n\n【三、掉点诊断】\n| 掉点位置 | 大概率病因 | 最小修法 |\n| 前 3 秒 | 开头是风景、介绍、标题 | 换成冲突画面或异常状态 |\n| 3–15 秒 | 人物和目标没交代清 | 用一句台词说完“谁、要什么、被什么挡住” |\n| 中段 | 连续平淡，没有新信息 | 插一个小转折或新信息，或整段压缩 |\n| 70% 处 | 观众已经猜到结果 | 提前给掉回报，把结尾留给新问题 |\n| 结尾 | 钩子太软或收得太干净 | 换钩子类型；最后一个镜头停在“未完成” |\n\n【四、常见失败】\n流水账（只有“然后”没有“因此”）→ 补因果；\n平淡（人物太顺）→ 加时间压力、代价或对手；\n太赶（一集塞两集内容）→ 拆集，不压缩情绪。\n\n【输出】\n本集的 A→B；逐区间的“有 / 没有 / 问题”；需要改的地方按“位置 → 病因 → 改法”列出。\n```"}, {"id": "6.0", "title": "视频专用提示词：分镜表 → 每集 4~6 段长视频提示词", "chapter": "六、视频生成（Seedance）", "license": "内部·二轮实测版", "folder": "06-video/core", "path": "06-video/core/6.0-说明.md", "body": "\n**用法**：生产中正在用的版本。把分镜表格（场次列表、分镜脚本表、生成意图、连续性表）和这段一起发给 AI，输出每集 4~6 段、每段不少于 15 秒、可以直接复制去生成的视频提示词。角色和场景由生成时关联的素材决定，提示词里不写素材名称和引用语法；段与段之间全靠文字衔接，不用首尾帧、宫格图。第三部分「统一视觉风格」是当前项目（末日废土写实）的，换项目时替换这一段。\n\n**来源**：内部。11/03 第二轮测试反馈，测试人在实际制作中综合 6.4、6.9、6.11、6.12、6.7、3.9、3.11、3.12 和以往积累的限制重新整理。反馈结论：生成内容更规范，镜头拆解更清晰，分镜结构比较合理，可按自己的喜好和脚本修改。本文其余视频端条目，今后都按「能不能补进这段专用提示词的某一部分」来收。\n\n**提示词正文**：\n\n```\n请对我提供的分镜表格和现有提示词进行整体梳理、润色与整合，将每集剧情合并为4～6个连贯的视频分镜提示词，每段时长不少于15秒，使用简体中文输出，可直接复制用于AI视频生成。\n\n【一、分段与剧情整合】\n\n1. 综合读取场次列表、分镜脚本表、生成意图和连续性表，按照剧情因果与动作顺序进行合并。\n2. 每段可以包含多个镜头，围绕一个明确的剧情任务展开，不强制一镜到底。\n3. 优先采用4段，每段不少于15秒；剧情容量确实需要时再采用5～6段。总时长必须与各段时长相符：4段至少60秒，5段至少75秒，6段至少90秒。\n4. 对重复、不合理、衔接生硬或难以生成的镜头，可以调整动作、切镜位置、机位和信息呈现方式，但不改变核心事件结果，不凭空增加人物、能力、证据或重大反转。\n5. 通过必要的动作过程、人物反应、停顿和环境变化自然展开剧情，不用重复对白、重复动作或无意义慢镜头凑时长。\n6. 每段突出一个核心事件，避免同时堆叠多人对白、复杂肢体交互、连续变形和多次换场。\n7. 成人镜头描述的要详细，有逻辑，包括阴茎如何插入阴道，射精等场景。\n\n【二、角色与场景处理】\n\n角色和场景会在视频生成时直接关联素材，不需要在提示词中展示素材名称、编号、引用语法、绑定关系或素材清单。\n\n人物五官、发型、服装、身材比例及场景静态外观，以生成时关联的素材为准，不重复描述，不自行重新设计。\n\n角色名称仅用于明确动作主体、对白归属和人物关系。场景只补充理解当前事件所必需的空间关系、进出方向及动态变化，不重复整套场景设定。\n\n【三、统一视觉风格】\n\n真人电影写实风格，末日废土世界观，融合暗黑奇幻与轻科幻工业美学。\n\n皮肤保留自然纹理，发丝清晰，布料、皮革和金属材质真实，具有可信的重量、受光和运动表现。\n\n采用低饱和冷灰色调，搭配有明确来源的局部暖光。面部曝光清楚，暗部保留细节，光影自然，画面具有电影层次。人物与环境处于同一光照体系中。\n\n表情细腻，动作符合真实人体结构、重心、惯性和接触关系。镜头运动平稳克制，景别、运镜和切镜服务于剧情。\n\n避免动漫感、游戏建模感、蜡像皮肤、过度磨皮、杂色色斑、锐化白边、塑料材质和过量特效遮脸。\n\n将以上要求自然融入各段，不在每段机械堆叠整套风格词。\n\n【四、动作、表情与镜头表达】\n\n每段按照以下顺序组织：\n起始状态 → 触发事件 → 主要动作 → 人物反应 → 事件结果与结束状态。\n\n具体要求：\n1. 写清谁对谁做了什么，人物的相对位置、动作方向、接触关系及结果，避免多个“他、她”造成指代混乱。\n2. 情绪由事件触发，通过视线、呼吸、姿态、停顿、表情和具体行动表现，不写镜头无法呈现的心理解释。\n3. 复杂动作保留必要的准备、发力、接触和收束过程，不把多个动作同时挤在一个瞬间。\n4. 明确景别、机位、主要运镜及切镜对象。运镜写清跟随谁、如何移动、停在哪里，避免无动机环绕、频繁变焦和过度晃动。\n5. 将原表“生成意图”中的有效信息融入画面，不把制作说明、修改意见或分析文字写进生成提示词。\n6. 段尾交代下一段需要继承的人物位置、姿态、道具归属和动作进度，无需刻意静止定格。\n\n【五、分镜衔接】\n\n1. 已经完成的动作不得在下一段重新开始，尚未发生的剧情不得提前出现。\n2. 区分切换观察角度与人物实际移动，不能因为切镜就让人物重新入场或改变站位。\n3. 保持人物状态、服装、道具归属、运动方向和光线逻辑一致；发生变化时必须有明确的剧情过程。\n4. 合理换场可以直接切镜，不强行保持全片空间连续。\n5. 每段补足理解当前动作所需的信息，不使用“同上”“接上段”等含糊表达。\n6. 全部通过文字描述衔接，不制作或依赖首尾帧、关键帧图、宫格图和分镜图。\n\n【六、对白、声音与时间】\n\n1. 保留必要对白，明确说话人及先后顺序。允许精简重复表达，但不改变关键含义、人物语气和信息释放顺序。\n2. 区分现场对白、内心独白OS和画外音VO，不让角色为OS或VO做说话口型。\n3. 对白长度与时间匹配，给动作、反应和停顿留出空间，不强行加速朗读。\n4. 原表没有对白的地方，不为了填满时长增加解释性台词。\n5. 默认不添加字幕和背景音乐，保留剧情需要的对白、环境声与动作音效。\n6. 每段使用从0秒开始、连续且不重叠的时间区间，合理分配动作、切镜和对白时间。时间标注用于表达先后与节奏。\n\n【七、输出格式】\n\n直接依次输出4～6段提示词，不附角色设定、场景设定、素材清单、分析过程或评分。\n\n第X段｜时长XX秒｜对应原镜头X—X\n\n视频提示词：\n按照“0—X秒、X—X秒……”组织连续画面，写清动作、表情、镜头、必要的光影变化和声音，最后明确结束状态。\n\n每段正文必须能够独立复制使用。时长设置放在标题中，不把操作说明混入正文。\n\n全部输出前自行检查：\n分段数量与时长正确；剧情推进清楚；没有重复动作、遗漏关键情节或提前揭示信息；人物、道具和空间状态连续；对白与动作能够在时间预算内完成；视觉要求统一且没有互相冲突的指令。\n\n提示词如下：\n```\n"}, {"id": "6.13", "title": "对白时长预算 + 动作链 + 可见表演（补专用提示词【四】【六】）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "patches": ["四", "六"], "folder": "06-video/patches", "path": "06-video/patches/6.13-对白时长预算+动作链+可见表演.md", "body": "\n**用法**：专用提示词（6.0）里有“对白长度与时间匹配”“复杂动作保留准备、发力、接触、收束”“情绪通过视线、呼吸、姿态表现”三条要求，这条把它们讲细了，可以整段补进 6.0 的【四】【六】后面，或者在某一段出片“赶词、台词被截断、动作糊成一团”时单独拿来查。最实用的是一个估算：中文自然语速约每秒 4 个字（不含标点）。\n\n**来源**：[zenstory-ai/drama-skills](https://github.com/zenstory-ai/drama-skills) skills/short-drama-video-prompts/references/performance-action-timing.md，MIT（收集页面第 9 条，之前只做了摘要，11/03 深挖）。摘编：去掉了原技能的编号、文件交接和海螺 H3 模型专用部分。每秒约 4.1 字是作者在一个模型上同一镜头生成 20 次得到的估算，只能辅助估算，以生成后回听为准。\n\n**提示词正文**：\n\n```\n写每一段视频提示词时，按以下规则检查动作、表演和对白能否在时长内完成。\n\n【一、先找不能删的主动作】\n- 哪个动作造成了信息、权力或情绪的变化？哪个反应让观众读懂这个变化？哪个动作必须完成才能到达这一段的结束状态？\n- 其余只是“让画面忙起来”的动作，最后再加，放不下就删。\n- 短段落常见的有效结构：一次决断动作 + 一次对方或自身的反应。\n\n【二、动作链要写出条件和结果】\n- 每个动作写清谁做、朝哪个方向或对象、结果是什么。\n- 接触动作按顺序写：先靠近，再触碰，再用力，物体才变化。\n- 东西换手要写清哪只手、什么时候松开、什么时候接住；同一时刻同一只手不能做两件事。\n- 位移要符合起点的距离和障碍。一段里要穿过房间、开锁、取东西、回身、再说完长台词，基本放不下，要拆段。\n- “同时”只用于能自然叠加的事（边说话边慢慢抬眼、雨声持续、镜头平稳跟随），不用来压缩互为前提的动作。\n\n【三、表演写可见的变化，不写情绪刻度】\n- 不要写“平静 30% → 紧张 70% → 震惊 100%”。\n- 从这五个通道选当前景别看得见的：目光（寻找、回避、锁定、失焦）；呼吸和声音（吸气被截断、语速变化、音量突然降低）；身体（重心后撤、肩膀防御、手指停住）；语言（停顿、吞字、改称呼、打断）；决断动作（收回手、让路、把东西推回去、关门）。\n- 远景不要依赖细微的眼神，近景不必用夸张的后退。\n- 写清角色对什么起反应，触发必须是画面里看得见或听得见的东西，不孤立写“她突然震惊”。\n- 反应镜按顺序写：触发 → 人物接收 → 当前景别读得到的可见反应 → 落点。\n- 多人在场时，只给真正发生变化的人写表演，不给每个人复制一个“震惊”；不同人可以早认出、晚半拍才让路、故意出声掩饰。\n\n【四、对白和时间一起算】\n- 中文自然语速约每秒 4 个字（不含标点），按偏慢的一端估。\n- 可用于说话的时间要扣掉：开口前的等待、不能同时进行的动作、别人说话的时间、末尾的反应。\n- 例：一段 7 秒，开头和结尾各留 0.5 秒，实际只剩 6 秒能说话；台词估计要 8~10 秒，就算写成“0—7 秒”也不成立，要延长这一段或按意思拆段。\n- 不要用加快语速、截断台词或悄悄删字来凑时间。\n- 对白太长时依次考虑：简化非必要动作，让对白成为主事件 → 让动作和对白合理重叠 → 延长或拆段 → 回剧本改台词。\n- 30 秒的长段只是容量变大，不代表塞进长台词后语速会自动自然。\n\n【五、超载征兆（出现就要精简或拆段）】\n- 一个角色要完成多次远距离往返和复杂的物件操作；\n- 多个角色都有独立的大动作，但这一段只需要一次揭示；\n- 长对白、强情绪转折、精细手部动作和复杂运镜挤在同几秒里；\n- 结尾没有时间落住，结束状态只是被一句“最后到达”宣告；\n- 为了赶时长，动作顺序违反接触因果，或者表演没有接收过程。\n精简顺序：删无故事功能的手势和环境动作 → 合并能自然连续的动作 → 只保留一个注意力中心，其他人只留必要反应 → 保住对白和结束状态 → 还放不下就拆段。\n```\n"}, {"id": "6.20", "title": "节拍认领对账：每个剧情节拍恰好由一个镜头承接（补 6.0【一】【七】）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "patches": ["一", "七"], "folder": "06-video/patches", "path": "06-video/patches/6.20-节拍认领对账.md", "body": "\n**用法**：6.0 末尾要求自检“没有遗漏关键情节、没有提前揭示信息、没有重复动作”，这条给了一个可以逐项核对的办法：先把分镜表或剧本拆成编号节拍，再让每一段、每一镜写明自己承接哪几个节拍。漏的、重复的、顺序乱的当场就能看出来。剧本改了以后，也能马上知道哪几段要跟着改。可以补进 6.0【一】第 1 条和【七】的自检。\n\n**来源**：[suihe1/short-drama-production](https://github.com/suihe1/short-drama-production) skills/novel-storyboard/SKILL.md，Apache-2.0（11/05 整理人新增到收集页面）。摘编：原技能是给 MiniMax H3 模型和配套脚本用的，这里只取模型无关的对账规则和压缩顺序。\n\n**提示词正文**：\n\n```\n写视频提示词前，先做节拍对账：\n\n1. 把分镜表（或剧本）按场次拆成编号节拍：每拍写清动作或台词、说话人、预估秒数。\n2. 每一段、每一镜写明承接哪几个连续节拍（例：第 2 段承接第 3 场节拍 4—7）。\n3. 规则：\n   - 每个节拍恰好被一个镜头主要承接，顺序不能乱；\n   - 补充信息、主观镜头或反应镜头只能“覆盖”已有节拍，不能为了多一个镜头重复承接同一节拍；\n   - 镜头不跨场次：换场景必换镜；\n   - 承接的台词秒数不能超过这一镜的秒数。\n4. 手机、电脑、文件上的关键信息：用插入镜头、全屏内容或可跟踪的屏幕来呈现；需要看清的精确文字交给后期合成。\n5. 需要提速时，优先压缩：已经读懂的建立镜头、重复信息、动作的尾巴；保护：关键内容的最低可读时间、转折之后的反应。总时长变化超过 15% 要说明原因。\n6. 输出前核对：所有节拍都被承接；没有节拍被两个镜头重复承接；没有后面的节拍提前出现；剧本改动后，列出受影响的段落。\n```\n"}, {"id": "6.19", "title": "微表情库：49 种情绪的可见表现（补 6.0【四】第 2 条）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "patches": ["四"], "folder": "06-video/patches", "path": "06-video/patches/6.19-微表情库.md", "body": "\n**用法**：6.0【四】第 2 条要求“情绪通过视线、呼吸、姿态、停顿、表情和具体行动表现，不写心理解释”。写到某个情绪点不知道怎么落成看得见的表现时，从这里按情绪找最接近的一条，挑一两个最有辨识度的细节写进那一段（短镜头通常“眼神落点 + 一个小动作”就够），不用整条照抄。复杂情绪可以两条叠用，比如“悔意涌上 + 强忍委屈”。\n\n**来源**：[liqi21cn/video-prompt-skill](https://github.com/liqi21cn/video-prompt-skill) references/micro-expressions.md，MIT（收集页面，11/03）。原库 50 条，其中第 20 条“放下执念”和第 21 条“邪魅试探”描述完全相同（作者说明是原图如此），这里只保留第 21 条。部分条目偏古装仙侠（师尊、剑修、魔尊），换成现代题材时只借表现、不借称谓。**注意**：表情里的“脸色苍白、嘴角沾血、额角冷汗”属于妆面状态，和关联素材冲突时以素材为准。\n\n**提示词正文**：\n\n```\n每条结构：眼神落点 + 眉眼变化 + 嘴角变化 + 呼吸停顿 + 小动作。\n\n【委屈、隐忍类】\n- 强忍委屈：眼尾泛红但泪不落，眉心轻拧又松开，嘴角向下压住，下巴轻颤，视线从对方脸上滑开像把解释咽回去。（适用：被误会、背锅、临别强撑）\n- 心疼不敢靠近：眉心软下来，眼眶有湿意但不前进，嘴角轻轻颤一下，手抬起又放下，声音压低。（适用：受伤探望、旧爱重逢、暗中守护）\n- 悔意涌上：眉头向中间压紧，眼底泛潮，嘴唇抿到发白，视线落在旧物或伤口上，呼吸发沉，肩膀微微塌下。（适用：迟来的道歉）\n- 病弱强撑：脸色苍白，眼睫低垂，嘴唇被抿压住咳意，额角冷汗细密，眼神却强行保持清明，手扶桌沿不让自己倒下。（适用：虚名场面）\n- 师徒克制：眼神想靠近却先压下，眉尾微垂，嘴角保持长定式平静，手指在袖中收紧，退半步拉开距离。（适用：禁忌情感、礼法压抑）\n- 忍痛告别：眼神停在对方脸上很久，嘴角努力扬起安抚的笑，眼眶发红，声音发轻，转身前手指短暂蜷缩。（适用：诀别、牺牲、放手）\n\n【紧张、慌乱、心虚类】\n- 秘密被戳破：听到关键字那一秒瞳孔微缩，眉尾轻跳，嘴唇张开半寸又合上，呼吸停顿，随后低头整理袖口掩饰慌乱。（适用：身份暴露、旧事揭穿）\n- 心虚躲闪：视线频繁扫向门口或地面，眨眼变快，嘴唇舔一下后抿紧，笑容提前出现却不自然，肩膀微缩。（适用：隐瞒计划、暗恋被问起）\n- 欲言又止：嘴唇微张，舌尖抵住上颚却没有出声，眼神在对方脸上停住又移开，眉心浅皱，手指轻敲衣角。（适用：告白前、道歉前、真相前）\n- 破防瞬间：原本平静的眼神忽然碎掉，瞳孔轻颤，嘴角努力维持却失败，鼻翼发酸，眼泪在眶里打转但还没掉。（适用：听到最痛的一句话）\n- 被反将一军：笑容在脸上短暂卡住，眉尾不可控地抽动，眼神迅速扫向旁人，喉咙轻咽，手指停在半空。（适用：权谋翻车）\n\n【心动、重逢、情感类】\n- 忽然心动：眼神先愣住再变软，嘴角不自觉上扬又立刻压下，睫毛轻颤，耳根微红，视线停在对方唇边或手指一瞬。（适用：初见、暧昧、救命后对视）\n- 失而复得：眼眶瞬间湿润，瞳孔放大，嘴角想笑却先发抖，鼻尖微红，手伸到半空停住，像怕一碰就消失。（适用：重逢、复活、久别归来）\n- 被温柔击中：眼神从防备转为柔软，睫毛轻垂，嘴唇抿出很浅的笑，脸颊微热，手指无意识摩挲衣袖。（适用：冷面角色被照顾）\n- 宿命感心动：对视时眼神微微发怔，眉眼像被旧梦照亮，嘴角还没笑出来先停住，呼吸放轻，周围声音仿佛远去。（适用：前世今生）\n- 旧爱相见：第一眼明显僵住，眉心很轻地动一下，嘴角礼貌上扬却没到眼底，视线避开过去的称呼，呼吸慢慢变沉。（适用：旧情人重遇）\n- 听见熟悉声音：身体先停住，眼神从茫然转为震动，睫毛轻颤，嘴唇微启后却喊不出名字，手里的东西差点滑落。（适用：回忆杀引入）\n- 看到旧物：目光落在物件上不动，眉眼迅速柔软又泛酸，指腹轻轻摩挲边缘，嘴角像要笑，眼眶却先湿。（适用：遗物、定情信物）\n\n【冷淡、克制、距离感类】\n- 强装冷漠：眼皮半垂，目光刻意避开温柔点，嘴角拉平，脸部肌肉收紧，回答前停半拍，转身时肩膀轻微僵住。（适用：虐恋、嘴硬、被迫离别）\n- 礼貌疏离：笑容标准到近乎完美，眼神却保持距离，眉眼不参与笑意，下巴微收，回答简短，指尖轻轻整理袖口。（适用：贵族社交、假面夫妻）\n- 魔尊冷情：眼神像结霜，眉骨阴影压低，嘴角几乎没有弧度，说话前轻轻垂眼，指尖慢慢摩挲戒指或剑柄。（适用：冷酷强者登场）\n- 最后原谅：眼神从防备变为疲惫的柔和，眉头松开，嘴角没有笑却不再锋利，呼吸平稳，慢慢点头。（适用：大结局和解、亲情线收束）\n\n【怒意、反击、不服类】\n- 怒意压住：眉骨压低，眼底发冷，牙关轻咬，嘴角抽动一下又恢复平静，呼吸从胸口压回腹部，手背青筋微起。（适用：被挑衅、发现背叛）\n- 冷笑反击：眉尾轻挑，眼神从上到下慢慢扫过，嘴角只抬一边，短促鼻笑，头微偏，停顿一秒再开口。（适用：打脸、嘲讽、强势女主）\n- 不甘认输：眼眶发热但眼神更亮，眉峰上挑，嘴唇被咬出轻痕，下巴扬起，呼吸急而稳，手指松开又握紧。（适用：败局反转、成长线爆发）\n- 战损不服输：脸上带伤，眼神依旧锋利，眉峰上扬，嘴角沾血却勾出一点笑，呼吸粗重，重新站起时动作慢但稳。（适用：热血反杀）\n\n【权谋、试探、隐忍类】\n- 假装镇定：眼神保持平视但眨眼频率压到极低，眉心松开装作放松，嘴角刻意上扬一丝，呼吸刻意放缓，指尖轻按桌面。（适用：高压谈判、掩饰心虚）\n- 识破谎言：眼神突然定住，眉尾缓慢抬起，唇角没有笑意地微弯，呼吸变轻，视线落在对方手部小动作上。（适用：权谋对峙、夫妻试探）\n- 轻微吃醋：眼神扫向第三人后迅速收回，嘴角保持微笑但弧度变硬，眉尾短暂下压，手中杯子握紧，语气比平时慢半拍。（适用：暧昧修罗场）\n- 邪魅试探：眼神含笑但没有温度，眉尾轻扬，嘴角慢慢勾起，身体微微前倾，视线像刀一样停在对方破绽处。（适用：反派套话、危险暧昧）\n- 压迫感审视：眼皮微垂，目光从阴影里抬起，眉心不动，嘴唇拉成直线，沉默停顿三秒，空气像被压低。（适用：上位者、审讯、师尊问责）\n- 黑化前一秒：眼神里的光慢慢熄掉，嘴角反而轻轻上扬，眉心松开到异常平静，呼吸变慢，眼泪停在眼眶边缘。（适用：背叛后转变）\n- 伪装无辜：眼睛微微睁圆，眉毛向上抬出委屈感，嘴唇轻抿，眨眼频率变慢，手指藏在袖中轻轻收紧。（适用：绿茶角色、白切黑）\n- 胜券在握：嘴角上扬得很克制，眼神稳定不追随对方，眉尾微挑，手指轻敲桌面，呼吸悠长，像已经看见结局。（适用：布局成功）\n- 杀意一闪：瞳孔骤然缩紧，眉骨压出阴影，唇角瞬间归零，脸部肌肉僵硬半拍，下一秒恢复温和。（适用：笑里藏刀、暗杀前奏）\n- 高位者怜悯：眼神向下俯视但带一点惋惜，眉眼平稳，嘴角没有嘲讽，只是轻轻叹气，手慢慢放下茶杯。（适用：帝王、掌门、幕后大佬）\n\n【崩溃、疯感、迷失类】\n- 疯感失控：眼睛发亮却不聚焦，嘴角笑得越来越大，眉心反而皱紧，呼吸碎裂，肩膀轻颤，像哭又像笑。（适用：执念反派崩溃）\n- 记忆苏醒：瞳孔先失焦再剧烈收缩，眉心痛苦皱起，嘴唇发白，呼吸断续，手按住太阳穴，眼里闪过陌生又熟悉的恐惧。（适用：觉醒前世、找回记忆）\n- 大梦初醒：眼神空茫地看向光源，眨眼很慢，眉心带着残留的痛意，嘴唇轻颤，像分不清梦和现实。（适用：穿越醒来、幻境破碎）\n\n【强者气场、神性、威压类】\n- 白月光回眸：回头时眼神先被风吹散，再慢慢聚焦到对方身上，眉眼温柔，嘴角带极浅的笑，发丝掠过侧脸。（适用：初恋滤镜、宿命相见）\n- 仙门威压：眼皮微抬，瞳孔稳定不眨，眉心平静，嘴唇轻启但语气无波，衣袖微动，周围人先低头。（适用：师尊审判、宗门大殿）\n- 神女悲悯：眼神很轻很远，眉心含着淡淡哀意，嘴角不笑也不冷，抬手时动作缓慢，像已经知道所有结局。（适用：牺牲、救世、封印）\n- 妖族蛊惑：眼尾微挑，眼神湿润又危险，嘴角含笑，头微微偏侧，靠近时呼吸轻缓，视线故意停在对方反应上。（适用：魅惑、试探）\n\n【强忍、坚守、信念类】\n- 听到坏消息：脸上的表情先空白半秒，瞳孔失焦，嘴角慢慢失去弧度，喉咙轻咽，肩膀像被抽走力气一样下沉。（适用：噩耗、战败、亲人离世）\n- 误会解除：紧绷的眉心一点点松开，眼眶发亮，嘴角先颤后笑，呼吸明显放长，身体微微前倾想靠近。（适用：真相揭开、双向奔赴）\n- 剑修忍痛：眉头只是很轻地皱一下，眼神仍直，嘴唇被血色染浅，握剑的手颤抖却不后退，呼吸被压得极短。（适用：战损、守护、决斗）\n\n【释然、结局、守护类】\n- 死里逃生：瞳孔还带着惊惧，呼吸急促，嘴唇微张，身体轻微发抖，确认安全后眼神一点点回神，笑意混着后怕。（适用：追杀后、爆炸后）\n- 默默守护：站在暗处时眼神温柔但不打扰，眉眼放松，嘴角只有一点点笑，手中的伞或披风停在半空，等对方走远才放下。（适用：暗中陪伴）\n- 终局释然：眼睛含泪但明亮，嘴角轻轻上扬，眉眼彻底舒展，视线望向远方光处，风吹过发丝，表情像终于把自己还给自己。（适用：大结局、长线收束）\n```\n"}, {"id": "6.26", "title": "Seedance 2.5 避坑清单：分身双胞胎、多人不稳、字幕乱入、多音字（补 6.0【七】自检）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "patches": ["七"], "folder": "06-video/patches", "path": "06-video/patches/6.26-Seedance-2.5-避坑清单.md", "body": "\n**用法**：6.0 输出后、提交生成前，对照这几条再过一遍。都是外部作者在即梦 / 火山方舟上实际踩过的坑和对应写法，挑和我们生产方式相符的收了：画面里冒出双胞胎或分身、同框人物超过 4 个就数量不对、竖屏更容易出字幕、多音字和生僻字念错、提示词写成静止画面。可以把第一部分的几句约束直接补进 6.0【七】的自检。\n\n**来源**：[buluslan/seedance-video-script](https://github.com/buluslan/seedance-video-script) references/pitfalls.md，MIT（作者公众号“新西楼.AI”，11/12 整理人新增到收集页面）。摘编：去掉了参考图拆分、白模、延长续写、剪映修补等和 6.0 生产方式（素材直接关联、全靠文字衔接）不符的部分。\n\n**提示词正文**：\n\n```\n输出视频提示词后，对照以下几点检查：\n\n【一、可以直接加进提示词的约束句】\n- 防分身：画面里出现双胞胎、两个一样的人时，加一句“全程不出现外形和着装完全一样的人物，不出现分身或双胞胎”。\n- 防字幕和标识：“全程无字幕，不生成任何文字、Logo 或水印”。竖屏比横屏更容易冒出字幕，竖屏项目一定要写。\n- 防风格漂移：风格词写明确（例如“真人电影写实风格”），只在统一风格里写一次（见 6.0【三】）。\n\n【二、同框人数】\n同一段里同时出镜的主要人物超过 4 个，人数容易不对或重复。人多的场面拆成几段，或者让次要人物虚化、只留背影。\n\n【三、台词发音】\n- 多音字、生僻字容易念错：换成同音的常用字（例如“螭”写成“吃”），只改提示词里的台词，剧本原文不动。\n- 小语种台词要标明语言。\n- 同一个人的声音前后不一样时，在台词旁补具体的音色描述（例如“低沉温和、略带沙哑的中年男声”）。\n\n【四、四种常见写法错误】\n1. 描述静止的画面——应该写随时间发生的动作和变化；\n2. 镜头写得含糊——“电影感”没用，要写具体的景别和运镜；\n3. 把一整段情节塞进一个时间段——每个时间段一个清楚的主要动作；\n4. 4~5 秒里塞了太多场景或事件——时间段要和内容量匹配（见 6.13、6.18）。\n\n【五、2.5 仍然不稳的地方】\n复杂运动的物理合理性、很多人同时互动、长镜头穿帮，仍是 2.5 的弱项。这类内容尽量拆短、减少同时动作的人数。\n```\n"}, {"id": "6.27", "title": "镜头时长与台词字数上限表 + 内心独白标“无口型”（补 6.0【六】）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "patches": ["六"], "folder": "06-video/patches", "path": "06-video/patches/6.27-镜头时长与台词字数上限表+内心独白标无口型.md", "body": "\n**用法**：补进 6.0【六】（对白与声音），用来落实“对白长度与时间匹配”。按镜头时长给出对白和内心独白的字数上限，超了就拆镜或删字；内心独白统一写成第一人称、标“无口型，画外音”，防止画面里的人物张嘴。注意：这份表按每秒 5–6 字算，比 6.13 的每秒约 4 字快，上限偏宽；两种标准都没有在我们的项目里实测过，建议同一段各出一版对比。\n\n**来源**：[senmanx/novel-to-manju](https://github.com/senmanx/novel-to-manju) SKILL.md 第 2.4 节“台词规范”和第 8.3 节“台词与内心独白”，CC0（公共领域）。原文的素材引用和音色绑定写法按 SOP 不收，只取字数和标注规则。\n\n**提示词正文**：\n\n```\n（补进 6.0【六】）\n对白和内心独白的长度按镜头时长控制，每 5–6 字约 1 秒（情绪激动稍快，低沉稍慢）：\n| 镜头时长 | 对白上限 | 内心独白上限 |\n| 2 秒 | 6 字 | 8 字 |\n| 3 秒 | 9 字 | 12 字 |\n| 4 秒 | 12 字 | 16 字 |\n单个镜头的台词超过 30 字，必须拆成多个镜头。\n内心独白一律用第一人称，写成“XX 内心独白：……（无口型，画外音）”，画面中该人物不开口。\n只有正在说话的角色张嘴，其他人不动嘴。\n```"}, {"id": "6.18", "title": "段内切镜节奏：按四个维度决定切几镜、每镜多长（补 6.0【一】第 2 条、【六】第 6 条）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "patches": ["一", "六"], "folder": "06-video/patches", "path": "06-video/patches/6.18-段内切镜节奏.md", "body": "\n**用法**：6.0 规定“每段 15 秒以上、可以包含多个镜头”，但没说一段里切几镜、每镜多长。这条给了判断方法：看动作密度、情绪类型、有没有对白、画面信息点有几个。安静对白少切、长镜头；打斗多切、短镜头；反转用“慢—快—定住”。可以补进 6.0【一】第 2 条后面。\n\n**来源**：[liqi21cn/video-prompt-skill](https://github.com/liqi21cn/video-prompt-skill) references/rhythm-rules.md，MIT（收集页面，11/03）。原文英文，这里翻译摘编；原文按一行剧本 3~6 秒设计，这里改成用于 15 秒以上一段之内的切分。“每镜不短于 0.8 秒、不长于 5 秒（特殊长镜头 8 秒）”是原作者的经验值，按实际出片调整。\n\n**提示词正文**：\n\n```\n给每一段分配镜头时，先按四个维度判断，再决定切几镜、每镜多长，不要平均切。\n\n【一、动作密度】\n- 极高：三个以上爆发性动作（扑出、撕开、猛然）→ 每镜 0.8~1.5 秒，密集快切；\n- 高：两三个有方向的连续动作 → 每镜 1.5~2.5 秒；\n- 中：单个动作或状态 → 每镜 2~3 秒；\n- 低：静态、对白、内心戏 → 每镜 3~5 秒，长镜头。\n\n【二、情绪类型】\n- 平静、内省、独白 → 慢，长镜头，少切；\n- 紧张、悬疑、对峙 → 中速，用几个镜头累积张力；\n- 爆发、震惊、高潮 → 快，多角度，穿插特写；\n- 转折、反转 → 定住 + 反应镜头。\n\n【三、有没有对白】\n- 有对白：每句话留出停留时间，一句台词一个镜头，每镜不少于 2 秒（台词时长按 6.13 估算）；\n- 只有旁白：跟着旁白的节奏，旁白稀疏镜头就慢；\n- 纯环境：可以自由穿插。\n\n【四、画面信息点】\n数一数这段有几个不同的画面信息点，每个关键信息点至少一个镜头承载。例：“夜雨打在青石板上，远处巷口的灯笼摇曳”有两个信息点（雨打石板、远处灯笼），至少两镜。\n\n【适合一镜到底（4~8 秒）】情绪需要不中断地累积（哭、独白）；长距离跟拍（走、跑）；关键台词；营造压迫或幽闭感。\n【适合密集快切】高潮动作、追逐；多人互动（每人都需要自己的镜头）；信息轰炸（人物、环境、提示同时变化）；节奏从慢到快的转换点。\n\n【变速比平均更有戏】先慢后快（铺垫戏）；先快后猛地定住（冲击戏）；两拍正常、一拍拉长（揭示戏）。\n\n【检查】各镜时长相加等于本段时长；没有短于 0.8 秒的镜头；镜头之间首尾相接没有空档；镜头数量由内容决定，不是套公式；每个主要信息点至少一个镜头。\n```\n"}, {"id": "6.23", "title": "切镜与跨段衔接检查：状态继承 + 台词跨镜 + 背景人物（补 6.0【五】【六】）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "patches": ["五", "六"], "folder": "06-video/patches", "path": "06-video/patches/6.23-切镜与跨段衔接检查.md", "body": "\n**用法**：6.0【五】要求“已经完成的动作不重演、切镜不让人物重新入场、保持人物状态和道具归属一致”，这条给了逐镜逐段的检查顺序。特别有用的三点：上一段的最后一镜和下一段的第一镜要对得上；一句台词跨镜头时声音不能断、不能重新起句；画面里的背景人物不能“木站”，也不能抢戏或提前反应。适合 6.0 输出后、提交生成前检查。\n\n**来源**：[djyy1031/ai-comic-drama-director-skills](https://github.com/djyy1031/ai-comic-drama-director-skills) skills/ai-shot-execution-continuity/SKILL.md，MIT（11/07 整理人新增到收集页面）。摘编：原技能面向“剧本 + 已有素材 → Seedance 分镜组”，和我们的生产方式接近；去掉了站位图、校验脚本和素材文件核对的部分。\n\n**提示词正文**：\n\n```\n输出视频提示词后，按以下顺序逐镜、逐段检查。发现问题写出具体位置、证据、影响和最小修改，不要只写“连续性不好”。\n\n1. 当前镜头只写本镜实际看得见、发出声音或直接起作用的人物、场景和道具。删掉上一镜遗留的内容、场号、旧提示词，以及“同前”“同上”这类模型看不到的上下文。\n2. 第一帧：写明有效主体、动作状态、人物关系和画面目的。除非剧本要求空镜或延迟揭示，不用没有人物、没有信息的空镜开场；第一帧直接处在当前动作里，不加没内容的前摇。\n3. 空间与全员表演：每个画面里的人物都要有位置、朝向、视线目标、和地标的距离、移动方向。不用“附近、旁边、看着对方”代替。画面里的每个人都要有当下的表演和剧情依据，包括背景人物；背景人物可以用低强度的视线、呼吸、姿态或生活动作，但不能抢主体、整齐划一地复制动作，或者提前反应。\n4. 摄影机：写明在轴线哪一侧、朝向、高度、距离、主要运动、停在哪里、最后焦点在哪。一个镜头只保留一个主要运镜；必须越轴时在画面里重新建立方向。\n5. 道具与手：记录持有者、左手还是右手、接触点、开合、损耗和使用结果。切镜后不能换手、复原、消失或无故新增。\n6. 光线与物理：锁定主光来源和方向；动作检查重力、质量、惯性、摩擦、接触和环境反馈。\n7. 台词：第一句由镜内看得见的动作或现场事件触发；一句台词跨镜头时，后一镜从第 0 秒接着说，不重复起句、不换说话人、不重新换气、不凭空停顿。切到听者或环境细节时，说话者可以作为画外声继续。一句完整的台词默认不跨段。\n8. 切镜继承：逐对比较前一镜结束和后一镜开始的状态——人物、道具、环境、摄影机方向、台词。状态变化必须由镜内看得见的动作或明确的时间经过造成。\n9. 跨段继承：上一段最后一镜到下一段第一镜，下一段开头要接住上一段留下的动作、视线、声音、道具或空间位置。默认不要同一人物的特写直接切同一人物的特写。\n10. 局部修正：先写希望出现的正确状态，只对已经发现的高风险错误加一句局部禁止，不要堆一长串通用的负面词。\n\n节奏提醒：非脸部的特写最多 2 秒，不要用静止的手、书页或衣袖撑一整段长台词；用表情、听者反应和少量中景、全景来承接语言和动作。\n```\n"}, {"id": "6.22", "title": "动作戏（打戏）写法：角色动作档案 + 因果交锋 + 失败诊断（补 6.0【四】第 3 条）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "patches": ["四"], "folder": "06-video/patches", "path": "06-video/patches/6.22-动作戏.md", "body": "\n**用法**：6.0【四】第 3 条要求“复杂动作保留准备、发力、接触和收束过程，不把多个动作挤在一个瞬间”，打戏、追逐、对抗是最容易出问题的地方。这条把它讲细了：先给每个角色定动作档案，再让每一轮交锋写清“谁打、打哪、结果、对方怎么回应、位置怎么变”，出片失败时按症状只改一类变量。可以在有打戏的段落补进 6.0。\n\n**来源**：[irenerachel/fight-prompt-director](https://github.com/irenerachel/fight-prompt-director) SKILL.md、references/fight-design.md、diagnostics.md，MIT（11/07 整理人新增到收集页面）。摘编：去掉了首尾帧、参考视频、三套强度方案和极速版等和 6.0 生产方式不符的部分（6.0 全靠文字衔接、素材直接关联）。\n\n**提示词正文**：\n\n```\n这一段有动作戏（打斗、追逐、对抗）时，按以下规则写。\n\n【一、先给每个参战角色定动作档案】\n优势距离；起手姿态；移动方式；主要攻击方式；防守与反制习惯；武器、弹药或能量资源；力量节奏；结束战斗的方式。\n不同角色至少在距离、移动和反制方式上明显不同。远程角色要管视线、弹道和资源；近战角色要说明怎么缩短距离；体型差异要体现在速度、受力和环境反馈上。\n\n【二、先写完成条件】怎样算结束：击倒、逼退、脱离、抵达、保护、拖延或撑到结束。再写各方怎么实现、对方怎么阻止。已经定好的胜负、对白、关键招式和结尾完整保留。\n\n【三、每一轮交锋写六项】\n谁发起；指向哪里；接触、格挡还是落空；对方怎么回应；双方位置怎么变；什么状态引出下一拍。\n下一拍可以由距离变化、失衡、遮挡、资源消耗、场景损伤或暴露的空当触发。不要让双方同时做互不相关的动作。\n重要命中写清：发力方向、接触位置、受力方向、位移结果、环境反馈。环境变化（碎片、裂痕、倒下的物件）要延续到后面的镜头。\n\n【四、按参战主体选骨架】\n- 单人突围：建立路线和出口 → 第一种威胁迫使改变步法或高度 → 第二种威胁封住原路，利用环境开新路 → 最后障碍检验前面建立的能力 → 抵达或停在清楚的位置。\n- 双人攻防：双方不同的优势距离 → 一方迫使另一方离开舒适距离 → 被压制者用地形、武器或假动作扭转 → 交换位置或朝向 → 结束时明确谁取得空间或时间优势。\n- 一人对多人：全景交代主角和每个对手的位置 → 对手从不同方向、不同节奏进攻 → 主角利用一个对手的位移挡住另一个 → 已经退出战斗的人和物保留在画面里 → 结尾明确剩余人数和主角去向。\n- 人与巨兽：建立体型比例和安全距离 → 巨兽一次大范围动作改变地面或遮挡 → 主角从侧翼、高处或弱点取得短暂机会 → 巨兽调整攻击形成反转 → 结果用倒塌、退让、脱离或环境变化呈现。\n\n【五、时长分配】\n4~8 秒：一个完整动作闭环，最多一次明显转折；\n9~18 秒：起动、争夺、反制、结果四到五个阶段；\n19~30 秒：拆成五到七段，中段安排一次有效反转。\n接触点太多时拆成几段，每段记录位置、朝向、武器、速度和场景损伤。\n\n【六、镜头】每个镜头只承担一个主要职责：建立空间、跟随位移、看清接触、表达失衡或揭示结果。写清景别、机位、速度、方向和跟随对象。不用运镜挡住动作。\n\n【七、硬规则】不用“激烈”“震撼”这类空泛强度词代替看得见的动作、方向和结果；武器、投射物、角色数量、场景损伤在切镜后不能自动重置；默认无字幕、无水印，不加没要求的旁白。\n结尾写明：角色数量、武器数量、空间方向、资源状态、场景损伤。\n\n【八、出片失败时】先找最影响观看的一个症状，每轮只改动作、镜头中的一类：\n双方各打各的 → 补全发起、接触、回应、位移和下一拍；\n接触点看不清 → 改用侧向中景或短促接触特写；\n人物左右互换 → 固定轴线和屏幕方向，切镜前记录站位；\n受击没有力量 → 写清接触部位、受力方向、位移和材质反馈；\n远程攻击凭空出现 → 补充取用、装填或充能，交代路径和落点；\n场景损伤恢复 → 在后面的时间段重复写损伤状态；\n镜头随机跳切 → 减少机位，每镜只承担一个职责；\n特效没有来源 → 删掉特效，或绑定到武器、装置、能力和接触点。\n连续两轮没有改善，重新检查是不是分错了变量，不要一次重写全部。\n```\n"}, {"id": "6.24", "title": "分段切点判断：哪里必须拆段、哪里可以合段（补 6.0【一】）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "patches": ["一"], "folder": "06-video/patches", "path": "06-video/patches/6.24-分段切点判断.md", "body": "\n**用法**：6.0【一】要求每集合并为 4~6 段、每段不少于 15 秒，但没说“切在哪里”。这条给了判断顺序：重大换场、时间跳转、同一人物换造型的地方必须切；同一空间里的正反打、景别变化不用切；动作太复杂时提前切；不在关键连续动作中间生硬截断。每段的提示词要能独立使用，下一段重新写出自己的起始状态。\n\n**来源**：[wyuzhi/qisi-video-remix](https://github.com/wyuzhi/qisi-video-remix) SKILL.md “分段与可复制提示词”一节，MIT（11/09 整理人新增到收集页面）。摘编：原文“上限 15 秒或 30 秒、可以短于上限”，这里按 6.0 的要求改成“每段不少于 15 秒”；原文的生图提示词部分按 SOP 不收。\n\n**提示词正文**：\n\n```\n把一集的分镜合并成视频段时，按分镜顺序判断切点：\n\n1. 从第一个还没分配的镜头开始，建一个新段。\n2. 下一个镜头出现以下情况，在它前面切段：重大换场；时间层跳转（回忆、闪回、跨天）；同一人物换造型（换衣、明显的妆发变化）。普通的景别变化、同一空间里的正反打，不需要切。\n3. 场景虽然相同，但加进下一个镜头会让独立动作、运镜或人物互动过于复杂，也提前切段。\n4. 单个镜头的动作本身太长时，先拆成有明确起止状态的两个镜头再分配；不要在关键连续动作中间生硬截断。\n5. 每段时长 = 段内镜头时长之和，每段不少于 15 秒。切出来不足 15 秒时，优先和相邻、兼容的内容合并，或补上有意义的动作过程、人物反应和停顿；不能用重复动作或无意义慢镜头凑时长，也不能把不兼容的内容硬合在一起。\n6. 每个镜头只属于一段，顺序和全片总时长保持一致。\n\n每段提示词必须能独立复制使用：\n- 写清本段的起始状态：出镜人物、所在位置和站位、手里的东西；\n- 段内按时间写镜头、动作、运镜、逐句对白和说话人、必要的声音；\n- 结尾写清动作和位置，以及下一段要接的状态；\n- 下一段重新写出自己的起始状态，不写“同上”“接上段”，不依赖表格或编号。\n\n另外给出一张分段表：段号｜时长｜包含哪些镜头｜为什么在这里切｜和下一段的衔接状态。\n```\n"}, {"id": "6.25", "title": "出片实测经验：共用描述按段裁剪、站位锚点、镜内快切、开口时间（补 6.0【二】【三】【四】【六】）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "patches": ["二", "三", "四", "六"], "folder": "06-video/patches", "path": "06-video/patches/6.25-出片实测经验.md", "body": "\n**用法**：外部作者拿真实剧集用 Seedance 2.5 和 MiniMax H3 跑了几轮出片，记录了反复出现的问题和做法。这里只收和 6.0 生产方式（素材直接关联、全靠文字衔接）相符的几条，可以挑着补进 6.0 对应部分。最值得先试的是第一条：每段都拼一样的“统一说明”，会让空镜里凭空多出人、特写被拉成中景。\n\n**来源**：[zenstory-ai/drama-skills](https://github.com/zenstory-ai/drama-skills) .agents/notes 里 2026-11-01、11-06、11-10 三份出片实测记录，MIT（收集页面第 9 条，11/11 继续深挖）。摘编：去掉了关键帧、首尾帧、参考音频、剪辑软件等和 6.0 生产方式不符的部分。作者注明：结论来自一部剧的几集、每组对照跑 3 次，样本小，换模型版本要重测。\n\n**提示词正文**：\n\n```\n写每段视频提示词时，注意以下几点（来自出片实测）：\n\n1. 共用描述按段裁剪：整场共用的说明（人物身高比例、房间陈设等）拼进每一段之前，删掉这一段不在场的人和画面里看不到的陈设，写明本段只有哪些人。特写和道具插入镜不带比例和房间描述。\n   （实测：每段都拼同一段说明后，空店镜头里多出了别的角色，特写被拉成中景。）\n\n2. 站位锚点用看得见的固定物：写人物站在哪时，锚点选关联的场景素材里本来就看得见的固定物（柜台、门、窗）。不要点名场景里没有的大件家具——模型每次会补出不同的一件，还可能挡住原有家具、改掉房间格局。\n\n3. 写清身体距离和高度：人离锚点多远写成身体距离（如“离柜台半步”“伸手够得到”），不走位的人始终锁在锚点同一侧。人会靠、撑、坐的固定物写明落在人身上的哪个位置（如“台面在腰部”），否则同一个人身前的台面会逐镜从胯部跳到胸口。离场的人朝门的方向出画。\n\n4. 镜内快切单独成镜：一秒左右的眼、嘴、手、道具特写，要在时间轴里写成单独的时间段（例：“3—4 秒：特写，她的拇指停在接听键上”），只写在说明里，生成出来会变成一个慢推镜头。\n\n5. 开口时间留余量：实测首帧图生视频时，人物开口常比写的晚 1~2 秒（不同模型版本不一样）。第一句台词前给动作或反应留出时间，不要从 0 秒就开口说长句（时长估算见 6.13）。\n\n6. 切点不要太硬：台词说完立刻切到景别、站位都变了的下一镜会显得硬，句后的反应留长一点再切。\n\n7. 电话声和内心独白：提示词里写“从听筒里传出、略带电话音质”，模型生成的仍是干净人声，而且逐段不同。这类声音不要指望提示词，交给后期统一处理（电话声加带通滤波，内心独白统一加轻混响）。\n\n8. 生成额度有限时按集分批：一集全部生成完再开始下一集，避免额度用完时两集都不完整。\n```\n"}, {"id": "6.15", "title": "每段一个主事件 + 看得见/看不见分层（补专用提示词【一】【二】【四】）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "patches": ["一", "二", "四"], "folder": "06-video/patches", "path": "06-video/patches/6.15-每段一个主事件+看得见-看不见分层.md", "body": "\n**用法**：专用提示词（6.0）要求“每段突出一个核心事件”“角色名称只用于明确动作主体、对白归属”。这条讲的是把剧本压进一段视频时怎么取舍：一段只保一条主动作线和一条主镜头线；剧本里“提到了但画面上看不见”的人和东西（画外音的人、回忆、设定、没出现的道具）不能写成画面元素，否则模型会把它们硬画出来。适合在 6.0 输出后检查“为什么多出了一个人、一样东西”时用。\n\n**来源**：[XucroYuri/how-to-make-script](https://github.com/XucroYuri/how-to-make-script) knowledge/30-craft/ka-video-generation-shot-economy.md、ka-visible-asset-grounding.md、knowledge/20-workflows/wp-screen-to-video-brief.md，MIT（收集页面，11/03）。三份合并摘编。\n\n**提示词正文**：\n\n```\n把剧本片段转成视频提示词前，先做两件事：\n\n【一、每段只保一个主事件】\n- 一个戏剧上成立的场景，直接塞进一段视频，常因为动作太多、转折太多、镜头太多而失焦。\n- 每段优先只保一条主动作线和一条主镜头线。把这一段当成“证明某个戏剧动作成立的最小单位”，而不是复刻整场戏。\n- 问自己：这一段最核心的动作证明是什么？如果镜头只能做一次明显的运动，最值得保留哪一次？\n- 不要在一段里同时要求推进、转折、揭示、反转和抒情；不要同时指定几种互相打架的镜头运动；不要用堆细节代替筛选。\n- 放不下的内容，要么进下一段，要么留在剧本里不拍。\n- 需要保持一致的东西（人物位置、道具归属、服装状态）单独列在段尾，不在正文里反复啰嗦。\n\n【二、分清看得见和看不见】\n逐段列出：\n- 画面里真正在场、看得见的人物；\n- 只有声音的人物（画外音、电话那头、OS）——不能默认他出现在画面里；\n- 画面里真正看得见、并且有作用的道具；\n- 只存在于台词、回忆、设定里的信息——不写成画面元素。\n检查：\n- 是不是把所有提到的人都算成了出镜人物？\n- 是不是把剧情上重要、但这一段画面上看不到的东西写成了可见道具？\n- 声音、回忆、设定说明和画面证据有没有混成一张清单？\n- 如果这一段只能删到最少，看得见的证据还剩什么？\n\n【三、转写时】\n- 先抓这一段的戏剧任务、人物之间的压力和不能丢的动作证明，再写画面。\n- 剧本的东西留在剧本里，生成约束留在提示词里，中间只搭最小的桥；不要把整段剧本压成一长串镜头词，也不要写成技术手册。\n- 每个关键判断都应该能指回剧本里的具体文字，不要让视频提示词漂成另一个故事。\n```\n"}, {"id": "6.14", "title": "Seedance 2.5 声音写法：对白、无字幕、音效与画面文字（补专用提示词【六】）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "patches": ["六"], "folder": "06-video/patches", "path": "06-video/patches/6.14-Seedance-2.5-声音写法.md", "body": "\n**用法**：专用提示词（6.0）【六】要求“区分现场对白、OS、VO，不让角色为 OS/VO 做口型”“默认不加字幕和背景音乐”。这条给了这些要求在 Seedance 2.5 里的具体写法，以及几个出片常见问题（手机通知变成浮层、数字乱码）。可以挑需要的几行补进 6.0。对白用花括号的写法是原作者的约定，不是官方语法，用前先测一两条。\n\n**来源**：[zenstory-ai/drama-skills](https://github.com/zenstory-ai/drama-skills) skills/short-drama-video-prompts/references/seedance-2.5.md，MIT（11/03 深挖）。摘编：只保留和声音、文字有关的部分；原文的素材绑定、首尾帧、延长任务等，按二轮测试结论（素材直接关联、全靠文字衔接）不收。\n\n**提示词正文**：\n\n```\n写 Seedance 2.5 视频提示词时，声音和文字按以下写法：\n\n1. 对白：每句能听清的台词整体写成 {角色名用中文说：“逐字台词”}。同一句台词在一段正文里只出现一次，放在声音时间线里；画面时间线只写“口型同步”，不再重复台词。中文对白不加语言前缀。\n2. 内心独白 OS、画外音 VO：写明“画外音”“内心独白”，并写“人物不开口、无口型”。\n3. 音效写成 <声音>，例如 <门闩落下的金属声>；音乐写成（音乐）。\n4. 默认不要字幕时，在正文末尾写一次：“全程无字幕、无对白文字叠加”，正文里不出现【】。画面里本来就有的文字（招牌、纸条）单独说明。\n5. 已经确定只有中文对白时，可以在声音时间线末尾写一次：“对白直接从指定中文首字开始；不生成外语前导、语气词、额外人声或重复对白”。没有这个需要就不加。\n6. 手机收到消息这类画面，2.5 常把通知画成浮在画面上的气泡或数字（作者实测 2 次都出现），数字还会乱码。写明“通知只在手机屏幕里亮起，画面上不出现浮层”；需要看清的数字交给后期剪辑叠加。\n7. 多镜头长段按“镜头 1 [0:00–0:03]：……”写时间段，不重叠、不留空档，最后一段的结束时间等于总时长。时间戳会有生成偏差，不能当作精确对口型或剪辑点。\n8. 30 秒长段不等于台词可以塞满，对白仍按每秒约 4 个字估算（见 6.13）。\n```\n"}, {"id": "6.21", "title": "交付前闸门：可拍可演 + AI 可生成性（补 6.0【七】自检）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "patches": ["七"], "folder": "06-video/patches", "path": "06-video/patches/6.21-交付前闸门.md", "body": "\n**用法**：6.0 输出后、提交生成前快速过一遍。比 6.7（生成前 100 分检查）更偏“演员能不能演、模型能不能生成”：多人接触、手部、镜面、屏幕文字、复杂口型、高速变形这些高风险项有没有拆开或标后期，相邻镜头的姿态能不能剪接。还有一条很实用：禁止“适当运镜”“情绪到位”“氛围感”这类无法执行的词。\n\n**来源**：[muxia0396/novel-to-ai-short-drama-skill](https://github.com/muxia0396/novel-to-ai-short-drama-skill) references/quality-gates.md 与 directing-language.md，MIT（11/05）。摘编。\n\n**提示词正文**：\n\n```\n输出视频提示词前，逐项检查，有问题先改再输出，只给简短的检查结论。\n\n【时长】时间码从 0 连续到结束；各镜秒数之和等于目标时长；台词按语速读完后仍给动作、反应和停顿留了时间；没有同一秒被两个先后发生的事件占用，没有没解释的空白。不通过时删台词、拆动作或重新分配镜头，不要只改汇总数字。\n\n【保真】核心人物欲望、因果、关系和关键结果都保留了；合并、重排或新增的内容没有让角色突然知道不该知道的事；没有为了套类型加入和原作不符的羞辱、打脸或无根据反转。\n\n【可拍可演】抽象心理都有看得见的证据；演员动作具体、做得完，并和台词时长匹配；每次特写、换角度和运镜都有明确的信息或情绪目的；空间看得懂，人物视线、左右位置、进出方向和轴线连续；关键动作有起点、完成点和反应镜头；动作发生后留 0.5~2 秒的反应落点。\n\n【AI 可生成性】每个生成单元主要只有一个动作和一个镜头意图；多人接触、手部、镜面、屏幕文字、复杂口型和高速变形已经拆开或标注后期；相邻镜头的结束姿态和开始姿态一致，可以剪接；一个镜头通常只设一个主要运动，起点和终点写明（例：“从门锁大特写缓拉到门外两人中景”，不是“镜头拉开”）。\n\n【输出清晰】镜号、时间码、场次和角色名统一；不出现“适当运镜”“情绪到位”“氛围感”“有电影感”这类没法执行的词。\n```\n"}, {"id": "6.16", "title": "按镜头功能写控制项：情绪 / 对峙 / 道具 / 动作 / 群戏 / 特写（补 6.0【四】【五】）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "patches": ["四", "五"], "folder": "06-video/patches", "path": "06-video/patches/6.16-按镜头功能写控制项.md", "body": "\n**用法**：6.0 每段按“起始状态 → 触发 → 动作 → 反应 → 结果”组织，这条补的是“不同功能的镜头，各自必须写哪几项”，避免每段机械堆满所有控制项，也避免该写的漏掉（最常漏的是道具：在哪、几个、谁拿、哪只手、最后停在哪）。可以整段补进 6.0【四】后面。\n\n**来源**：[haya-hello/AI-real-person-short-drama-workflow](https://github.com/haya-hello/AI-real-person-short-drama-workflow) docs/prompt-rules.md，MIT（收集页面，11/03）。原文照录这一部分。原仓库另外要求“对白只输出英文、每段 4~15 秒”，和我们的生产不同，没有收。\n\n**提示词正文**：\n\n```\n不要每条镜头机械堆满所有控制项。根据镜头功能选择要写的内容。\n\n【情绪 / 表演镜头】必须写：初始状态；触发词或触发动作；表情变化；呼吸、停顿或声音变化；禁止提前反应；结束落点。\n\n【对峙 / 压迫镜头】必须写：前后景或左右关系；视线压力；谁压迫谁；关键词重音、停顿或尾音变化；对方的身体反应。\n\n【道具 / 证据镜头】必须写：道具当前在哪里；是否唯一；谁拿着，哪只手接触；接触点和动作路径；道具最后停在哪里；不新增第二个、不跳位置、不换手。\n\n【动作镜头】必须写：动作起点和终点；人物距离；手部和身体重心；环境反馈；动作结果落点。\n\n【群戏 / 背景人群镜头】必须写：谁实焦，谁虚化；背景人群只在后景、侧边或边缘；不新增对白；不让所有人清晰露脸。背景人群没有明确动作时，一律虚化处理。\n\n【特写锁定镜头】必须写：从头到尾保持特写；只拍哪些部位；不拍中景、全身、脚步；人物移动只能通过局部位移表现。\n\n【通用硬约束】不让人物凭空出现、消失或跳站位；不让道具凭空出现、复制、消失、换手或跳位置；不让背景人群承担剧本没有交代的清晰动作、表情、站位或对白；道具先写当前状态，再写人物动作；每条镜头承接上一镜的站位、视线、手部和道具状态。\n```\n"}, {"id": "6.5", "title": "画风锁定前缀块：国漫 3D 仙侠", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "folder": "06-video/styles", "path": "06-video/styles/6.5-画风锁定前缀块.md", "body": "\n**用法**：做国漫 3D 修仙、玄幻类漫剧时，把下面两段原样贴在每段视频提示词的开头，全片不改，用来锁住画风和动作质感，避免集与集之间风格漂移。\n\n**来源**：[漫剧老李 manju-laoli-skill](https://github.com/lixiaoxiao9888-create/manju-laoli-skill) short-drama-director/references/style-bible/style-prefix-blocks.md，MIT（收集页面），原文照录。同一文件里还有十几种风格块（武侠动作、神话史诗、精密悬疑、高燃动画、暗黑游戏 CG、3D 水墨等），需要时可以回原文取；原作者注明这些块都不含导演、影片等人名。\n\n**提示词正文**：\n\n```\n【STYLE｜视觉风格 · 全片锁死】\n成像底层：UE5次世代3D国漫半写实渲染，PBR物理级材质光照，皮肤次表面散射温润通透，无2D粗黑描边\n形体骨相：7.5~8 头身东方仙侠修长3D建模骨相，五官立体俊朗，发丝与广袖随罡风独立物理解算飘动\n影调区间：光比 [1:4, 1:8]，冷冽高空天光或秘境灵光主照明，受光面层次通透，背光侧镀清冷法术轮廓光\n色彩区间：主调玄青/月白/苍蓝仙家底色配高纯度灵力撞色（幽蓝剑气/赤金符纹），饱和度 [中, 高]\n空气介质：高山流云湿雾、丁达尔灵气光柱与悬浮灵力微粒（≤2 层），空间纵深通透不糊主体面部\n光学区间：镜头 [18mm, 85mm]，大远景仙山牌坊巨物纵深与 85mm 浅景深眼神特写、高速环绕跟拍交替\n材质响应：织金云锦暗纹、冷锻寒铁剑器高光、温润灵玉折射与崩飞青石气浪的PBR物理层次分明\n特效语言：3D粒子流体三层复合法术（主体层高亮剑芒/法相本体+边缘层螺旋气浪碎石+表面层游走符文电弧）\n针对性禁项：禁2D粗黑描边 / 禁日式赛璐璐平涂 / 禁廉价塑料反光 / 禁劣质网游光球糊脸 / 禁真人实拍毛孔\n\n【PERFORMANCE｜表演与动作 · 全片锁死】\n帧率区间：[24fps, 120fps]，御剑/踏空极速推拉跟拍与交击瞬间 2~3 帧顿挫定格（Hit-Stop）、慢镜衣袂回落交替\n文戏眼神清冷克制、微表情细腻；打戏全程保持高密度三维空间位移与法宝实体碰撞，严禁站桩隔空对波\n```\n"}, {"id": "6.11", "title": "素材锁定表与引用语法（每个素材借什么、不继承什么）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "status": "已用于生产", "folder": "06-video/reference", "path": "06-video/reference/6.11-素材锁定表与引用语法.md", "body": "\n> **实测（11/03 第二轮）：“素材锁定”的原则已用于生产**（6.0【二】：五官、发型、服装、场景外观以关联素材为准，不重复描述）。引用语法和锁定表本身不用写进提示词。\n\n**用法**：在 X-tasy 里关联了多个画布素材时，先按这张表把每个素材的职责理清楚，再写提示词或交给 momo agent。正好对应测试反馈里「4.1、4.2 缺少关联画布素材，导致条件冲突」的问题：冲突多半是因为没说清楚一个素材该借什么、不该借什么。和 6.9（官方写法）、6.10（首镜结构）配合用，这条更细。还没实测。\n\n**来源**：[liyue-aigc/seedance-2-5-video-director](https://github.com/liyue-aigc/seedance-2-5-video-director) references/multimodal-patterns.md，MIT（10/30 加到收集页面）。翻译摘编。作者声明为社区项目，非字节官方。\n\n**提示词正文**：\n\n```\n写提示词之前，先把用到的每个素材整理成一张锁定表：\n\n| 素材 | 负责什么 | 在哪段时间起作用 | 必须保留 | 不要继承 |\n| @图片1 | 身份 / 场景 / 道具 / 风格 / 分镜 | 全片或某个时间段 | 要保护的特征 | 无关背景、文字、构图等 |\n| @视频1 | 原片 / 动作 / 运镜 / 剪辑 / 转场 | 全片或某个时间段 | 选定的动作或画面 | 不要的人物身份、材质、声音、叠加物 |\n| @音频1 | 音色 / 台词语气 / 配乐 / 节奏 / 环境声 | 全片或某个时间段 | 选定的声音特点 | 噪音、无关人声、不要的音乐 |\n只填真正用到的素材，顺序和上传/关联顺序一致。\n\n【引用语法】每次引用写成一份“小合同”：\n来源素材 + 借用哪些特征 + 用在哪个主体/镜头 + 在哪段时间 + 必须保持不变的 + 不要继承的\n✓ 20-25 秒仅参考 @视频2 中“预备—冲刺—起跳—挥砍”的重心和动作节奏，映射给 @图片1 的骑士；不要继承 @视频2 的灰模人物、场景材质或其他时间段的动作。\n✗ 参考 @视频2 的动作。\n一个素材承担多个职责时分开写；动作参考不代表也要控制人物身份、背景、声音或风格。\n\n【人物参考图默认管什么】写“人物参考图/角色参考图”时，默认锁定整个可见角色：五官脸型、肤色、年龄感、发型发色、身材比例、可见服装鞋子配饰和整体气质；不随意改衣服、换颜色、增减配饰；看不到的背面按可见部分的款式和材质补全，不另编一套衣服。\n默认不继承参考图的背景、构图、姿势、文字和光线，除非另外指定。\n只想锁脸时要写明“只参考脸”，服装造型另算。\n一张图里有两个人或一群人时，按位置或名字分别绑定每个人，保持相对身高；禁止换脸、互换服装、身体重复、角色互换。\n\n【多人物】每个重要人物单独绑定：<人物A> = @图片1；<人物B> = @图片2……\n逐个锁定：身份五官、发型服装、身材比例、站位或入场方向、手里的道具、动作和视线对象、有台词时的音色来源。群戏写明人数；有肢体接触时写清接触和遮挡关系，防止肢体粘连。\n\n【音色与台词】每个声音只绑定一个角色，并写出原句：\n<人物A>在 8-11 秒说“……”，音色参考 @音频1，保持低沉、克制、略带停顿的语气。\n不要只写“用 @音频1”。台词长度要和时长匹配，说不完就缩短台词或拉长这一拍。\n\n【去背景音乐】移除 @视频N 的背景音乐，仅保留清晰的人声对白和指定的现场声；画面和其他受保护的元素保持不变。\n\n【指令冲突时按这个顺序优先】\n1. 明确要保护的原片或人物身份；2. 明确的编辑对象和时间段；3. 明确的素材职责；4. 时长、台词、声音、字幕要求；5. 风格和创意补充。\n同一级别的两条指令冲突时，先问清楚，不要自己选；风格参考和身份锁定冲突时，保身份，只取兼容的风格特征。\n```\n"}, {"id": "6.7", "title": "视频提示词生成前 100 分检查 + 成片评分", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "status": "二轮实测：已用于生产", "folder": "06-video/reference", "path": "06-video/reference/6.7-视频提示词生成前-100-分检查+成片评分.md", "body": "\n> **实测（11/03 第二轮）：已用于生产。** 6.0 末尾的“全部输出前自行检查”即来自这里。\n\n**用法**：视频提示词写好、还没花钱生成之前，让 AI 按前半段打分，低于 80 分先改再生成；生成出来以后，用后半段给每个片段打分，决定留用还是重抽。适合做视频的同事控制生成成本。\n\n**来源**：[short-drama-prompt-director](https://github.com/zouchenzhen/short-drama-prompt-director) references/scoring_rubric.md，MIT（收集页面）。翻译摘编。\n\n**提示词正文**：\n\n```\n【一、生成前检查：请按以下 100 分量表给这份视频提示词打分】\nA. Seedance 兼容（15）：每个独立生成片段在 4~15 秒内，时间码能对上，总时长合理。\nB. 结构完整（10）：各部分齐全，镜头卡和提示词都能找到。\nC. 提示词干净（10）：交给模型的正文里只有画面描述，没有夹带说明、日志或修改意见。\nD. 剧情与节拍忠实（12）：保留了原剧本的钩子、冲突、情绪走向、关键节拍和关键台词。\nE. 动作具体（10）：情绪都转成了看得见的行为，动作具体、有时间、拍得出来。\nF. 导演与镜头控制（10）：机位、景别、焦段、构图、运镜、视角写清楚，但不过载。\nG. 角色、道具、场景连续（10）：人物外貌、服装、道具、空间布局、视线、光源前后一致。\nH. 光线、声音、风格（8）：光色、材质、声音服务剧情，风格清楚且商业上安全。\nI. 负面约束与合规（8）：写了防水印、防字幕、防乱码、防脸和服装漂移、防多余人物、防侵权元素的约束。\nJ. 可直接生成（7）：长度可控、没有互相矛盾的指令、单段不过载、方便复制。\n\n硬性扣分：\n- 有未解决的严重问题、片段短于 4 秒或长于 15 秒、正文夹带说明文字：总分最高 59。\n- 原剧本有关键台词但提示词里漏了；或写了“角色说话/喊/旁白”但台词栏是空的：严重问题，最高 59。\n- 没写负面约束：扣 4~8 分；只写“电影感镜头”这类空泛镜头语言：扣 3~8 分；情绪没转成动作：扣 3~8 分；没控制人物和服装漂移：扣 4~10 分；一段里塞了太多动作或地点：扣 3~8 分。\n\n分档：90~100 可直接测试生成；80~89 可以试，有时间先修；70~79 只适合内部迭代；60~69 生成前需要大改；60 以下不要直接喂给模型。\n输出：每项得分、总分、结论（通过/修改/放弃），以及生成前最该改的 3 处。\n\n【二、成片评分：生成后给每个片段单独打分】\n剧情贴合（20）、人物一致（15）、场景道具一致（10）、镜头执行（15）、画面质量（10，无严重变形、乱码、闪烁）、风格光线（10）、文化语义准确（10，中国文化元素和剧情用词没有被理解错）、可剪辑性（10，不用大修就能放进时间线）。\n85 分以上：留用；70~84：小修或从几次结果里挑；50~69：只作参考，建议重抽；50 以下：放弃。\n```\n"}, {"id": "6.12", "title": "跨段/跨集衔接：尾帧五要素 + 抽帧接力 + 防串戏四桶", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "status": "二轮实测：文字衔接部分已用于生产", "folder": "06-video/reference", "path": "06-video/reference/6.12-跨段-跨集衔接.md", "body": "\n> **实测（11/03 第二轮）：“跨段衔接”的文字部分已用于生产**（6.0【五】：已完成的动作不重演、段尾交代人物位置和道具归属等）。尾帧、抽帧接力不用：生产中全靠文字衔接。\n\n**用法**：一集要分几段生成，或者多集连续生成时用。测试反馈提到生产中会用「提取尾帧」功能，这条正好讲怎么写尾帧、怎么让下一段从尾帧自然接上、怎么防止后一段重演前一段的剧情。还没实测。\n\n**来源**：[MrYHM/seedance-studio](https://github.com/MrYHM/seedance-studio) references/07-series.md，MIT（10/30 加到收集页面）。摘编：原文的素材编号规则（C 编号库）换成了通用说法。\n\n**提示词正文**：\n\n```\n【每段/每集结尾附上尾帧描述（五要素齐全，不能只写一句“某某走向某处”）】\n尾帧描述\n场景：一句话说清谁在哪、正要做什么、离目标多远\n画面：\n- 主体：人物 + 服装 + 姿态\n- 背景：关键物体 + 状态\n- 光线：方向 + 色温\n- 构图：主体在画面哪个位置（居中 / 对角线等）\n- 氛围：一句\n用途：作为下一段的开场，衔接下一段的第一个事件。\n\n【抽帧接力（默认做法）】\n1. 从上一段成片截取尾帧图（X-tasy 里用提取尾帧）；\n2. 把这张图作为素材关联进来，标明来源（如“林冲·雪中背影·第2段尾帧”）；\n3. 下一段提示词第一条素材写：@图片1 作为首帧（上一段尾帧），从这个画面自然继续；\n4. 首镜描述和尾帧五要素逐项一致：同服装、同光线、同构图起点、同画面方向。\n备选：延长法（将@视频1延长15s），但抽卡率高、音色还原差，只在不方便截图时用。\n\n【防串戏四桶】写每一段之前，先把剧情事件分进四个桶，只有第二桶进入本段：\n1. 已经发生（不得重演）\n2. 本段只拍这个\n3. 后面再出现（本段暂不出现）\n4. 还没发生（不得提前出现）\n可以直接写进提示词的短语：“从上一段真实结尾继续”“不要重演上一段的动作”“本段只拍当前任务”“已完成的动作不得重复”。\n\n【编译前对照上一段检查】\n角色（服装、发型、道具、情绪状态）、场景（布局、左右关系）、画面方向（主体从左往右还是从右往左）、光线（主光方向、时间）、动作状态（上一段结尾发生了什么）、声音状态。\n不得漂移的：身份、服装、道具归属、地点、已完成的剧情状态。\n另外：连贯性正确但情绪平淡的镜头也算失败，要检查这一段的钩子有没有被镜头语言撑起来。\n```\n"}, {"id": "6.6", "title": "漫剧分镜五类模板", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "folder": "06-video/reference", "path": "06-video/reference/6.6-漫剧分镜五类模板.md", "body": "\n**用法**：用一张主角图做简单的漫剧短片时，按这五类分镜填空，每段 5 秒、9:16。比较基础，适合新人入门或快速出样片，正式项目建议用 4.1 和 6.4。\n\n**来源**：[canghe-skills](https://github.com/freestylefly/canghe-skills) skills/canghe-manga-drama，MIT（收集页面）。原仓库是调用火山方舟 API 的脚本，这里只取了里面内置的提示词模板。\n\n**提示词正文**：\n\n```\n风格尾缀（每段都加）：漫画风格，手绘质感，柔和的色彩过渡，线条清晰，日式或国漫风格，温馨治愈，电影级构图，高细节\n\n1. 主角登场：{角色}站在画面中央，微笑看向镜头，背景是柔和的光晕，漫画风格，温馨氛围，{风格尾缀}\n2. 动作场景：{角色}正在{动作}，表情生动，动作流畅，漫画风格，{风格尾缀}\n3. 情感表达：{角色}露出{情绪}的表情，眼神传达情感，漫画风格，{风格尾缀}\n4. 互动场景：{角色}与{物体}互动，场景温馨，漫画风格，{风格尾缀}\n5. 结尾定格：{角色}的定格画面，{结尾场景}，漫画风格，温馨治愈，{风格尾缀}\n\n每段前面可以加主题：“{主题}主题，”；参数：每段 5 秒，9:16 竖屏。\n```\n"}, {"id": "6.17", "title": "出片后局部返修：错误分类 + 只替换出错的镜头", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "folder": "06-video/reference", "path": "06-video/reference/6.17-出片后局部返修.md", "body": "\n**用法**：6.0 生成的某一段出片有问题（景别不对、道具抢画面、人物跳站位等）时用。不要整段或整集重写，按下面的格式告诉 AI 哪里错、要什么、保留什么，它只输出替换那一处的提示词。6.0 目前没有返修这一步，这条可以作为 6.0 之后的固定环节。\n\n**来源**：[haya-hello/AI-real-person-short-drama-workflow](https://github.com/haya-hello/AI-real-person-short-drama-workflow) docs/prompt-rules.md 与 templates/revision-request.md，MIT（收集页面，11/03）。原示例用英文角色名，这里换成了中文。\n\n**提示词正文**：\n\n```\n视频已经生成，其中一处出错。请只做局部补丁，不重写整段或整场。\n\n【我提供】\n修 第X段 X—X 秒：\n错：（例）要求侧脸特写，但视频拉成了中景；桌子占画面太多。\n要：（例）全程侧脸特写，桌子只露桌沿一角。\n保留：（例）林晚沉默不说话、合同只有一份、冷光、原台词。\n上一段结尾：……\n下一段开头：……\n\n【你先归类问题】从以下类型里选一个或几个：人物错误、站位错误、连镜错误、景别错误、角度错误、构图错误、光线错误、动作错误、道具错误、手部错误、表演错误、背景错误、对白错误、时长错误。\n\n【输出格式】\n【问题类型】景别错误 + 道具抢主体\n【替换 第X段 X—X 秒】\n（替换后的提示词，承接上一段结尾、接得上下一段开头，其余部分不动）\n```\n"}, {"id": "6.3", "title": "Seedance 2.0 提示词公式", "chapter": "六、视频生成（Seedance）", "license": "外部·仅参考", "status": "实测推荐，配合 6.4", "folder": "06-video/reference", "path": "06-video/reference/6.3-Seedance-2.0-提示词公式.md", "body": "\n> **实测（10/30）：推荐，和 6.4 搭配使用。** 选 Seedance 2.5 生成长段视频时，能让 AI 写出更细致的提示词描述。注意本条参数是 2.0 的，2.5 的官方写法见 6.9。\n\n**用法**：自己写 Seedance 提示词时对照。\n\n**来源**：[dexhunter/seedance2-skill](https://github.com/dexhunter/seedance2-skill/blob/main/zh/SKILL.md)，未标许可证，只作参考。\n\n**提示词正文**：\n\n```\n公式：主体与人物 + 场景 + 动作 + 运镜 + 分时段描述 + 转场特效 + 音频设计 + 风格氛围\n\n素材引用：用 @图片1、@视频1、@音频1 引用上传的素材，并且必须写明每个素材的用途（首帧 / 人物形象 / 运镜参考 / 节奏 / 音效）。\n\n平台限制：单次最多 12 个文件；输出 4~15 秒；不支持写实真人脸部素材。\n\n常见错误：引用不说明用途、指令互相冲突、一次塞进太多内容。\n```\n"}, {"id": "6.9", "title": "Seedance 2.5 官方写法（素材职责、30 秒分阶段、首尾帧、延长、宫格分镜）", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "status": "二轮实测：分阶段写法已用于生产", "folder": "06-video/reference", "path": "06-video/reference/6.9-Seedance-2.5-官方写法.md", "body": "\n> **实测（11/03 第二轮）：“30 秒长段分阶段写”已用于生产，并进 6.0（每段不少于 15 秒、按 0—X 秒写时间段）。** 其中首尾帧、宫格分镜、素材逐份写采用/不采用这几部分没有用：生产中全靠文字衔接，素材直接关联。\n\n**用法**：用 Seedance 2.5 生成视频时参考，特别是挂多个素材、生成 30 秒长段的时候。实测反馈说 6.3 + 6.4 在 2.5 上好用，这条是 2.5 官方的写法，可以和它们一起用。其中「多素材创作」那部分（给每个素材写清采用什么、不采用什么，再按场景调用）正好对应 X-tasy 画布里关联素材的思路。\n\n**来源**：字节官方《Seedance 2.5 提示词撰写指南》（[飞书文档](https://bytedance.larkoffice.com/docx/OsiUdR1OxoDqvnxsK8LczYx7nPd)，最新修改 9 月 21 日；[火山引擎官网版](https://docs.volcengine.com/docs/82379/2607689?lang=zh)）。10/30 在浏览器里读了官方原文后重写本条，下面的模板摘自原文，示例换成了短剧场景。原文里的素材数量表格没有读全，具体上限以官方页面为准。官方还提供一个 Seedance 2.5 Skill 用来调优提示词，安装方式见原文开头。\n\n**官方说明**：提示词写法影响的是指令遵循、素材一致性和可控性，不改变模型能力上限；画质、真人感、复杂运镜仍受模型、素材和随机性影响。\n\n**提示词正文**：\n\n```\n【基础模板】（必写的只有“主体 + 动作或事件”，其余不需要可以省略）\n<主体>在<场景与环境>中<主要动作或事件>。\n画面呈现<视觉风格>。\n镜头采用<景别、机位、运镜或切镜>。\n声音包括<对白、环境声、音效或音乐>。\n生成参数（时长、画幅等）在生成页面设置，不写进提示词。动作优先概括主要过程，只给关键动作写细节，不重复描述同一个动作。\n\n【声音与台词】\n- 台词写在 {} 里：女孩轻声说：{你终于来了}\n- 非中文台词先写明语言：女孩用日语轻声说：{もう大丈夫です}\n- 需要控制口音时：台词语言 + 地区变体或口音 + 表达方式 + 说话人 + {台词}\n- 可以直接写：无背景音乐，只保留人物对白、环境声和动作音效。／不要字幕。\n\n【多素材：让模型知道每个场景用哪个素材】\n顺序：逐份素材职责 → 主体映射 → 按类型分组 → 主体设定 → 分场景调用\n（例）\n【人物】<沈晚>的外貌与服装：@图片1。<顾言>的外貌与服装：@图片2。\n【道具】<离婚协议>对应@图片3，只属于<沈晚>。\n【场景】<顾家客厅>参考@图片4，只采用空间、材质和光线。\n【动作与声音】@视频1用于<沈晚>甩出文件的动作，不采用视频中的人物和场景。\n\n【主体设定：沈晚】（同一人物跨场景用多份素材时加）\n外貌与服装：@图片1。固定道具：@图片3中的<离婚协议>。出现地点：<顾家客厅>。\n动作参考：@视频1的甩文件动作。不采用：其他人物的服装。\n\n场景一｜顾家客厅摊牌\n使用：<沈晚>、<顾言>、<离婚协议>、<顾家客厅>和@视频1的动作。\n事件：<沈晚>把离婚协议拍在茶几上，<顾言>愣住。\n结束时：协议停在茶几中央，<沈晚>站在画面左侧，<顾言>坐在沙发右端。\n（多素材的目标是让模型在当前场景里选对素材，不要求所有素材同时出现。）\n\n【30 秒长段：按阶段写，每段写清结束状态】\n【生成目标】一句话说这一段要生成什么。\n【阶段一】开始时：<可见状态>。主要事件：<一个主要变化>。结束时：<可见状态，如东西在谁手里、在哪一侧>。\n【阶段二】承接上一阶段：<保持什么>。主要事件：<一个主要变化>。结束时：<可见状态>。\n【保持一致】<人物身份、服装、道具归属、空间方向>稳定。\n时间戳只用在关键交接、进出场、转场：时间区间（0-3秒……3-7秒）、明确时间点（第5秒镜头快速左移完成转场）、相对时间（按下按钮3秒后灯熄灭）。时间段要连续不重叠，只是时间预算，不是精确剪辑点；不要用时间戳控制“一秒做三个动作”。\n\n【首尾帧（在多素材模式里直接写）】\n@图片1作为首帧，定义视频开始时的构图、主体位置、姿态、道具状态、场景和镜头方向。\n@图片2作为尾帧，定义视频结束时的构图、主体位置、姿态、道具状态、场景和镜头方向。\n@图片3用于<主体A>的<外貌、服装>，不改变@图片1定义的首帧构图，不改变@图片2定义的尾帧构图。\n<描述一个连续动作>。画面从首帧自然开始，经过连续动作到达尾帧。首尾之间保持<人物身份、道具、场景布局、镜头方向>连续。\n注意：首帧和尾帧要用相同画幅；每张锚点图单独说明，不要写“图片1和图片2作为首尾帧”。\n\n【多关键帧】\n以@图片1至@图片N的顺序作为关键帧。@图片1作为首帧……@图片2定义第二个关键帧：<第一阶段结束时的可见状态>……@图片N作为尾帧。\n画面依次经过各关键帧定义的状态，各阶段之间用连续动作自然过渡。\n\n【宫格分镜】（建议 15 格以内，用简洁线稿，少写文字）\n@图片1提供<N格宫格分镜>的镜头顺序和大致构图，按照从左到右、从上到下的顺序读取；不采用图中的线稿画风、文字标注或占位人物。\n@图片2定义<主体A>的<外貌与服装>。\n镜头1：<景别、主体动作、场景状态>。镜头2：……镜头N：<结束动作和结束画面>。\n最终画面采用<视觉风格>，声音包括<对白、环境声、音效或音乐>。\n\n【向后延长】\n@视频1是需要向后延长的原视频。向后延长@视频1。延长片段的第一个画面直接承接@视频1尾帧：保持<场景、人物站位、道具位置>连续。\n随后，<新动作或事件>。延长过程中保持<人物面部、服装、场景布局、镜头方向>连续。\n\n【向前延长】\n@视频1是需要向前延长的原视频。向前延长@视频1。在原视频开始之前，<前置动作或事件>。\n延长片段的最后一个画面自然衔接@视频1首帧：<主体姿态与朝向>，<道具位置>，<背景与空间关系>。\n同一主体始终保持为同一个连续对象，不重复、不分裂。\n（只写“随后承接原视频”，模型可能提前带入后面的人物或特效，所以要把原视频首帧写成明确的结束状态。）\n\n【情绪：按触发事件递进，写看得见的反应】\n听到或看到<第一个触发事件>时，<第一个可观察反应>。当<第二个触发事件>出现后，<表情、视线或呼吸的变化>。确认<关键信息>后，<试图克制的情绪>通过<可观察表现>逐渐显现。最终，<最后的动作、表情或说话方式>。\n（例）门外传来他的声音。她握着杯子的手指停住，视线缓慢转向门口，肩膀仍然紧绷。确认是他后，她先轻轻呼出一口气，嘴角浮现克制的笑，眼眶慢慢湿润，但没有起身。\n\n【运镜】景别（大全景/全景/中景/近景/特写）、运镜（推、拉、摇、移、跟、环绕、俯冲、手持晃动）、视角（低角度、俯视、第一人称）可直接写。一镜到底、希区柯克变焦、子弹时间这类要同时写清作用于谁、画面怎么变。光圈、焦距数值可以写，但写出“看得见的结果”更明确。\n\n【提交前检查】\n□ 主体和主要动作或事件说清楚了吗？\n□ 每份素材都写了采用什么、不采用什么吗？\n□ 不同人物、道具是否逐一命名并绑定素材？\n□ 多素材是否按场景选用，而不是要求全部同时出现？\n□ 长段的每个阶段是否只有一个主要变化，并写清结束状态？\n□ 人物数量、服装、道具归属、空间关系是否稳定？\n□ 抽象情绪和摄影术语是否落到了看得见、听得到的表现上？\n□ 首尾帧、多关键帧是否逐张说明，首尾帧是否同一画幅？\n□ 视频延长是否检查了边界画面、运动趋势和声音连续？\n```\n"}, {"id": "6.8", "title": "即梦 Seedance 2.0 素材引用写法与平台限制", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "status": "二轮未用", "folder": "06-video/reference", "path": "06-video/reference/6.8-即梦-Seedance-2.0-素材引用写法与平台限制.md", "body": "\n> **11/03 说明：二轮测试未用。** 生产中角色、场景在生成时直接关联素材，提示词里不需要写素材名称、编号和引用语法。\n\n**用法**：在即梦里用 Seedance 2.0 上传参考图、参考视频、参考音频时，按这里的写法引用素材。最常见的问题是只写「参考@视频1」却不说参考什么，模型就容易乱用。\n\n**来源**：[short-drama-prompt-director](https://github.com/zouchenzhen/short-drama-prompt-director) references/seedance2_official_jimeng_rules.md，MIT（收集页面）。原作者整理自 Seedance 2.0 论文、火山引擎官方页面和 2026 年 6 月的即梦帮助页面快照。平台限制会变，下面的数字以即梦当前页面为准。\n\n**提示词正文**：\n\n```\n【素材引用写法】\n每个素材都要用 @素材名 引用，并写明用途、情绪、时间和细节，不要只写“参考@视频1”。\n好的写法：\n- @图片1 作为首帧\n- @图片2 参考角色服装和发型\n- @视频1 参考镜头语言、动作节奏和转场逻辑\n- @音频1 用于配乐节奏和氛围\n- @视频1 中的小猫作为主体1；@视频1 中给小猫洗澡的主人作为主体2\n- @图1 为首帧，参考 @视频1 的打斗动作\n多个素材时，给每个对象固定编号（主体1、主体2、道具1、场景1），全段统一使用；写清楚哪个素材管身份、哪个管动作、哪个管镜头、哪个管风格、哪个管声音。\n\n【提示词里还要写】\n按时间顺序的剧情线（如 0-5秒、6-11秒、12-15秒）；重要动作的情绪状态；参考视频负责的镜头语言或转场逻辑；音频负责的配乐或音效意图；连续性要求（色调、风格、场景逻辑、动作衔接，不要出现多余表情或剧情跑偏）。\n\n【入口选择】\n只有首帧或首尾帧图片 + 文字：用“首尾帧”；图片、视频、音频、文字混合参考：用“全能参考”。\n\n【视频延长】\n“将@视频1延长 5s”时，生成时长也要选 5 秒；提示词里分开写“原视频要保持的内容”和“新生成的部分”，写清延续方向、情绪、运镜和结束画面。\n\n【平台限制（2026 年 6 月快照，以即梦当前页面为准）】\n- 图片最多 9 张，每张小于 30MB；视频最多 3 个，总时长 2~15 秒，每个小于 50MB；音频最多 3 个，总时长不超过 15 秒，每个小于 15MB；混合上传最多 12 个文件。\n- 生成时长 4~15 秒。\n- 不支持上传包含写实真人脸的图片或视频，可能被自动拦截。真人角色要保持一致，改用生成的角色设定图、非真人风格参考或工作流里生成的首帧。\n```\n"}, {"id": "6.2", "title": "短剧分镜示例：雨夜情感戏", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "folder": "06-video/reference", "path": "06-video/reference/6.2-短剧分镜示例.md", "body": "\n**用法**：同 6.1，是更简短的写法：用一个镜头组合写完 5 秒的情绪爆发。\n\n**来源**：X（推特）账号 John（@johnAGI168），由 awesome-seedance 收录。\n\n**提示词正文**：\n\n```\n【风格】热门中国网剧风格（短剧风格），极致快切节奏，高颜值滤镜，情感爆发，浪漫且扎心的雨夜。\n【时长】15 秒\n【人物】深情的霸道总裁男主（黑色大衣，湿漉漉的头发，红了眼眶）VS 倔强心碎的女主（白色连衣裙，满脸泪水）。\n[00:00-00:05] 镜头 1：快速剪辑组合。\n雨街。女主决然转身离去。男主冲上前，一把拉住她的手腕，猛地拽向自己，两人撞在一起。\n镜头组合：雨滴特写 + 两人对视 + 男主眼眶泛红 + 女主泪水滑落。\n男主嘶吼：\"你凭什么替我做决定！\"\n女主推开他，哭着喊：\"因为我爱你啊！\"\n男主愣住，雨水顺着脸颊滑落。他猛地吻上去。\n定格在两人雨中拥吻的剪影上，闪电划过。\n```\n"}, {"id": "6.4", "title": "视频提示词九段骨架 + 生成失败降级", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "status": "实测推荐，配合 6.3；二轮已用于生产", "folder": "06-video/reference", "path": "06-video/reference/6.4-视频提示词九段骨架+生成失败降级.md", "body": "\n> **实测（11/03 第二轮）：已用于生产，并进 6.0。**\n\n> **实测（10/30）：推荐，和 6.3 搭配使用。** 同上。\n\n**用法**：把一个分镜段写成视频生成提示词时，按这九段的顺序填。和 6.1、6.2 的示例搭配用：示例看写法，这个看结构。后半段是「同一个镜头反复生成失败时怎么办」，做视频的同事很用得上。\n\n**来源**：[Dramake](https://github.com/xixihhhh/ai-short-drama-skill) skills/dramake/references/prompt-compiler.md，MIT（收集页面）。摘编，原文英文字段名改成了中文。\n\n**提示词正文**：\n\n```\n请按以下九段顺序，把这个分镜段写成视频生成提示词（按模型接受的长度压缩，但顺序不变）：\n\n1. 场景背景：类型、时间地点、人物数量、本段的目标，以及本段唯一的剧情推进。\n2. 参考素材：逐个说明每张参考图/视频负责什么（身份/服装/场景/道具/声音/动作），以及“不许从它身上带过来的东西”。\n3. 空间与起始状态：人物、机位、道具、出入口的起始位置关系和尺度参照。\n4. 画幅与镜头：画幅、镜头高度和焦段、主要运镜、运镜动机和终点。\n5. 动作时间轴：按秒写 3~6 个节拍，每个节拍只有一个主要变化；复杂动作从已经在发生的动作开场，不要先站着等。\n6. 表演与物理：谁说话、听的人什么反应、接触的过程、惯性、材质和最终稳定状态。\n7. 光线与声音：有来源的光、现场声、对白来自谁、音乐的边界、段尾声音状态。\n8. 必须命中：最多 1~3 个核心事件、精确的结束状态，以及和下一段的接口。\n9. 负面约束：只写最可能出现、损失最大的几个错误，不要堆几十条互相打架的否定词。\n\n不同模式的注意点：\n- 文生视频：身份和空间写完整一些。\n- 首帧图生视频：首帧已经决定的外观和构图不要重复描述，重点写运动、表演、声音和结束状态。\n- 首尾帧：写清楚从 A 到 B 的可行运动路径，中间不要加去不了 B 的新地点或换装。\n- 多参考：每个参考编号绑定职责，先删掉互相冲突的参考，参考不是越多越好。\n- 视频续写：只写还没完成的动作和接下来的节拍，不复述已经发生的。\n\n同一个镜头连续两次失败时，按这个顺序降级：\n1. 保留必须命中的内容，删掉装饰动作和次要镜头；\n2. 降低运镜复杂度，改成固定、好看清的机位；\n3. 把“建立、高潮、后果”拆成几段分别生成；\n4. 改用关键帧、动作参考或局部编辑；\n5. 最后才考虑换模型或提高质量档位。\n原则：一段视频只承担一个主要道具、一个高风险物理动作和一个主要回报，20~30 秒也塞不下多人轮流对白 + 复杂交接 + 变形 + 追逐 + 换地点。\n```\n"}, {"id": "6.1", "title": "短剧分镜示例：真假千金", "chapter": "六、视频生成（Seedance）", "license": "外部·可直接用", "folder": "06-video/reference", "path": "06-video/reference/6.1-短剧分镜示例.md", "body": "\n**用法**：给 Seedance 2.0 生成 15 秒竖屏短剧片段时参考。结构是「风格 → 角色 → 全局要求 → 每 5 秒一段（画面 + 口型字幕）」，换掉内容就能套用到别的桥段。重点是「口型与字幕逐字一致」和「人物一致性稳定」这两条全局要求。\n\n**来源**：微信公众号「卡尔的AI沃茨」，由 [ZeroLu/awesome-seedance](https://github.com/ZeroLu/awesome-seedance)（2.0k star，MIT）收录。\n\n**提示词正文**：\n\n```\n【风格】豪门恩怨、真假千金、极致反转、撕绿茶、高定礼服、美艳御姐\n\n【角色】\n真千金（烈焰红唇，黑天鹅高定礼裙，气场全开）\n假千金（小白花扮相，泪眼装可怜）\n\n【全局要求】\n9:16 竖屏，电影质感，奢华宴会厅水晶灯与香槟塔，光影高级。真千金与假千金人物一致性稳定，脸不变，礼服不变。口型与字幕逐字完全一致，字幕即台词本身。每句台词控制在短句，清晰可读。\n\n[00:00-00:05] 奢华宴会厅中景，假千金故意撞翻桌边古董花瓶，清脆碎裂，她立刻坐地抱住碎片边缘假哭，抬手指向真千金，周围宾客围成半圈，纷纷侧目。口型与字幕：姐姐，你为什么这样\n\n[00:05-00:10] 真千金近景，冷艳俯视，红唇微扬带嘲讽，抬手甩出一份文件砸到假千金面前。镜头切文件特写，画面只需要清晰看到大字 DNA 与红色印章 无血缘，不要密集小字。假千金抬眼，泪停住，脸色发白。口型与字幕：演够了吗\n\n[00:10-00:15] 全场反应一瞬，宾客捂嘴惊呼，镜头立刻切回真千金。真千金走到主位旁，从假千金头上干脆取下皇冠，稳稳戴回自己头上，转身落座主位，抬眼扫全场。两名保安出现把假千金拖走，只给她被拖走的背影与无力挣扎。真千金定住女王姿态。口型与字幕：这是我家，滚\n```\n"}, {"id": "6.10", "title": "素材绑定写法 + 首镜四段结构 + 样片四项排查", "chapter": "六、视频生成（Seedance）", "license": "外部·仅参考", "status": "二轮未用", "folder": "06-video/reference", "path": "06-video/reference/6.10-素材绑定写法+首镜四段结构+样片四项排查.md", "body": "\n> **11/03 说明：二轮测试未用。** 素材直接关联，不需要在提示词里写绑定。\n\n**用法**：针对实测反馈里指出的缺口（4.1、4.2 模板缺少「关联画布素材」的部分，导致条件冲突）。在 X-tasy 里让 momo agent 出分镜提示词时，可以把这段作为补充约束一起给它：先说清每个画布素材负责什么，再写事件，最后写保持一致的项。这条还没实测，建议下一轮测试优先测。\n\n**来源**：根据以下资料整理，不是原文照录：6.9 的 Seedance 2.5 官方多素材写法（逐份写素材职责、只采用/不采用、主体设定、分场景调用）；[腾讯云开发者社区《即梦 AI 怎么做短剧？角色图到第一个镜头的提示词模板与排查表》](https://cloud.tencent.com/developer/article/2755986)（我只读到它的结构摘要：首镜四段结构、主体用固定称呼加 2~3 个静态特征、样片按脸/人数/画风/字幕四项排查、第二镜沿用同一组素材和称呼）。X-tasy 和 momo agent 没有公开文档，具体能否识别这些写法需要实测。\n\n**提示词正文**：\n\n```\n请根据分镜脚本输出分镜提示词，并遵守以下素材约束：\n\n【一、素材职责】（先写，逐个对应画布里已有的素材）\n- [角色素材名]：只采用外貌、发型、服装；不采用背景和姿势。\n- [场景素材名]：只采用空间布局和光线；不采用图中人物。\n- [动作/镜头参考名]：只继承动作节奏和运镜，不再逐个复述动作。\n人物用固定称呼 + 2~3 个不会变的特征（如“林晚，齐肩黑发，左眼下泪痣，白色风衣”），全片称呼不变。\n\n【二、生成目标】一句话说这一镜要生成什么。\n\n【三、事件脚本】按时间写这一镜发生的动作和台词；文字只写素材没有提供的信息（动作、表情变化、台词、镜头变化），不要再重复描述素材里已经有的外貌和场景，避免和素材条件冲突。\n\n【四、保持一致】列出这一镜必须稳定的项：人物数量、称呼、服装、道具在谁手里、空间方向。\n\n【下一镜】沿用同一组素材和同一称呼；动作从上一镜的结束状态接着往下。\n\n【样片排查】先出低清样片，四项都过了再出高清：\n1. 脸：和角色素材是否一致；\n2. 人数：画面里人数对不对，有没有多出人；\n3. 画风：是否符合成片画风；\n4. 字幕：有没有多出或乱码的字幕。\n```\n"}, {"id": "7.1", "title": "合规红线 11 条 + 敏感词替换表", "chapter": "七、合规", "license": "外部·可直接用", "folder": "07-compliance", "path": "07-compliance/7.1-合规红线-11-条+敏感词替换表.md", "body": "\n**用法**：剧本写完后做合规自检，把这段和剧本一起发给 AI。比 1.0 里「绝对不能有关于警察执法、政治、色情、血腥暴力、外国角色、抽烟等违禁元素」那一句细得多，还附了替换词。注意：这是全年龄线的标准，成人线另按「成人线与全年龄线分开原则」处理。\n\n**来源**：[short-drama-factory](https://github.com/lixiaoxiao9888-create/short-drama-factory) references/screenplay-compliance-rules.md，MIT（收集人提供）。摘编。原文称依据「广电 16 号令及 2026-06 专项治理」，具体政策条文我没有逐条核对，正式使用前建议和平台最新审核规则对一下。\n\n**提示词正文**：\n\n```\n请对照以下红线逐条审查剧本，列出所有命中的位置（第几集/第几场/哪一句）、命中哪一条，并给出合规改写。\n\n一票否决红线：\n1. 政治性有害内容：危害国家统一/主权、泄露国家秘密、损害国家荣誉。\n2. 暴力复仇/私刑：主角不得以暴制暴、私自处决反派；惩恶可用商业制裁、揭露真相、正当防卫，最终刑事责任交给公安和司法机关。\n3. 封建糟粕/纯迷信真鬼：禁八字合婚、冥婚、跳大神；民俗恐怖要走“民俗解谜/非遗志怪”包装，落点是人为或心理悬疑。\n4. 低俗色情：禁露点、性暗示镜头、露骨台词、软色情擦边。\n5. 毒品/赌博：禁展示吸毒制毒细节、赌博出千手法。\n6. 丑化军警公职：警察、法官、检察官、军人不得塑造成反派或贪腐者；不得出现“买通法官”“官匪勾结”。\n7. 歪曲历史/民族宗教：禁美化侵略、破坏民族团结、亵渎宗教。\n8. 拜金炫富：禁宣扬“金钱万能”“嫁入豪门即人生胜利”；奢华元素只能作为反派丑态或主角伪装，终局导向勤劳、正义。\n9. 未成年人不良引导：禁未成年人吸烟饮酒、校园霸凌、早恋美化；未成年角色不参与暴力复仇主线。\n10. 个人隐私：禁出现真实身份证号/手机号/住址/车牌；禁把“全网人肉”当爽点。\n11. 其他违反公序良俗：出轨合法化、虐待动物、畸形婚恋观等。\n\n节奏自查：反派恶行（造谣、虐待、侵占、构陷）不得超过 3 集仍未遭到任何反击或惩治。\n动作戏写法：用“受力震飞、骨裂声响、制服倒地”等写意手法，不写断肢见血。\n\n敏感词替换：\n- “杀了他 / 要你的狗命 / 灭门” → “废了他 / 让你付出代价 / 让他受到法律制裁 / 送他进铁窗”\n- “黑社会 / 堂口 / 砍人” → “地下商会 / 暗处势力 / 地痞恶霸”\n- “买凶杀人” → “雇佣打手制造麻烦”\n- “我要弄死他” → “我让他跪着把账还清楚 / 我要他当众身败名裂”\n- “这鬼真的索命来了” → “这老宅里的传说原来是有人装神弄鬼”\n- “行贿 / 买通法官” → “不正当利益输送 / 违规商业勾结”\n- “泼硫酸 / 割喉” → “打落手腕 / 夺下凶器 / 当场制伏”\n- “老太婆去死” → “你休想再颠倒黑白”\n```"}, {"id": "4.2", "title": "四格分镜板 + 单镜字段", "chapter": "四、分镜", "license": "外部·仅参考", "status": "实测不推荐", "folder": "archive/04-storyboard", "path": "archive/04-storyboard/4.2-四格分镜板+单镜字段.md", "body": "\n> **实测（10/30）：不推荐用于 X-tasy。** 原因同 4.1。详见《提示词测试反馈汇总20261030》。\n\n**用法**：需要给每个镜头出分镜图，或者要把镜头信息写得更完整时用。四格分镜板（开头 → 动作展开 → 高潮瞬间 → 结束状态）可以直接拿去生成分镜图。\n\n**来源**：收集人提供的 script_writer_prompt.md（英文原文，出处标注为 Robert's Tech Toolbox 的「8-Prompt Hollywood Movie System」，许可不明）。这里是我节选翻译的。原文按 20 秒横屏场景设计，用于竖屏短剧时，时长按我们自己的标准调整。\n\n**提示词正文**：\n\n```\n请把剧本的每个镜头拆成以下字段，并为每个镜头出一份四格分镜板。\n\n【单镜字段】\n- 镜头时长：（秒）\n- 镜头目的：这个镜头为什么存在（交代环境/引出人物/揭示信息/情绪反应/角色抉择/高潮/转场）\n- 重要程度：1~10（1~2 过场，简单处理；9~10 重大揭示或情绪顶点，重点处理。重要程度决定镜头数量、运镜复杂度和停留时长）\n- 景别、运镜、镜头焦段、构图\n- 人物入画状态：位置、姿态、情绪\n- 人物动作变化 / 人物反应\n- 台词潜台词：话底下真正想说、隐瞒或害怕的是什么\n- 道具及其状态：归谁、在哪、什么状况\n- 连续性-承接：从上一镜头继承的状态\n- 连续性-交出：交给下一镜头的状态\n- 转场方式及理由：硬切/匹配剪辑/叠化/声音先入/时间跳跃等，每个转场都要有叙事理由\n\n【四格分镜板】\n- 第 1 格 · 开头：观众第一眼看到的画面、人物位置、机位\n- 第 2 格 · 动作展开：动作如何推进，人物和镜头怎么动，光线怎么变\n- 第 3 格 · 高潮瞬间：本镜头最关键、情绪最强的一帧\n- 第 4 格 · 结束状态：人物和镜头停在哪里，最终构图\n- 衔接说明：这一镜和上一镜怎么接，又为下一镜留下什么\n规则：每一格都是一个不同的画面状态，不只是换个姿势；上一镜的结尾就是下一镜的起点。\n\n【生成分镜图用】\n4-panel storyboard for [镜头描述]. Panel 1: [第1格]. Panel 2: [第2格]. Panel 3: [第3格]. Panel 4: [第4格]. Clean panel grid, clear separation between panels, cinematic style.\n```"}, {"id": "4.1", "title": "剧本转 AI 分镜：单镜三行模板", "chapter": "四、分镜", "license": "外部·可直接用", "status": "实测不推荐", "folder": "archive/04-storyboard", "path": "archive/04-storyboard/4.1-剧本转-AI-分镜.md", "body": "\n> **实测（10/30）：不推荐用于 X-tasy。** 条理清楚，但不如直接让 momo agent 根据分镜脚本出分镜提示词；模板里没有关联画布素材的部分，和素材条件冲突，出片不符合要求。详见《提示词测试反馈汇总20261030》。\n\n**用法**：剧本定稿后生成分镜。先发「单镜规范」，再按「调用模板」贴剧本。它的强项是动作四段式和空间量化（标出人物间距、动作幅度），能减少人物重叠、动作僵硬。可以接在 1.0 的「▲」动作处理之后用。\n\n**来源**：[script-to-storyboard](https://github.com/nhanhxxm2can9351-glitch/script-to-storyboard) templates 目录，MIT。\n\n**提示词正文**：\n\n```\n【单镜规范】每个分镜严格按三行输出：\n\n第1行（加粗）：分镜X 分镜名称（起始时间-结束时间）\n  示例：分镜17 神丹到手（00:46.5-00:52）\n第2行：【景别】，【机位角度】，【镜头运动：运动方式+跟随主体+运动节奏+衔接方式】，【剪辑约束：无跳切/无卡顿/无缝衔接】，动态模糊强度：低/中/高：\n  人物站位与空间关系 + 完整动作时序（预备→发力→中途→收尾） + 动作次生物理效果 + 人物神态视线细节 + 环境联动表现\n第3行（斜体）：台词 / OS / 系统语音：对应内容\n  无台词时：台词 / OS / 系统语音：无（同期声：xxx 音效）\n\n镜头参数可选值：\n- 景别：大远景 / 全景 / 中景 / 中近景 / 近景 / 特写 / 大特写\n- 机位角度：平视 / 微仰 / 低机位仰拍 / 微俯 / 高机位俯拍 / 主观视角\n- 镜头运动：推 / 拉 / 摇 / 移 / 跟随 / 环绕 / 手持微晃 / 固定机位（必须绑定主体与节奏）\n- 剪辑约束：无跳切 / 无卡顿 / 无缝衔接 / 承接上一分镜姿态\n- 动态模糊：低 / 中 / 高\n\n动作时序四段式（必须完整）：\n- 预备：动作起始姿态（江枫右手撑地、小臂肌肉绷紧）\n- 发力：力量发出过程（腰腹发力卷身而起、道袍下摆扬起）\n- 中途：动作过渡状态（单膝离地过渡至双脚踏实地面）\n- 收尾/定格：动作结束姿态（直立定格、双肩打开、下颌微抬）\n\n空间量化要求：标注人物间距（如“两人面部间距约25cm”）、动作幅度（如“右脚后撤约40cm”）、物体尺寸、特效范围。\n\n次生物理效果（至少选配一项）：尘土 / 光晕 / 衣料褶皱 / 光影变化 / 气流扰动 / 纱帐鼓荡 / 粒子飞散 / 冲击波纹 / 水雾 / 碎石飞溅\n\n节奏：剧情和动作段单镜 1.5~2.5 秒，情绪、特效、收尾镜头 3~5 秒。\n\n负面排除项（全局强制）：杜绝游戏CG感、禁止动作迟钝僵硬、禁止逻辑混乱、人物无变形无穿模、无字幕无水印\n\n【调用模板】\n剧本：[剧本全文]\n要求：单集总时长 XX 秒，XX 题材，XX 风格，资产 ID 预留\n特殊画质要求（选填）：如 ARRI ALEXA Mini LF，青橙色调，手持跟拍\n```\n"}, {"id": "5.1", "title": "角色参考四件套（主设定 / 表情 / 角度 / 姿态）", "chapter": "五、角色与场景设定", "license": "外部·仅参考", "status": "实测无明显提升", "folder": "archive/05-design", "path": "archive/05-design/5.1-角色参考四件套.md", "body": "\n> **实测（10/30）：无明显提升。** 生产中本来就关联角色、场景素材并用提取尾帧，变脸和场景跳变基本不出现。仅作参考。\n\n**用法**：开拍前为每个主要角色建档，保证生成视频时人物不「变脸」。原文强调这是第一步：没有这套参考，角色在场与场之间会变样，这是 AI 视频的头号问题。\n\n**来源**：收集人提供的 script_writer_prompt.md，节选翻译，许可不明。\n\n**提示词正文**：\n\n```\n请为剧本中每个主要角色（包括新出场角色）输出以下四张参考表：\n\n【一、主设定表】\n角色名 / 首次出场 / 年龄 / 身高 / 体型与体态 / 肤色与肤质、明显标记 / 脸型 / 眼睛（颜色、形状、神情）/ 鼻 / 嘴唇 / 发型发色 / 显著特征（疤痕、痣、纹身等）/ 声音（性别、年龄感、音色、口音）/ 性格的外在表现（站姿、手势、表情习惯）/ 默认服装（面料、颜色、版型、新旧）/ 场景服装变体\n\n【二、表情表】（每种情绪写具体的面部变化和镜头可见线索，不只写情绪名）\n恐惧 / 愤怒 / 希望 / 疲惫 / 坚定 / 绝望 / 麻木 / 剧情需要的其他情绪\n例：愤怒——咬紧下颌、眉头紧锁、鼻翼张开、眯眼；可见线索：太阳穴青筋、皮肤泛红、身体僵直\n\n【三、角度表】\n正面 / 左侧面 / 右侧面 / 左四分之三 / 右四分之三 / 俯视 / 仰视——每个角度写外貌特征和辨识要点\n\n【四、姿态表】\n自然站立 / 走路 / 跑步 / 坐 / 跪 / 伸手 / 剧情特有姿态——每种写身体描述和轮廓特征\n\n【五、角色持续状态】（逐场更新）\n默认位置 / 默认姿态 / 默认情绪基线 / 默认服装状态 / 常带道具 / 动作特征（步态、速度、手势）/ 身体限制（伤病等）/ 行为习惯（眼神接触、个人距离）\n每场结束时记录退场状态；下一场默认继承，除非剧情明确改变。\n```\n"}, {"id": "5.2", "title": "场景设定表", "chapter": "五、角色与场景设定", "license": "外部·仅参考", "status": "实测无明显提升", "folder": "archive/05-design", "path": "archive/05-design/5.2-场景设定表.md", "body": "\n> **实测（10/30）：无明显提升。** 原因同 5.1。仅作参考。\n\n**用法**：为每个重要场景建档，保证同一场景在不同集里光线、陈设一致。\n\n**来源**：收集人提供的 script_writer_prompt.md，节选翻译，许可不明。原文的科幻场景专用部分（空气中必有雾霾、粒子）没有收录，用到科幻题材时可以回看原文。\n\n**提示词正文**：\n\n```\n请为剧本中每个重要场景输出一张场景设定表：\n\n场景名 / 场景标题（内景或外景・地点・时间）/ 时间段（黎明、黄昏、黄金时刻、蓝调时刻、夜晚等）\n光线：主光、辅光、光源、色温\n氛围：空气质感（雾、尘、蒸汽、湿度）、空间感（压抑/开阔）\n主要建筑与结构特征 / 表面材质与新旧程度 / 色彩基调（主色、点缀色、情绪色）\n反复出现的元素：每次在这个场景都必须出现的物件或细节\n一致性要求：这个场景里什么必须保持不变；光线永远从哪个方向来、什么色温\n```\n"}, {"id": "5.4", "title": "一致性与画质尾缀", "chapter": "五、角色与场景设定", "license": "外部·仅参考", "status": "实测不推荐", "folder": "archive/05-design", "path": "archive/05-design/5.4-一致性与画质尾缀.md", "body": "\n> **实测（10/30）：不推荐。** 加一致性描述仍会按模型精度出现畸形、穿模；画质、参数、水印由生成选项决定，画质尾缀意义不大。\n\n**用法**：生成角色图、分镜图或视频时，追加在提示词末尾。\n\n**来源**：[AIGC SDM](https://www.aigcsdm.com/news/118)，文章版权归作者。\n\n**提示词正文**：\n\n```\n【图生视频结构】主体 + 动作 + 表情 + 场景 + 运镜/景别 + 风格 + 画质\n\n【人物一致性尾缀】面部稳定清晰，人体结构正常，服装、发型、五官前后一致，无穿模、无变形\n\n【画质尾缀】8k，4k，超高清，电影质感，照片级真实，细腻光影，高细节，无锯齿，胶片质感，HDR\n```"}, {"id": "5.3", "title": "场次连续性状态表", "chapter": "五、角色与场景设定", "license": "外部·仅参考", "status": "实测不推荐", "folder": "archive/05-design", "path": "archive/05-design/5.3-场次连续性状态表.md", "body": "\n> **实测（10/30）：不推荐。** 条件过于复杂，可能让视频模型理解出现偏差；效果和 agent 自动描述差别不明显。\n\n**用法**：连续生成多场戏时，每场结束让 AI 输出一次状态表，下一场以此为起点，避免道具「瞬移」、伤口消失、衣服换色。\n\n**来源**：收集人提供的 script_writer_prompt.md，节选翻译，许可不明。\n\n**提示词正文**：\n\n```\n每写完一场，请输出「第 X 场结束后的连续性状态」，作为下一场的默认起点（除非剧情明确改变）：\n\n时间：时段 / 天气 / 时间推进了多久\n人物（逐个）：位置 / 朝向 / 姿态 / 服装状态 / 身体状态（受伤、湿、脏、疲惫）/ 情绪状态 / 随身道具 / 退场动作\n道具（逐个）：名称 / 归属 / 位置 / 状况\n环境：地点 / 光线状态 / 氛围状态 / 环境变化\n镜头：结束景别 / 机位 / 方向\n转场：继承的元素 / 改变的元素 / 转场意图\n另外记录：观众已经知道什么、角色知道什么、已经揭示了什么、哪些情绪后果要延续。\n```\n"}], "core": {"parts": ["请对我提供的分镜表格和现有提示词进行整体梳理、润色与整合，将每集剧情合并为4～6个连贯的视频分镜提示词，每段时长不少于15秒，使用简体中文输出，可直接复制用于AI视频生成。\n", "【一、分段与剧情整合】\n\n1. 综合读取场次列表、分镜脚本表、生成意图和连续性表，按照剧情因果与动作顺序进行合并。\n2. 每段可以包含多个镜头，围绕一个明确的剧情任务展开，不强制一镜到底。\n3. 优先采用4段，每段不少于15秒；剧情容量确实需要时再采用5～6段。总时长必须与各段时长相符：4段至少60秒，5段至少75秒，6段至少90秒。\n4. 对重复、不合理、衔接生硬或难以生成的镜头，可以调整动作、切镜位置、机位和信息呈现方式，但不改变核心事件结果，不凭空增加人物、能力、证据或重大反转。\n5. 通过必要的动作过程、人物反应、停顿和环境变化自然展开剧情，不用重复对白、重复动作或无意义慢镜头凑时长。\n6. 每段突出一个核心事件，避免同时堆叠多人对白、复杂肢体交互、连续变形和多次换场。\n{{OPT:成人内容}}\n", "【二、角色与场景处理】\n\n角色和场景会在视频生成时直接关联素材，不需要在提示词中展示素材名称、编号、引用语法、绑定关系或素材清单。\n\n人物五官、发型、服装、身材比例及场景静态外观，以生成时关联的素材为准，不重复描述，不自行重新设计。\n\n角色名称仅用于明确动作主体、对白归属和人物关系。场景只补充理解当前事件所必需的空间关系、进出方向及动态变化，不重复整套场景设定。\n", "【三、统一视觉风格】\n\n{{STYLE}}", "【四、动作、表情与镜头表达】\n\n每段按照以下顺序组织：\n起始状态 → 触发事件 → 主要动作 → 人物反应 → 事件结果与结束状态。\n\n具体要求：\n1. 写清谁对谁做了什么，人物的相对位置、动作方向、接触关系及结果，避免多个“他、她”造成指代混乱。\n2. 情绪由事件触发，通过视线、呼吸、姿态、停顿、表情和具体行动表现，不写镜头无法呈现的心理解释。\n3. 复杂动作保留必要的准备、发力、接触和收束过程，不把多个动作同时挤在一个瞬间。\n4. 明确景别、机位、主要运镜及切镜对象。运镜写清跟随谁、如何移动、停在哪里，避免无动机环绕、频繁变焦和过度晃动。\n5. 将原表“生成意图”中的有效信息融入画面，不把制作说明、修改意见或分析文字写进生成提示词。\n6. 段尾交代下一段需要继承的人物位置、姿态、道具归属和动作进度，无需刻意静止定格。\n", "【五、分镜衔接】\n\n1. 已经完成的动作不得在下一段重新开始，尚未发生的剧情不得提前出现。\n2. 区分切换观察角度与人物实际移动，不能因为切镜就让人物重新入场或改变站位。\n3. 保持人物状态、服装、道具归属、运动方向和光线逻辑一致；发生变化时必须有明确的剧情过程。\n4. 合理换场可以直接切镜，不强行保持全片空间连续。\n5. 每段补足理解当前动作所需的信息，不使用“同上”“接上段”等含糊表达。\n6. 全部通过文字描述衔接，不制作或依赖首尾帧、关键帧图、宫格图和分镜图。\n", "【六、对白、声音与时间】\n\n1. 保留必要对白，明确说话人及先后顺序。允许精简重复表达，但不改变关键含义、人物语气和信息释放顺序。\n2. 区分现场对白、内心独白OS和画外音VO，不让角色为OS或VO做说话口型。\n3. 对白长度与时间匹配，给动作、反应和停顿留出空间，不强行加速朗读。\n4. 原表没有对白的地方，不为了填满时长增加解释性台词。\n5. 默认不添加字幕和背景音乐，保留剧情需要的对白、环境声与动作音效。\n6. 每段使用从0秒开始、连续且不重叠的时间区间，合理分配动作、切镜和对白时间。时间标注用于表达先后与节奏。\n", "【七、输出格式】\n\n直接依次输出4～6段提示词，不附角色设定、场景设定、素材清单、分析过程或评分。\n\n第X段｜时长XX秒｜对应原镜头X—X\n\n视频提示词：\n按照“0—X秒、X—X秒……”组织连续画面，写清动作、表情、镜头、必要的光影变化和声音，最后明确结束状态。\n\n每段正文必须能够独立复制使用。时长设置放在标题中，不把操作说明混入正文。\n\n全部输出前自行检查：\n分段数量与时长正确；剧情推进清楚；没有重复动作、遗漏关键情节或提前揭示信息；人物、道具和空间状态连续；对白与动作能够在时间预算内完 async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text) }
  catch(e){ const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove() }

function zipCrc(bytes){let c=-1;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^-1)>>>0}
function makeZip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let offset=0;
  const u16=n=>new Uint8Array([n&255,n>>>8&255]), u32=n=>new Uint8Array([n&255,n>>>8&255,n>>>16&255,n>>>24&255]);
  for(const f of files){const name=enc.encode(f.name),data=enc.encode((/\.json$/i.test(f.name)?"":"\uFEFF")+f.text),crc=zipCrc(data),head=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...name]);parts.push(head,data);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...name]));offset+=head.length+data.length}
  const csize=central.reduce((n,x)=>n+x.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csize),...u32(offset),...u16(0)]);return new Blob([...parts,...central,end],{type:'application/zip'});
}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function firstCode(md){const m=md.match(/```[^\n]*\n([\s\S]*?)\n```/);return m?m[1]:''}
function usage(md){const m=md.match(/\*\*用法\*\*[:：]\s*([^\n]+)/);return m?m[1].replace(/[*`]/g,''):''}
function licClass(l){return l.startsWith('内部')?'int':l.includes('仅参考')?'ref':''}
function tagsHtml(e, full){
  const t=[];
  if(e.status) t.push(`<span class="tag prod">${esc(full?e.status:(e.status.includes('已用于生产')?'已用于生产':e.status.slice(0,10)))}</span>`);
  t.push(`<span class="tag ${licClass(e.license)}">${esc(e.license)}</span>`);
  if(e.patches) t.push(`<span class="tag patch">补 6.0【${e.patches.join('】【')}】</span>`);
  if(e.tool) t.push(`<span class="tag tool">适用 ${esc(e.tool)}</span>`);

}
function renderMd(md){
  let html;
  if(window.marked){ html = marked.parse(md, {gfm:true, breaks:false}) }
  else { html = '<pre style="white-space:pre-wrap">'+esc(md)+'</pre>' }
  const box=document.createElement('div');box.innerHTML=html;
  box.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener'});
  box.querySelectorAll('pre').forEach(pre=>{
    const code=pre.textContent;
    const w=document.createElement('div');w.className='code';
    w.innerHTML=`<div class="bar">${ico('copy').replace('<svg','<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"')}提示词正文 · ${code.length} 字<span class="sp"></span><button class="copy">${ico('copy')}复制</button></div><pre></pre>`;
    w.querySelector('pre').textContent=code;
    w.querySelector('.copy').onclick=e=>copyText(code,e.currentTarget);
    pre.replaceWith(w);
  });
  return box;
}

  ['hero','主角','身分、年龄、弱点'],['rival','对手','动机与手段'],['world','场景与世界观','故事发生在哪里']];

  auto: {tab:'氛围写作', step:'你的故事', btn:'资产库生成', sub:'产生影片内的生动角色与故事场景'},
