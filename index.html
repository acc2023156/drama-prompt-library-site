<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天玑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#101010; --bg-2:#161618; --panel:#1b1b1f; --panel-2:#222227;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#f8fafc; --text-2:rgba(255,255,255,.72); --text-3:rgba(255,255,255,.46);
  --brand:#731dfb; --brand-2:#8b45ff; --brand-soft:rgba(115,29,251,.16);
  --yellow:#ffe000; --green:#3ddc97; --amber:#f5b94a; --red:#ff5d6c;
  --glass:linear-gradient(-17deg,rgba(214,225,255,.06),rgba(214,225,255,.11));
  --r:12px; --r-lg:18px;
  --font:Inter,"Noto Sans SC",-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
a.cta,a.btn-white,a.btn-dark{text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
::selection{background:var(--brand);color:#fff}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:14px;padding:0 18px 0 22px;background:rgba(13,13,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb-logo{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px 0 8px;margin-right:4px;border-radius:12px;flex:none;text-decoration:none}
.tb-logo:hover{background:rgba(255,255,255,.06)}
.tb-logo.on{background:#2a2a2e}
.tb-logo svg{width:32px;height:32px}
.tb-name{font-size:15px;font-weight:600;color:#fff;white-space:nowrap}
.tb-seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:#141416;border:1px solid var(--line)}
.tb-seg a{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;text-decoration:none;color:var(--text-2);font-size:15px;font-weight:500;white-space:nowrap}
.tb-seg a:hover{color:#fff}
.tb-seg a.on{background:#2a2a2e;color:#fff}
.tb-seg svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb-stat{font-size:14px;color:var(--text-2);white-space:nowrap}
.account{position:relative;margin-left:auto;flex:none}
.account-trigger{height:42px;display:flex;align-items:center;gap:9px;padding:0 7px 0 12px;border-radius:12px;background:#1d1d20;border:1px solid var(--line);color:#fff;font-weight:700}
.account-trigger:hover,.account-trigger[aria-expanded="true"]{background:#29292d;border-color:var(--line-2)}
.account-trigger .spark{width:17px;height:17px;fill:#fff}
.account-avatar{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#ead9cd,#bba79b);color:#b4004e;font-size:17px;font-weight:900;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.account-panel{position:absolute;top:50px;right:0;width:390px;padding:22px 20px 16px;border-radius:20px;background:#242424;border:1px solid var(--line-2);box-shadow:0 24px 70px rgba(0,0,0,.65);opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transform-origin:top right;transition:.16s ease;z-index:20}
.account.open .account-panel{opacity:1;visibility:visible;transform:none}
.account-head{display:flex;align-items:center;gap:14px;margin:0 6px 30px}
.account-head .account-avatar{width:58px;height:58px;font-size:28px}
.account-name{font-size:20px;font-weight:700;line-height:1.35}.account-tier{color:var(--text-2);font-size:15px}
.account-label{margin:0 6px 10px;color:var(--text-2);font-size:14px}
.space-card{display:flex;align-items:center;gap:14px;padding:12px 6px 18px;width:100%;text-align:left}
.space-icon{width:54px;height:54px;display:grid;place-items:center;border-radius:13px;background:#4f86f7;color:#fff;font-size:25px;font-weight:800}
.space-copy{flex:1}.space-copy b{display:block;font-size:17px}.space-copy span{color:var(--text-3);font-size:14px}.space-arrow{font-size:29px;color:var(--text-3);font-weight:300}
.points-card{padding:16px 16px 14px;margin-bottom:14px;border-radius:14px;background:#303030}
.points-balance{font-size:16px;font-weight:700;margin-bottom:13px}.points-row{display:flex;align-items:center;gap:12px}.points-row span{flex:1;color:var(--text-2);font-size:13px}.upgrade{height:38px;padding:0 14px;border-radius:9px;background:#fff;color:#222;font-weight:600}.upgrade:hover{background:#ececec}
.account-menu{display:grid}.account-link{display:flex;align-items:center;gap:13px;height:50px;padding:0 8px;border-radius:10px;text-decoration:none;color:#f4f4f4;font-size:15px;text-align:left}.account-link:hover{background:rgba(255,255,255,.06)}.account-link svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.membership-page{position:fixed;inset:0;z-index:40;overflow:auto;background:#131417;color:#fff;padding:22px 30px 70px}.membership-close{position:fixed;top:18px;right:22px;z-index:42;width:56px;height:56px;border-radius:50%;background:#242426;border:1px solid var(--line-2);font-size:32px;font-weight:200}.membership-inner{max-width:1480px;margin:auto}.membership-title{text-align:center;font-size:28px;margin:0 70px 34px}.billing-row{display:flex;align-items:center;justify-content:center;gap:56px;margin-bottom:34px}.billing-tabs{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:4px;border-radius:28px;background:#1d1e22}.billing-tabs button{height:46px;border-radius:24px}.billing-tabs button.on{background:#303136}.billing-tabs small{color:#8e95a5;margin-left:5px}.billing-tabs .hot small{color:#00a8ff}.billing-links{display:flex;gap:12px;white-space:nowrap}.billing-links button.on{border:1px solid #777;border-radius:24px;padding:9px 18px}.plans{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:18px}.plan{display:flex;flex-direction:column;min-height:560px;border-radius:28px;background:#242424;border:1px solid transparent;overflow:hidden}.plan.pro{background:#0d182a;border-color:#0797ff}.plan.max{background:#1d1715;border-color:#ff6a00}.plan-ribbon{height:46px;display:grid;place-items:center;background:#0797f4;font-size:13px}.plan.max .plan-ribbon{background:#ff6900}.plan-body{display:flex;flex:1;flex-direction:column;padding:30px}.plan h2{font-size:19px;margin:0 0 12px}.plan-price{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}.plan-price b{font-size:46px;line-height:1}.plan-price s{color:#9297a2}.plan-note{min-height:58px;color:#aeb4c0;font-size:13px}.plan-points{margin-top:auto;padding:16px 18px;border-radius:15px;background:rgba(255,255,255,.055)}.plan-points b{display:block}.plan-points span{color:#9ca4b2;font-size:12px}.buy-plan{height:52px;margin:20px 0;border-radius:26px;background:#fff;color:#171717}.plan.pro .buy-plan{background:#0797f4;color:#fff}.plan.max .buy-plan{background:#ff6900;color:#fff}.plan-benefits{display:grid;gap:13px;font-size:14px}.plan-benefits span::before{content:'✓';margin-right:10px}.plan-extra{margin:22px -30px -30px;padding:20px 30px;background:rgba(255,255,255,.025)}.compare{margin-top:46px}.compare h2{text-align:center;font-size:27px}.compare-scroll{overflow-x:auto}.compare-grid{min-width:900px}.compare-head,.compare-row{display:grid;grid-template-columns:1.25fr repeat(5,1fr);align-items:center}.compare-head{position:sticky;top:-22px;z-index:2;background:#131417;padding:12px 0}.compare-plan strong{display:block;font-size:30px;margin:7px 0}.compare-plan button{width:80%;height:42px;border-radius:23px;background:#f5f5f5;color:#191919}.compare-section{margin-top:30px;padding:20px 24px;border-radius:15px;background:#1e1f23;font-size:17px}.compare-row{min-height:82px;border-bottom:1px solid var(--line);padding:0 24px}.compare-row>span:not(:first-child){text-align:center}.compare-row .yes{font-size:22px}.membership-foot{text-align:center;color:#8f96a5;margin-top:48px}
.soon{max-width:560px;margin:90px auto 0;text-align:center}
.soon .big{width:88px;height:88px;margin:0 auto 22px;border-radius:24px;background:#1d1d20;border:1px solid var(--line-2);display:grid;place-items:center}
.soon .big svg{width:42px;height:42px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.soon h1{font-family:"Noto Sans SC",var(--font);font-weight:900;font-size:30px;margin:0 0 10px}
.soon p{color:var(--text-2);margin:0 0 24px}

/* ---------- shell: rail + collapsible panel + main ---------- */
.shell{display:flex;min-height:calc(100vh - 60px)}

.pside{position:sticky;top:60px;height:calc(100vh - 60px);width:264px;flex:none;overflow:auto;scrollbar-width:none;border-right:1px solid var(--line);background:#111113;padding:16px 12px 24px;transition:width .2s,padding .2s}
body.ps-off .pside{width:0;padding:0;border-right:0;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 16px;border-radius:12px;background:#1d1d20;border:1px solid var(--line);color:#e9e9ee;font-size:15px;white-space:nowrap}
.pill:hover{background:#26262a}
.pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.ps-float{position:absolute;top:24px;left:26px;z-index:4;display:none;align-items:center;gap:8px}
body.ps-off .ps-float{display:flex}
.ps-row{display:flex;align-items:center;gap:8px}
.pro{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 10px 0 12px;border-radius:12px;background:#1d1d20;border:1px solid var(--line);color:var(--text-2);font:800 13px/1 Inter,var(--font);letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.pro:hover{background:#26262a}
.pro .sw{width:34px;height:20px}
.pro .sw::after{width:14px;height:14px}
.pro .sw.on::after{transform:translateX(14px)}
.pro.on{color:#fff}
.pro.on b{background:linear-gradient(90deg,#b98bff,#3fb6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pro em{font-style:normal;font-weight:500;font-size:12px;color:var(--text-3)}
.ps-title{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;color:var(--text-3);padding:18px 10px 6px}
.ps-title svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pside a{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:9px;text-decoration:none;color:var(--text-2);font-size:13.5px;line-height:1.45}
.pside a:hover{background:rgba(255,255,255,.05);color:#fff}
.pside a.on{background:#232326;color:#fff}
.pside a .i{flex:none;min-width:30px;font:600 12px Inter,monospace;color:var(--text-3)}
.pside a .n{margin-left:auto;font-size:11px;color:var(--text-3)}
.pside a.head{color:#fff;font-weight:600;font-size:14px}
.pside::-webkit-scrollbar{display:none}
.pside a.fn{align-items:center}
.pside a svg{flex:none;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;align-self:center}
.pside a.sub{padding-left:37px}
.pside a .d{display:block;font-size:12px;color:var(--text-3);margin-top:1px}
.pside .ptag{margin-left:auto;flex:none;align-self:center;padding:2px 7px;border-radius:6px;background:var(--brand);color:#fff;font:800 10px/1.4 Inter,var(--font);letter-spacing:.04em}
.pside .ps-hr{height:1px;background:var(--line);margin:14px 6px 4px}

main{position:relative;flex:1;min-width:0;background-color:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:22px 22px}
body.ps-off main .wrap{padding-top:56px}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px 80px}
.hero{position:relative;overflow:hidden;padding:64px 0 34px;text-align:center;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-40% -10% 0;z-index:-1;
  background:radial-gradient(closest-side at 50% 55%,rgba(170,20,40,.35),transparent 70%),radial-gradient(closest-side at 70% 30%,rgba(115,29,251,.22),transparent 70%)}
.hero .rings{position:absolute;left:50%;top:52%;width:640px;height:640px;transform:translate(-50%,-50%);z-index:-1;opacity:.35}
.hero h1{margin:0 auto;font-family:"Noto Sans SC",var(--font);font-weight:900;font-size:clamp(30px,5vw,52px);line-height:1.15;letter-spacing:.02em;
  background:linear-gradient(90deg,#aeb4be 0%,#f2f4f7 28%,#fff 50%,#f2f4f7 72%,#aeb4be 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--text-2);margin:14px auto 0;max-width:560px}

.composer{margin:28px auto 0;max-width:760px;text-align:left;border-radius:var(--r-lg);border:1px solid var(--line-2);background:rgba(22,22,26,.82);backdrop-filter:blur(12px);padding:14px 16px 14px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.composer .top{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.08em;color:var(--text-3);text-transform:uppercase}
.search{display:flex;align-items:center;gap:10px;margin:10px 0 12px}
.search svg{width:18px;height:18px;stroke:var(--text-3);fill:none;stroke-width:2}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:15px var(--font)}
.search input::placeholder{color:var(--text-3)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--glass);gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{height:30px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap}
.seg button.on{background:#fff;color:#111214}
.chip-btn{height:36px;padding:0 14px;border-radius:999px;background:var(--glass);color:var(--text-2);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip-btn.on{color:#fff;box-shadow:inset 0 0 0 1px var(--brand-2);background:var(--brand-soft)}
.chip-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

.sec-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:44px 0 16px}
.sec-head h2{margin:0;font-family:"Noto Sans SC",var(--font);font-weight:900;font-size:26px}
.sec-head .meta{color:var(--text-3);font-size:13px}
.sec-head .sp{flex:1}
.btn-white{height:40px;padding:0 16px;border-radius:10px;background:#fff;color:#111;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.btn-dark{height:40px;padding:0 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:#fff;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.btn-white svg,.btn-dark svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:168px;padding:16px;border-radius:var(--r-lg);background:linear-gradient(180deg,#1c1c20,#151517);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.card:hover{border-color:rgba(139,69,255,.6);transform:translateY(-2px)}
.card .id{font:600 12px/1 Inter,monospace;color:var(--text-3)}
.card h3{margin:0;font-size:15px;font-weight:700;line-height:1.45}
.card .desc{color:var(--text-3);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.card .tl{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--text-2);white-space:nowrap}
.tag.prod{background:var(--yellow);color:#111}
.tag.ref{background:rgba(245,185,74,.14);color:var(--amber)}
.tag.int{background:var(--brand-soft);color:#c9a8ff}
.tag.patch{background:rgba(61,220,151,.12);color:var(--green)}
.tag.tool{background:rgba(255,255,255,.05);color:var(--text-3)}
.empty{padding:60px 0;text-align:center;color:var(--text-3)}

/* ---------- detail ---------- */
.detail{max-width:860px;margin:0 auto;padding:36px 0 0}
.crumb{display:flex;gap:8px;align-items:center;color:var(--text-3);font-size:13px;margin-bottom:18px;flex-wrap:wrap}
.crumb a{text-decoration:none}.crumb a:hover{color:#fff}
.detail h1{font-family:"Noto Sans SC",var(--font);font-weight:900;font-size:clamp(24px,3.4vw,34px);line-height:1.3;margin:0 0 12px}
.detail .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.md{color:var(--text-2);font-size:14.5px;line-height:1.8}
.md strong{color:#fff}
.md h2,.md h3,.md h4{color:#fff;margin:28px 0 10px}
.md a{color:#c9a8ff}
.md blockquote{margin:14px 0;padding:12px 16px;border-radius:var(--r);background:var(--brand-soft);border:1px solid rgba(139,69,255,.35);color:#e6dbff}
.md blockquote p{margin:0}
.md table{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:var(--panel);color:#fff}
.md code{font-family:ui-monospace,Consolas,monospace;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px;font-size:.92em}
.code{position:relative;margin:16px 0;border-radius:var(--r-lg);border:1px solid var(--line-2);background:#0b0b0d;overflow:hidden}
.code .bar{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-3)}
.code .bar .sp{flex:1}
.code pre{margin:0;padding:16px;max-height:520px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:13px/1.75 "Noto Sans SC",ui-monospace,Consolas,monospace;color:#e9e9ee}
.copy{height:30px;padding:0 12px;border-radius:8px;background:var(--brand);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.copy:hover{background:var(--brand-2)}
.copy.done{background:var(--green);color:#062}
.copy svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2}
.pager{display:flex;gap:12px;margin-top:40px}
.pager a{flex:1;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);text-decoration:none;background:var(--bg-2)}
.pager a:hover{border-color:var(--brand-2)}
.pager small{display:block;color:var(--text-3);font-size:12px}
.pager .r{text-align:right}

/* ---------- assembler ---------- */
.asm{display:grid;grid-template-columns:330px 1fr;gap:18px;margin-top:8px;align-items:start}
.panel{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--bg-2);padding:16px}
.panel h4{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.panel + .panel{margin-top:14px}
.toggle{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle .t{flex:1}
.toggle .t b{display:block;font-size:13.5px}
.toggle .t span{font-size:12px;color:var(--text-3)}
.sw{position:relative;width:38px;height:22px;flex:none;border-radius:99px;background:rgba(255,255,255,.14);transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--brand)}
.sw.on::after{transform:translateX(16px)}
.warn{margin-top:8px;font-size:12px;color:var(--amber)}
textarea.style{width:100%;min-height:150px;margin-top:10px;resize:vertical;border-radius:10px;border:1px solid var(--line);background:#0b0b0d;color:var(--text);padding:10px;font:12.5px/1.7 var(--font)}
.plist a{display:flex;gap:8px;padding:6px 0;text-decoration:none;font-size:13px;color:var(--text-2);border-top:1px dashed var(--line)}
.plist a:hover{color:#fff}
.plist .s{flex:none;width:28px;color:var(--green);font-weight:700}
.stat{display:flex;gap:18px;font-size:12px;color:var(--text-3);margin-bottom:10px}
.stat b{color:#fff;font-size:14px}

<script>
const DATA = {"groups": [{"key": "01-outline", "label": "一、立项与大纲"}, {"key": "02-adaptation", "label": "二、小说转剧本"}, {"key": "03-revision/dialogue", "label": "三、精修 · 对白与台词"}, {"key": "03-revision/de-ai", "label": "三、精修 · 去 AI 味 / 反套路"}, {"key": "03-revision/trim", "label": "三、精修 · 删减"}, {"key": "03-revision/review", "label": "三、精修 · 审核与检查"}, {"key": "03-revision/shootability", "label": "三、精修 · 可拍性 / OS·VO"}, {"key": "03-revision/craft", "label": "三、精修 · 其他手法"}, {"key": "06-video/core", "label": "六、视频 · 6.0 主模板（生产在用）"}, {"key": "06-video/patches", "label": "六、视频 · 6.0 补丁（标明补哪一部分）"}, {"key": "06-video/styles", "label": "六、视频 · 画风块"}, {"key": "06-video/reference", "label": "六、视频 · 参考与示例"}, {"key": "07-compliance", "label": "七、合规"}, {"key": "archive/04-storyboard", "label": "归档 · 四、分镜（10/30 实测后基本不用）"}, {"key": "archive/05-design", "label": "归档 · 五、角色与场景设定（已由画布素材替代）"}], "entries": [{"id": "1.12", "title": "小说 / 故事文本初筛打分（市场潜力 · 创新属性 · 内容亮点）", "chapter": "一、立项与大纲", "license": "外部·可直接用", "folder": "01-outline", "path": "01-outline/1.12-小说-故事文本初筛打分.md", "body": "\n**用法**：收到一批小说、故事梗概或样章，要先判断值不值得改编时用。它只根据你给的文本打分，不上网查热度和作者名气，适合匿名稿件初筛。评分从严：大多数“完整、流畅但没有明显亮点”的稿子应该落在 7.5~7.9 分，8.0 以上必须论证充分。可以配合 1.10（爽点公式）一起用：先用这条筛掉没竞争力的，再用 1.10 设计爽点。\n\n**来源**：[VanGong1999/screen-creative-skills](https://github.com/VanGong1999/screen-creative-skills) category/novel-screening/novel-evaluator（SKILL.md 与 references/guide.md），MIT（收集页面第 60 条，11/10 深挖）。摘编：原文按“中国影视市场”写，这里改成通用的短剧口径；题材判断仍按成人线标准，红线见 7.1。\n\n**提示词正文**：\n\n```\n请只根据我提供的故事文本做初筛打分。不检索网络，不引用文本外的热度、销量、作者名气；不编造文本里没有的情节或市场数据。\n\n【评分维度】\n一、市场潜力（从文本推断）\n- 受众适合度：是否贴合这类题材的目标受众，能不能吸引他们；\n- 讨论热度：能否引起共鸣，是否和当下的热点话题挂钩；\n- 稀缺性：和同类故事比，有没有独特之处；\n- 播放前景（推断）：这类题材改编后大概能有什么表现。\n二、创新属性\n- 核心选点：最核心的故事选点是否新鲜、有不可替代性；\n- 故事概念：一句话能不能说清，是否突出鲜明；\n- 故事设计：人物、世界观、情节、节奏、叙事等方面最突出的设计是否有独创性。\n三、内容亮点\n- 主题立意：是否清晰、能引起共鸣；\n- 故事情境：主要情境是否有张力、让人想追下去；\n- 人物设定：主要人物是否新颖、让人印象深刻；\n- 人物关系：是否鲜明、有戏剧张力；\n- 情节桥段：桥段是否好看，节奏是否张弛有度。\n\n【评分标准】\n- 8.5 以上：优秀，改编基础很强，可以直接跟进（从严，只有少数能到）；\n- 8.0~8.4：良好，有竞争力，需要局部修改；\n- 7.5~7.9：合格，中规中矩，需要较大修改；\n- 7.4 以下：较差，不建议推进。\n评分规则：分数细化到小数点后一位；8.0 以上必须论证充分；拿不准“良好还是合格”时判合格；没有明显亮点的，哪怕情节紧凑、故事完整，也只给合格区间——大量同类稿件都集中在 7.5~7.9。\n\n【步骤】\n1. 通读文本，形成独立理解，不引入外部设定；\n2. 逐项分析打分，每项附简短依据（引用具体情节，不空泛夸赞）；\n3. 给出总评、总分和跟进建议：通过 / 改后复评 / 淘汰。\n\n【输出格式】\n【市场潜力】受众适合度 / 讨论热度 / 稀缺性 / 播放前景：分析 + 评分 X.X\n【创新属性】核心选点 / 故事概念 / 故事设计：分析 + 评分 X.X\n【内容亮点】主题立意 / 故事情境 / 人物设定 / 人物关系 / 情节桥段：分析 + 评分 X.X\n【总体评价】……总评分 X.X\n【跟进建议】……\n【信息边界】本评估只基于提供的文本，没有使用网络数据。\n```\n"}, {"id": "1.1", "title": "灵感到成稿五步工作流", "chapter": "一、立项与大纲", "license": "外部·可直接用", "folder": "01-outline", "path": "01-outline/1.1-灵感到成稿五步工作流.md", "body": "\n**用法**：把下面整段发给 AI，再发灵感或小说素材。AI 会按顺序推进：脑洞补充 → 3000 字大纲 → 分集大纲 → 单集初稿 → 精修。每一步你确认后再进入下一步。1.0 是「小说直接转剧本」，这条适合从零原创，或者动笔前先搭好大纲。\n\n**来源**：[Coconah/AI-Short-Drama-Agent-Skill](https://github.com/Coconah/AI-Short-Drama-Agent-Skill)，MIT。已去掉原文 emoji，其余照录。\n\n**提示词正文**：\n\n```\n# 爆款短剧 AI 编剧：万能工作流\n\n作为短剧编剧，当你接到“写短剧”“根据灵感写剧本”等任务时，请严格按照以下五个阶段依次执行。你必须按顺序推进，并在同一上下文中保持背景的连贯性。\n\n## Step 0：项目启动与脑洞重构（定基调）\n触发条件：收到用户提供的碎片化灵感、概念或原始素材。\n你的身份：思维活跃、极具爆款经验的资深策划。\n执行动作：深入分析用户的碎片化信息，发挥剧作想象力，进行【情节发散与内容走向补充】，最后输出一份《需求梳理与脑洞补充延展文档》。\n输出要求：\n1. 核心需求与基调提炼：精准提取剧名、平台定位、人物已知身世特征、基础关系。严禁擅自推翻用户前期提供的硬性设定（如第几幕发生什么或集数规则）。\n2. 情节发散与细节补建：补充欠缺的故事桥段。设计最具屈辱或冲突感的开场“钩子”；推演全剧反转最高潮的设定；增补必要的僚机或绿茶反派等角色。\n3. 关键走向二选一：基于上述构思，向用户提出 1-3 个需要拍板决定的核心剧情问题（例如：结局侧重爽感还是情感救赎等）。\n风格限定：保持严谨、专业的客观分析口吻，向用户冷静陈述剧情推演构思，避免使用轻浮词汇。\n\n## Step 1：升级电影级故事大纲（搭骨架）\n触发条件：Step 0 的方向已得到用户确认。\n你的身份：身价百万、手握多部爆款的主编剧。\n执行动作：将前期确认的设定升华为 3000 字以上具备【核爆级情绪张力】和【严密逻辑闭环】的全局故事大纲。\n输出要求：\n1. 全剧底层剧作逻辑：剖析核心对抗的本质、人物心理行为动机以及结局的情感美学价值。\n2. 经典四幕结构与钩子链：\n   - 第一幕（建置）：设计 10 秒内头皮发麻的强力冲突，推演破冰逻辑点。\n   - 第二幕（对抗）：设计 3-5 个“单元式矛盾”，每个单元独立起承转合，明确情感升温点。\n   - 第三幕（危机）：设计核弹级反转点，让主角彻底陷入绝境。\n   - 第四幕（结局）：抓人的高潮场面，写出宏大且极致的情感释放。\n3. 人物弧光轨迹：拆解男女主从开端到结局的“性格蜕变曲线”。\n4. 核心隐喻：列举贯穿全剧的 1-2 个核心隐喻物件或暗线。\n注意：不要写成流水账，必须使用具文学性和画面感的短句。\n\n## Step 2：拆解可执行分集剧情规划（切猪肉）\n触发条件：全局故事大纲已确认，要落实到具体集数。\n你的身份：主抓执行的短剧主笔。\n执行动作：以大纲为约束，将故事精细拆解落实为每集的详尽单集大纲（例如一次拆解前 5 集）。\n单集大纲要求：\n1. 核心动作目标：一句话精要说清该集核心冲突。\n2. 场景连贯铺排：包含本集场景数量估算及对应的地点、事件梗概。\n3. 精准情绪走势：用流变词描绘（如：遭受白眼 → 独自隐忍 → 绝境反击）。\n4. 强力悬念钩子（结尾）：每集末尾强制设置勾人的极致转折，甚至具体到“黑屏出粗体字”的文案。\n5. 草蛇灰线：点明本集为后文偷偷埋下的伏笔。\n\n## Step 3：单集极速出本初稿（填血肉）\n触发条件：分集大纲规划完成。\n你的身份：极懂短剧痛点、下笔狠辣的节奏大师。\n执行动作：基于分集大纲，直接生成对应集数的【完整分镜拍摄脚本初稿】。\n剧本格式排版铁律：\nSCENE [序号].[地点]/[子地点]-[时段]（[时间标记]）\n【环境音效/氛围描写/人物着装等调度】\n角色名（情绪/动作细节指导词）：台词正文...\n△ [镜头类型]：[画面呈现描述]\n核心质感：\n1. 微表情直击：动作精细到应激反应（如“死死咬住下唇”），拒绝抽象描写（如“她很害怕”）。\n2. 生动台词提示：人物开口前必须带有情绪语气限定词（如“嗓音嘶哑”）。\n3. 凶残视听运镜：在角色崩溃、冲突节点，强制加入跟拍、面部特写等攻击性视觉描写。\n4. 充足的篇幅拉扯：详尽展示人物一进一退的极限推拉，严禁一笔带过的糊弄。\n\n## Step 4：剧本医生暴改精修（除冗余）\n触发条件：需要对单集初稿进行审阅润色，增强网感与张力。\n你的身份：目光毒辣、吹毛求疵的终审剧本医生。\n执行动作：摒弃废话与机器感，外科手术般精修，直至台词“足够狠”。\n爆改阵地：\n1. 网感降维打击：斩杀过于文绉绉和啰嗦的对白，台词必须短、平、快，加重反派阴暗感与主角反击爽感。\n2. 抹杀 OOC：严格遵循人物身份阶层，该讲黑话、糙话的绝不书面表达。\n3. 视听张力拉满：大幅强化环境对抗描写及结尾悬念黑屏的冲击力。\n输出约束：直接输出最终版本被精修的【全新剧本正文】即可，不必罗列“修改清单”，且文本厚度不低于原稿。\n\n进阶循环：当某单集完成 Step 4 后，主动向用户确认是否继续推进下一集（回到 Step 2/3），依次循环，直至剧本完全杀青。\n```\n"}, {"id": "1.2", "title": "黄金前 3 秒开篇钩子（六母型）", "chapter": "一、立项与大纲", "license": "外部·可直接用", "folder": "01-outline", "path": "01-outline/1.2-黄金前-3-秒开篇钩子.md", "body": "\n**用法**：写第 1 集或每集开头前，把这段发给 AI，让它先选定一种钩子母型再动笔。也可以用来审开头：「这一集前 3 秒属于哪种母型？够不够狠？」\n\n**来源**：[short-drama-factory](https://github.com/lixiaoxiao9888-create/short-drama-factory) references/golden-3s-hook-library.md，MIT（收集人提供）。摘编：保留六种母型和代表性变体，删去了剧名举例。\n\n**提示词正文**：\n\n```\n写本集开头前，先从下面六种“黄金前3秒”钩子母型里选一种，并说明选择理由；开场 3 秒内必须见冲突、见危机或见反差强动作，15 秒内必须用大白话挑明具体死线或赌注。\n\n1. 生死绝境 / 物理威胁型：开场直接把主角推向生死边缘。\n   例：急救室红灯狂闪，医生推门：“病危通知书，家属签字，还差最后十分钟”；大雨中主角被按在悬崖边，反派一脚踩在他手指上。\n2. 极端羞辱 / 地位反差型：反派践踏主角尊严，拉满观众的憋屈。\n   注意：肢体冲突型羞辱（扇耳光、泼茶、胯下之辱）政策风险升高，优先用生活化羞辱。\n   例：相亲被嫌“没房没退休金还是个瘸子”；被导师当众骂“你唱的是在侮辱音乐”；受过主角大恩的人反手把热汤泼在主角脸上骂“吃白食”（账本清算式：主角不辩解，后续逐集清算恩情账）。\n3. 身份暴跌 / 狂飙暴涨型：前一秒极度卑微、后一秒顶级势力跪拜；或前一秒高高在上、下一秒被当众剥夺一切。\n   例：总裁当众开除保洁，保洁摘下手套亮出集团 51% 股权印章；谈判桌上对方当众撕毁百亿合同转签宿敌；双向马甲（男女主各藏一个身份，E1 就揭破，钩子变成“知道底细后还敢不敢选”）。\n4. 物证背叛 / 捉奸现场型：亲眼目睹最信任的人背叛。\n   例：妻子生日推门，看见丈夫把自己母亲的传家玉镯戴在闺蜜手上；亲子鉴定显示 0.01%。\n5. 反常理惊悚 / 规则悬念型：抛出违背常理的规则或现象。\n   例：“这个家里，除了我，所有人都在装死”；手机收到 10 年后的短信“今晚 8 点，千万不要给你妻子开门”；视觉异变：半夜监控墙全部亮起，每块屏幕里都是同一个人站在她身后。\n6. 萌系治愈反差型：极小极弱的主体 vs 极大极严肃的对象。\n   例：小奶娃一个喷嚏震飞前来挑衅的神兽；2 岁萌娃一句童言让抑郁三年的老爸红了眼眶。\n\n开篇禁令：严禁“早晨起床拉窗帘”；严禁“汽车在公路上行驶超过 2 秒”；严禁“大段旁白交代时代背景”；严禁“角色坐在咖啡厅无意义闲聊倒水”。\n```\n"}, {"id": "1.10", "title": "爽点公式：消极情绪 × 烈度放大 × 信息差打脸", "chapter": "一、立项与大纲", "license": "外部·可直接用", "folder": "01-outline", "path": "01-outline/1.10-爽点公式.md", "body": "\n**用法**：立项、写分集大纲时，用这条设计每一个爽点：先找观众最有共鸣的委屈，再按五种手法把委屈放大到合适的烈度，最后用信息差安排打脸的时机。后半部分是常见主题（离婚、赘婿、战王、神医、重生等）的情绪曲线，选题时可以直接对照。和 1.3、1.4 的区别：那两条管节奏和断章，这条管“爽”从哪里来。\n\n**来源**：[oiuv/ai-short-drama](https://github.com/oiuv/ai-short-drama) skills/drama-script/references/satisfaction-model.md、theme-patterns.md，MIT（11/07 整理人新增到收集页面）。摘编：主题部分只保留情绪曲线，删去了经典套路的举例句。\n\n**提示词正文**：\n\n```\n请按“爽感 = 消极情绪 × 烈度放大 × 信息差打脸”设计（或检查）下面这部剧的爽点。\n\n【第一步：找消极情绪】选最能引发大众共鸣的一种，越普遍越好：\n- 被轻视：能力被质疑、身份被嘲笑；\n- 被背叛：伴侣出轨、朋友背刺；\n- 被欺负：职场霸凌、家族排挤；\n- 被误解：好心被当成驴肝肺；\n- 被剥夺：利益被抢、成果被窃取。\n\n【第二步：放大烈度】五种手法：\n1. 身份反差：不是被同事看不起，而是被自己带出来的徒弟当众羞辱；\n2. 场合升级：不是私下被骂，而是公司年会上被当众开除；\n3. 利益绑定：被欺负的同时，家人或爱人也受牵连；\n4. 时间累积：忍辱负重十年，今天被当众揭穿；\n5. 落井下石：被打压之后，对方还要斩草除根。\n烈度五级：1 私下被欺负 → 2 当众被羞辱 → 3 重要场合被打压 → 4 家人或爱人受牵连 → 5 生死存亡关头。\n\n【第三步：信息差打脸】观众知道的比角色多，才有期待：\n- 身份信息差：观众知道主角是大人物，反派以为他是废物；\n- 能力信息差：观众知道主角有金手指，反派以为他靠运气；\n- 关系信息差：观众知道主角和大佬有关系，反派以为他没靠山；\n- 未来信息差（重生类）：观众知道主角知道未来，反派以为是巧合。\n打脸时机：即时打脸（小反派、日常冲突，快速爽）；延迟打脸（大反派、高潮，积累期待）；多次打脸（重要反派、多集剧情，持续爽）。\n\n【组合模式】层层递进：小打脸 → 中打脸 → 大打脸 → 终极打脸；连环打脸：反派 A 被打脸 → 反派 B 跳出来 → 再被打脸；追悔莫及：被抛弃 → 主角成功 → 对方后悔 → 求复合 → 被拒绝。\n\n【常见主题的情绪曲线】\n离婚：被嫌弃 → 被羞辱 → 被抛弃 → 身份曝光 → 追悔莫及\n赘婿：被轻视 → 被羞辱 → 家族危机 → 挺身而出 → 身份揭露\n霸总：被看轻 → 契约关系 → 逐渐沦陷 → 身份揭晓 → 宠爱打脸\n战王：隐忍 → 被欺负 → 触及底线 → 爆发 → 降维打击\n金手指：底层挣扎 → 获得能力 → 初试牛刀 → 能力升级 → 碾压\n暴富：穷困潦倒 → 被羞辱 → 突然暴富 → 打脸 → 众星捧月\n神医：被质疑 → 被羞辱 → 危急病人 → 出手救人 → 震惊全场\n家族：被排挤 → 被赶走 → 独立奋斗 → 功成名就 → 归来碾压\n重生：前世惨死 → 重生节点 → 提前布局 → 仇人入套 → 复仇成功\n\n【注意】\n1. 爽点密度要高，不能让观众等太久；\n2. 消极情绪不能持续太长，否则观众会烦；\n3. 打脸力度要和之前的欺负程度匹配，欺负越狠，打脸越狠；\n4. 始终保持观众的上帝视角，不要让观众和主角一起蒙在鼓里。\n\n【输出】逐个爽点列出：消极情绪｜烈度手法和等级｜信息差类型｜打脸时机｜所在集数。\n```\n"}, {"id": "1.4", "title": "集尾断章公式（五大公式 + 五类钩子）", "chapter": "一、立项与大纲", "license": "外部·可直接用", "folder": "01-outline", "path": "01-outline/1.4-集尾断章公式.md", "body": "\n**用法**：写分集大纲时，给每集指定一种断章公式；写完单集后，也可以让 AI 按这个检查结尾够不够「划不动」。\n\n**来源**：五大公式出自 [short-drama-factory](https://github.com/lixiaoxiao9888-create/short-drama-factory) references/cliffhanger-master-formulas.md（MIT，收集人提供），摘编；五类钩子出自 [0xsline/short-drama](https://github.com/0xsline/short-drama) references/hook-design.md（MIT），其中情绪钩、信息钩、危机钩三条的例子是我按定义补写的。\n\n**提示词正文**：\n\n```\n每集结尾必须单列一段【本集断章卡点】，格式：\n【本集断章卡点】：画面停格描述。（黑屏：下滑立即解锁第XX集）\n\n从以下五大断章公式中选一种，相邻几集不要重复：\n1. 身份掉马前一秒：隐藏身份即将被识破的刹那切断。\n   例：反派夺过合同，看到最后一页的印章，瞳孔骤缩：“这印章……怎么会是你？！”（黑屏）\n2. 物理危机绝命悬停：致命危险已爆发，伤害造成前 0.1 秒切断。\n   例：货车车灯直直撞向女主，男主飞身扑出、双手刚够到她衣角的瞬间。（黑屏）\n3. 反差金句霸道落地：全场嘲讽压到极致时，主角一句话震住全场。\n   优先用 5~11 字生活化短句：“赵家门槛太高，我高攀不起。”“你老婆，我老公，还不止一次。”\n4. 生死/利益绝境二选一：两个同样惨烈的代价，倒数读秒。\n   例：“签了认罪书，你身败名裂；不签，你女儿今晚就得死在手术台上！”（黑屏）\n5. 情绪反差落地（治愈系/成年人情感）：用一个克制的动作切黑，靠情感张力而不是悬念。\n   例：老太太办完离婚走出民政局，门口等了她三十年的男人什么也没问，把外套披到她肩上。她低头看了一眼外套，又抬头看他。（黑屏）\n漫剧专用：宝物认主/系统弹窗——主角手指悬在“是否解锁新功能”的按钮上方。（黑屏）\n\n钩子类型参考（可与公式叠用）：\n- 悬念钩：抛出关键疑问，答案留到下一集（身份/结果/选择/来者/发现）。“他缓缓摘下面具——”\n- 反转钩：最后一刻颠覆预期（身份/局势/关系/时间/动机）。“头纱下面的人——不是她。”\n- 情绪钩：把情绪推到最高点然后切断。\n- 信息钩：透露改变全局的信息，但只说一半。“你知道你爸当年为什么……”\n- 危机钩：突然出现重大危机，主角来不及反应。\n设计要点：疑问必须和主线相关；下一集必须回应，可以不完全解答，但要给出新信息。\n```\n"}, {"id": "1.6", "title": "集尾钩子诊断与修复", "chapter": "一、立项与大纲", "license": "外部·可直接用", "folder": "01-outline", "path": "01-outline/1.6-集尾钩子诊断与修复.md", "body": "\n**用法**：某几集的结尾“不想点下一集”时，把这几集（最好连同下一集开头）和这段一起发给 AI，让它先诊断再给最小改动方案。和 1.4 的区别：1.4 是写的时候选公式，这条是写完后找问题、修问题。\n\n**来源**：[艾玛短剧 · 编剧 Skills](https://github.com/adoria111/emma-screenwriting-skills) skills/em-episode-hooks，MIT（收集页面）。摘编。\n\n**提示词正文**：\n\n```\n请诊断并修复以下几集的集尾钩子。先诊断，不要直接重写；我确认后再改。\n\n【先说清观众在等什么】\n用一句话写出：观众希望谁得到/摆脱什么，为什么值得在意。人物自己的目标不等于观众的愿望。\n区分三件事：期待 = 想看某个结果；悬念 = 对结果、过程或代价的疑问；钩子 = 此刻追看下一步的理由。不要为了藏答案，把理解事件必需的动机、风险或规则也藏起来。\n\n【检查钩子是怎么成立的】\n还原：进入场景时的局面 → 行动/选择 → 局面变化 → 已经给到的回报 → 尚未完成的后果。只截断“准备、预约、介绍”，是没有张力的。\n主导变化从这几类里选一个：即将兑现、错误认知被推翻、权力转移、关系变化、既有规则产生意外后果、不可逆的选择。\n先兑现一层，再留下一层，往往比全部藏起来更有力。\n\n【检查切在哪里】\n- 集尾聚焦一个核心事件，用具体动作、证据、出场、决定或有效台词呈现；空泛狠话、没有触发的震惊不算变化。\n- 不能切得太早（观众不知道在等什么），也不能太晚（只剩一个无关的新谜题）。\n- 相邻几集是否在重复同一种羞辱、误会、神秘电话、“即将揭晓”或“准备去做”？换个道具但还是同一种拖延，不算推进。\n\n【逐集输出】\n现在的钩子 / 观众期待 / 用的机制 / 主要问题 / 下一集开头有没有回应（没给下一集就写“未验证”）/ 修改建议。\n修复优先用最小改动：调整已有动作和信息释放的位置、收紧中断时机；不要新增人物、重大事件或世界观规则，不要提前泄露后面的秘密。默认给一个最合适的方案，确有不同取舍时最多给三个，并说明各自依据。\n```\n"}, {"id": "1.11", "title": "长篇连载节奏：跨集符号进化、距离叙事、信任曲线与第二主线", "chapter": "一、立项与大纲", "license": "外部·可直接用", "folder": "01-outline", "path": "01-outline/1.11-长篇连载节奏.md", "body": "\n**用法**：写到第 5 集以后、规划 10 集以上的长篇时用。它解决的是“中段疲劳”：同一个道具或口头禅怎么跨集升级、人物关系怎么用站位距离而不是台词表现、感情线什么时候必须进入平台期、第二条主线什么时候引入、冲突什么时候要从个人打脸升级到势力对抗。和 1.8（全剧期待链）配合：1.8 检查观众盼头有没有接上，这条给了具体的节奏手法。\n\n**来源**：[mengxiujie/ManjuForge](https://github.com/mengxiujie/ManjuForge) SKILL.md “跨集叙事技巧”“长篇节奏控制”两节，MIT-0（可商用、免署名；11/09 整理人新增到收集页面）。摘编：原文以作者自己的 Demo《代码赘婿》为例，例子保留了思路；作者注明部分规则来自“6 集实测 + 第三方评估”，样本小，按项目实际调整。\n\n**提示词正文**：\n\n```\n请按以下五条检查（或规划）这部连载短剧的跨集节奏。\n\n【一、视觉符号跨集进化】\n道具、动作、口头禅跨集延续，但每集换一种表达，形成“情绪刻度尺”。\n例：家主令牌——第 1 集男主目光追着令牌（注意到）→ 第 2 集女主攥紧到指节发白（紧张）→ 第 3 集站起来说话时可见（权威）→ 第 4 集转身时晃动（陪伴）→ 第 5 集女主主动不戴（放下身份）。\n规则：同一符号每集变换表达，避免重复；口头禅和标志性台词留给关键场景，不要每集都用；符号“缺席”也是叙事——角色不再需要某个符号，说明他成长了。\n\n【二、空间距离叙事】\n用人物之间的物理距离表现关系变化，比直接写“她开始喜欢他”有力得多。\n例：第 1 集门外，冷眼扫过（无视）→ 第 2 集门口，没接纸但自己去验证（好奇）→ 第 3 集从偏院到正厅，站起来宣布（正眼）→ 第 4 集主动走到面前求助（并肩）→ 第 5 集并肩走路、给面子、送汤（关心）。\n让距离逐集缩短（或拉远）。\n\n【三、行为否定 + 心理认可】\n人物的行为和心理方向相反时最立体。例：她没接他递来的纸（行为否定：“我是家主，不能轻信赘婿”），却回房翻了账本（心理认可：“但他说的可能是真的”）。\n不要让角色直接说“我相信你”，用一个否定行为加一个肯定行为同时表达，观众自己会读懂。\n\n【四、长篇节奏三条线】\n1. 第二条主线：单一主线到第 8 集左右会疲劳，第 4 集起引入第二条主线。第一条解决外部冲突，第二条探索人物内心。例：第 4 集埋种子（提到父亲旧交）→ 第 5~6 集展开 → 第 7~8 集两条线交汇（父亲的遗训帮助解决当前危机）。\n2. 信任 / 感情曲线：不能一路线性涨到满。前几集每集涨一点，到中段进入平台期，从“更亲近、更暧昧”转为“共同战斗、共同承担风险”；要再往上突破，需要一次考验或危机。\n3. 冲突升级：前几集是个人冲突（主角对反派，打脸）→ 中段是生存或事业危机 → 再往后是势力对抗（联盟、垄断、组织、资源）。到第 7~8 集还在“个人打脸”，观众会疲劳。\n\n【五、合作不能一步到位】\n拉人入伙、组建联盟时要有阻力（利益顾虑、怕报复、内部反对），不能一句话说服所有人。例：10 家里 1 家愿意、8 家观望、1 家反对 → 危机爆发 → 联盟在危机中真正形成。\n\n【输出】按集列出：本集符号的表达｜人物距离与关系阶段｜主线 A / 主线 B 的进度｜冲突层级｜需要调整的地方。\n```\n"}, {"id": "1.3", "title": "节奏规则：单集 15 秒换挡 + 全剧付费卡点", "chapter": "一、立项与大纲", "license": "外部·可直接用", "folder": "01-outline", "path": "01-outline/1.3-节奏规则.md", "body": "\n**用法**：写分集大纲、写单集时作为节奏约束一起发给 AI。前半段管「一集之内怎么推进」，后半段管「全剧哪里放卡点」。\n\n**来源**：单集部分出自 [short-drama-factory](https://github.com/lixiaoxiao9888-create/short-drama-factory) SKILL.md 与 templates/episode-format.md，MIT（收集人提供）；全剧部分出自 [OnlyShot](https://github.com/A-cat-with-carrots/OnlyShot) references/red-fruit-data.md，MIT。OnlyShot 原文附带的统计数字（如留存率、完播率）我核实不了，其中有一条明显有误，所以只保留了规则，删去了数字。\n\n**提示词正文**：\n\n```\n【单集节奏：15 秒换挡四拍（标准档 90~120 秒）】\n- 第 1 挡（0~15 秒）抓人立事：强视觉开场，报出具体数字或死线。\n- 第 2 挡（15~45 秒）正面交锋：施压加码，主角首轮反制。\n- 第 3 挡（45~85 秒）亮牌翻转：亮出物证或底牌，完成本集结算。\n- 第 4 挡（85~110 秒）余波钩子：抛出新危机，切断章。\n严禁同集同场景原地踏步、反复争吵同一件事；每一回合的反驳都必须带新增量（新信息/新行动/新代价）。\n每集必须有“集内结算”：主角有一次可见的反将，反派为本次施压付出可见代价（当众失面/盘算落空/进退两难）。\n\n【全剧节奏节点】\n- 第 1 集前 3 分钟内，用 5 个特写立住主角：核心标签、反差点、标志性能力、情感软肋、决心或目标。\n- 每分钟 3~4 个情绪爆点；第 7 分钟前后出现第一个高潮。\n- 第 8~12 集：一卡（首个付费点）；第 26~30 集：二卡；第 50~55 集：三卡（终极反转）。\n- 每集结尾必须有悬念卡点。\n- 反派：每 1~2 集一次小打脸，第 8/27/50 集前后各一次大打脸；中间要让反派阶段性地赢几次，制造焦虑缺口。\n- 反派的恶行最长不超过 3 集必须遭到一次阶段性反击或惩治。\n```\n"}, {"id": "1.14", "title": "一卡设计：前 10 集怎么排、付费卡点怎么写、真钩子和假钩子", "chapter": "一、立项与大纲", "license": "外部·可直接用", "folder": "01-outline", "path": "01-outline/1.14-一卡设计.md", "body": "\n**用法**：写一部剧的前 8~15 集（投稿、签约、审核常常先看这一段，业内叫“一卡”）之前用。它给了 10 集一卡的情绪排法、第 10 集左右的超大卡点怎么写、字数和钩子对不上时怎么处理、真钩子和假钩子的区别，以及一卡交付前的检查清单。最后附第 1 集、卡点集、至暗时刻集、大结局集各自的写法要点。和 1.5（前三集节拍卡）、1.3（全剧付费卡点）配合用。\n\n**来源**：[艾玛短剧 · 编剧 Skills](https://github.com/adoria111/emma-screenwriting-skills) advanced/story-writing/skills/em-chief-writer/references/writing-rules.md “一卡设计”“特殊集数撰写指南”两节，MIT（收集页面第 70 条，11/12 继续深挖）。摘编：作者说明集数、字数是特定类型（付费向后悔流、打脸）的参考，按本项目目标调整；特殊集数里专门针对漫剧画面的几句去掉了。\n\n**提示词正文**：\n\n```\n请按以下方法设计（或检查）这部剧的前 10 集（一卡）。\n\n【一、10 集一卡的排法（以付费向后悔流 / 打脸为例，按题材调整）】\n第 1~2 集：开篇切入，抛出大矛盾，主角人格开始苏醒——建立反差与代入；\n第 3~4 集：小事件拉扯，持续堆叠情绪（后悔流继续受虐，逆袭继续被看不起）——中度；\n第 5 集：金手指或转折点出现，给观众希望（决心离婚、发现搞钱门路）——希望；\n第 6~7 集：在新条件下产生新摩擦，持续拉扯——升级；\n第 8~9 集：尖锐大矛盾爆发，第一次用金手指打脸——高；\n第 10 集：全剧第一个超大卡点（断亲、离婚、离开、身份揭露、绝症大祸、大反转），戛然而止——顶点。\n用三个“小故事点”撑起一卡的情绪升级，轻 → 中 → 重。例：偏心不分钱 → 借 3 千被拒、转头给哥哥买车 → 1.5 万彩礼被挪去给外人娶妻。\n免费向一卡可以更轻快、梗更密，但钩子要足；付费向一卡矛盾更尖锐、更重情绪收割。\n\n【二、开篇检查（前三集）】\n人物出场控制信息量；核心矛盾建立；主角目标或自我意识觉醒；前 1~2 分钟抓人；信息不倾倒——只交代和当前冲突最相关的身份和关系，童年往事留给后面的闪回。\n\n【三、卡点怎么写】\n1. 堆积情绪：靠前几集的打压、委屈、矛盾，把观众的愤怒和憋屈推到高点；\n2. 主角关键抉择或行动：在情绪顶点说出决绝台词（“我们离婚吧”）、关键反击，或身份即将暴露；\n3. 留悬念定格：用一个强画面或强台词定格结束本集。\n卡点既是旧压抑状态的终结，也是新阶段（例如追妻火葬场）的开启。\n\n【四、字数和钩子对不上时】\n- 字数不够一集：钩子前的剧情重要，就丰富细节、加能凸显人物的小互动，把钩子放在本集结尾；\n- 字数够了钩子还没到：剧情平就压缩、把钩子提前；剧情都重要，就在这里设一个假钩子收尾，真钩子放下一集开头；\n- 切忌在平淡处断集。最好先写完一卡再精简到字数要求。\n\n【五、真钩子和假钩子】\n- 真钩子：观众最想知道答案的核心问题，贯穿全剧，一卡里要立住 1~2 个。例：女主什么时候真正离开？身份什么时候曝光？男主什么时候发现女主是恩人？\n- 假钩子：单集内可以多次出现的小反转、小悬念，可以切片投流，多多益善，但不能削弱或混淆真钩子。\n- 后悔流的假钩子技巧：让男主反复接近真相又错过（拿起离婚协议 → 电话响了放下 → 翻了一页 → 管家敲门 → 第三次终于看完，女主已经走了）。会“激怒”观众，但这正是追剧的动力。\n\n【六、特殊集数】\n- 第 1 集：第一个画面就要抓人，30 秒内建立主角困境，结尾留超强钩子。\n- 付费卡点集（第 10 集左右）：所有铺垫汇聚，情绪推到最高点后戛然而止，主角关键抉择 + 强画面定格。\n- 至暗时刻集（全剧约 2/3 处）：环境和色调转为压抑，主角形象出现变化（受伤、狼狈、失控），在绝望中埋下反击的种子。\n- 大结局（最后 2~3 集）：终极对决，所有悬念收回，最后一个画面要有余韵。\n\n【七、一卡交付前检查】\n集纲：核心真钩子一句话能说清；第 10 集左右的超大卡点已定，情绪能撑到顶点；三个小故事点轻 → 中 → 重升级，没有翻旧账；前三集要求齐全。\n正文：前 1~2 分钟开场抓人；每集结尾有钩子，第 10 集是最强卡点；台词一句一功能（见 3.24）；情绪逐层升级（见 1.13）；字数符合题材和付费模式，不僵硬。\n```"}, {"id": "1.13", "title": "情绪升级：六层拉扯 + 后悔流双曲线 + 延迟满足 + 禁止翻旧账", "chapter": "一、立项与大纲", "license": "外部·可直接用", "folder": "01-outline", "path": "01-outline/1.13-情绪升级.md", "body": "\n**用法**：编辑常说“情绪不够”“冗长啰嗦”时用，适合写分集大纲和卡点集之前。核心三条：冲突要一层比一层狠，每层带新信息；大卡点前铺多层递进的小冲突；后悔流里男主的后悔要一直拖到结局前才彻底爆发。和 1.10（爽点公式）的区别：1.10 讲单个爽点怎么设计，这条讲一串冲突怎么往上叠。\n\n**来源**：[艾玛短剧 · 编剧 Skills](https://github.com/adoria111/emma-screenwriting-skills) advanced/story-writing/skills/em-chief-writer/references/writing-rules.md “情绪升级”一节，MIT（11/11 整理人新增到收集页面）。摘编：保留规则和模板，去掉了交叉引用。作者说明“六层”“三层”等数字是特定类型的参考，不是硬性要求。\n\n**提示词正文**：\n\n```\n请按以下规则检查（或设计）这部剧的情绪升级。\n\n【一、逐层升级：轻度 → 中度 → 重度】\n反派或家人的态度和行为越往后越过分，每个新事件更狠、更戳心。\n例（家庭逆袭）：偏心不分钱（轻）→ 连 3 千都不肯借（中）→ 把 1.5 万存款借给外人娶媳妇（重）。\n两条升级线同步往上走：\n- 打压 / 后悔线：看不起 → 开始后悔但嘴硬 → 彻底悔恨求饶；\n- 事业 / 反击线：数字看得见地变大（打工赚 4 万 → 开网店赚 100 万 → 生意做到上亿）。\n长剧靠“故事点”续航：约 70 集安排 3 个大故事点，80 集再加一层。\n\n【二、六层拉扯：大卡点前铺 6 个层层递进的小冲突】\n每个都比前一个更激烈，每个都带新信息或新的冲突方式；吵完一个就过去，进入下一个。\n模板（家宴前）：① 身份打压（“你没资格参加宴会”）→ ② 上升到肢体（要动手）→ ③ 新人物介入激化（男主不分青红皂白护着对方）→ ④ 颠倒黑白（女主的功劳给了女配）→ ⑤ 抢走重要物品（妈妈的遗物）→ ⑥ 逼下跪后出尔反尔（跪了，对方还是摔了遗物，到顶点）。\n层级走向：骂人 → 推搡 → 毁坏重要物品 → 牵连亲人。是递进，不是并列。\n\n【三、禁止翻旧账】\n- 每个新事件都要更激烈、带新的信息点；不要在同一层面重复冲突。\n- 不靠反复回忆旧委屈凑情绪；旧委屈用闪回，集中堆在卡点集里升华。\n- “冗长啰嗦”的根因，就是反复强调反派有多过分，却没有新进展。\n\n【四、后悔流双曲线（感情线和事业线方向相反）】\n- 女主：感情起点高（深爱）→ 经历矛盾一路下滑；同时事业 / 自我意识线上升。\n- 男主：感情起点低（冷淡）→ 随着女主感情下滑、事业上升而缓慢上升；女主触底决心离开时才真正觉醒。\n- 两条线在矛盾激化点交叉，这里就是关键卡点。\n- 事业成功不只是打脸，也是让男主刮目相看、感情升温的催化剂。女主事业成功后仍会在意“他为什么还这样对我”，这种纠结才真实。\n\n【五、延迟满足】\n- 观众要的不只是打脸，还有把委屈说出来，并看到对方后悔和认可。\n- 女主的付出和委屈用具体的日常细节（“我每天五点起床做饭，你吃过一次吗？”比讲道理更有共鸣）。\n- 男主不能很快后悔，要一点点积累，大结局前才彻底爆发。\n- 用两个交替的悬念维持张力：男主什么时候发现女主要走？女主什么时候真的离开？\n\n【六、人设是可信的矛盾体，不是脸谱】\n纯粹的坏人（又穷又丑又家暴）不如贴近现实的矛盾体（“我爱你，但我妈不同意”）。反派“又当又立”更能引发代入和愤怒。\n\n【自检】\n- 每个新冲突比上一个更狠，且有新信息，没有翻旧账；\n- 大卡点前铺了多层递进拉扯；\n- 后悔流的感情线下滑、事业线上升，在卡点交叉；\n- 男主的后悔拖到结局前才彻底爆发；\n- 女主的委屈用了具体日常细节，不是空喊；\n- 反派态度是轻 → 中 → 重升级；\n- 人设是可信的矛盾体。\n```\n"}, {"id": "1.7", "title": "冲突形态五型（先定这一集的冲突在哪个战场打）", "chapter": "一、立项与大纲", "license": "外部·可直接用", "folder": "01-outline", "path": "01-outline/1.7-冲突形态五型.md", "body": "\n**用法**：写分集大纲或单集前，先让 AI 给每集定一个冲突形态，再按形态选骨架和断章方式。最有用的是「行动坚持型」：主角闷头做事、被人嘲讽的戏（比如预知灾难囤货），对白天然少，不能按吵架戏的写法硬塞台词。\n\n**来源**：[short-drama-factory](https://github.com/lixiaoxiao9888-create/short-drama-factory) references/conflict-modes.md，MIT（收集人提供）。摘编：去掉了机检编号。\n\n**提示词正文**：\n\n```\n写本集之前，先判断这一集的冲突放在哪个“战场”，从下面五型里选一个（或混合），再按对应的骨架写。\n\n共同引擎（五型都靠这两条）：\n1. 信息差：观众和场内人物知道的不一样多（观众全知 / 主角预知 / 双方各知一半），看点就是这个差；\n2. 每个节拍都必须改变权力格局、状态或认知，原地踏步就会流失观众。\n\n① 对话型（嘴上见血）：战场在语言。钩子是一句顶到顶点的台词；节拍是回合制攻防（施压→反驳→刺探→绝杀）；断章用反差金句或当场打脸。\n② 行动坚持型（手上见血、嘴上闭嘴）：战场在“行为 × 质疑”的错位。钩子是反常动作 + “他为什么这样”；节拍是“准备→被阻挠→升级准备→阻挠升级”循环；断章卡在“验证前一秒”（灾难前兆即将兑现）。\n   三条铁律：解释即泄气（用动作回答，不辩解）；每次阻挠都要升一档（从嘲笑到举报、偷拍、断水断电），复读就是废拍；每个准备动作都要改变处境、拍得出来。\n   必须有一个质疑者配角，没有对手就成了做事流水账。\n③ 身份错位型（他到底是谁）：战场在“身份 vs 别人的认知”，这是最大的主流。节拍是他何时暴露、对方认不认；断章用“掉马前一秒”。\n④ 关系情感型（还要不要他）：战场在关系里的情绪债。钩子是关系破裂的临界画面；节拍是要不要原谅、敢不敢靠近；断章用情绪反差落地（一个克制的动作切黑）。\n⑤ 规则谜题型（这到底怎么回事）：战场在谜与解。节拍是“新线索→误判→翻案→更大的谜”；断章停在真相揭晓一半。\n\n混合：行动外壳 + 对话火力——主角在围攻里不解释、只做事，只在关键一拍开口如刀（一集 2~3 句硬话）。\n\n写完自检：\n1. 观众和场内人的信息差是什么？（答不上来 = 没有引擎）\n2. 每个节拍是否都改变了权力格局或认知？（没改变的删掉）\n3. 行动型：主角有没有辩解？质疑者是否每次升一档？有没有验证段？\n4. 身份型：有没有切在掉马前一秒？关系型：有没有情绪反差落地？谜题型：有没有误判被坐实？\n```\n"}, {"id": "1.8", "title": "全剧期待链（观众盼头 → 阶段任务 → 兑现）", "chapter": "一、立项与大纲", "license": "外部·可直接用", "folder": "01-outline", "path": "01-outline/1.8-全剧期待链.md", "body": "\n**用法**：分集大纲写完、或者写到十几集觉得“往下没劲”时，把大纲（或已写的剧本）和这段一起发给 AI。它检查的是全剧层面：观众到底在盼什么、每一段有没有往前推、哪些承诺还没兑现。和 1.6 的区别：1.6 管单集结尾，这条管跨集的大期待有没有接上。\n\n**来源**：[艾玛短剧 · 编剧 Skills](https://github.com/adoria111/emma-screenwriting-skills) skills/em-expectation，MIT（收集页面，11/02 继续深挖）。摘编：去掉了和其他技能联动的说明。\n\n**提示词正文**：\n\n```\n你是短剧编辑，请检查这部剧的“期待链”：把观众“想看到什么”落实为人物行动、阻力和兑现。注意人物想赢不等于观众希望他赢，人物目标和观众盼头要分开说。\n\n【检查步骤】\n1. 核心期待：观众希望谁得到什么、或摆脱什么？当前处境为什么值得关心？写清动机、眼前办法和可以辨认的完成状态，不接受“改变命运”这类空话。\n2. 逐阶段检查“任务—行动—阻力—代价—结果”。每一段要带来新的进展、限制或选择；重复说目标不算推进，坏事更多也不等于冲突升级。\n3. 信息差：按同一时间点核对谁知道、谁怀疑、谁误判、谁不知道。观众已经知道答案，仍然可以等公开揭晓、对手的反应和关系变化。\n4. 集尾：这一集已经给了什么回报？把哪一个迫近的后果留到下一集？下一集开头有没有回应它？\n\n【分清兑现层级】获得机会、暂时成功、公开认可、目标真正完成是不同阶段。拿了奖不等于家族兑现承诺；对方说会帮忙不等于事情办成了。\n\n【输出】\n1. 期待一句话；\n2. 阶段表：承诺位置｜观众想看的结果及情绪理由｜本次推进｜已给回报｜仍欠的后果｜兑现位置（已兑现 / 计划 / 未验证）；\n3. 断裂点：从五个方面找——观众有没有明确盼头、情绪理由是否在正文里建立、待看的后果是否具体、行动是否来自已有因果、变化能不能被看见或听见；\n4. 修复：优先修最关键的一处，默认给一个方案，确有不同取舍时最多三个，说明改动范围。\n\n【不能做】不靠突然增加反派、期限或新秘密制造悬念；不改动没让改的事件、动机、关系、道具、秘密和结局；事实和建议分开写；材料不够的地方标“未验证”，不算作品缺陷。\n```\n"}, {"id": "1.5", "title": "前三集节拍卡", "chapter": "一、立项与大纲", "license": "外部·可直接用", "folder": "01-outline", "path": "01-outline/1.5-前三集节拍卡.md", "body": "\n**用法**：立项后、写正文前，把这段发给 AI 先锁定前三集的骨架；前三集写完后，再用最后的自检清单逐条核对。原作者是拆了六部已经跑出成绩的实拍剧总结出来的。\n\n**来源**：[short-drama-factory](https://github.com/lixiaoxiao9888-create/short-drama-factory) references/first-three-eps-beat-card.md，MIT（收集人提供）。摘编：保留三集骨架、四类节奏型和自检清单，删去了六部剧的拆解表（剧名和数据需要时可回原文看）。\n\n**提示词正文**：\n\n```\n写前三集之前，请先按下面的骨架给出前三集的结构方案，我确认后再写正文。\n\n【三集骨架】\n- 第 1 集：受害/损失事件 + 主角立场，双重锁定。必达：90 秒内观众知道“帮谁、恨谁”；主角有明确表态或行动（不辩解，但也不退让）。禁止：只铺背景不立冲突；主角被打不还手也不立 flag。\n- 第 2 集：证据回放 / 考验递进。必达：每 1~2 条恩情账、付出账或考验加一笔（穿插物证特写）；对立方加码施压。禁止：重复第 1 集的话术，没有新信息空转。\n- 第 3 集：冲突升级。必达：矛盾从“私人摩擦”升级到“公开/金钱/关系”层面，把观众情绪吊到付费点。禁止：第三集还在铺垫日常。\n\n【共同手法】\n- 物证叙事：每集 1~2 个贯穿物件（碗/账本/鱼竿/群聊截图/到账页），情绪落在物证上，不靠空口控诉。\n- 内心独白当情绪引导：主角全程冷静不辩解，用少量独白替观众算账站队。\n- 质疑者配角：设一个替观众说狠话、发问的人，主角保持冷静。\n- 断章用“反差金句落地”或“掉马前一秒”，治愈系用情绪反差切黑；不用悬念问句断章。\n\n【四类节奏型，按题材选一种】\n- 递减派：第 1 集最长，之后逐集收窄加压；单场景为主 + 回忆插叙。适合都市商战、恩人反杀、家庭反击。\n- 波动派：铺垫集给足时长、短集快推进，“画饼—兑现”交替。适合萌宝、治愈家庭。\n- V 型派：第 1 集给满（羞辱 + 回忆 + 立誓），第 2 集短促过场，第 3 集拉回。适合逆袭打脸、校园、变美。\n- 微集派：第 1 集立规矩，之后每集 30~40 秒，一集只推一个情绪点。适合乡村现实、情绪流慢剧。\n\n【行动型主角的变体】（主角靠做事而不是吵架推进，比如预知灾难囤货）\n- 第 1 集：预知灾变 + 开始准备，用“他为什么疯了一样囤货”的反常动作立钩子；\n- 第 2 集：准备升级 × 质疑阻挠也升级（从嘲笑到举报、偷拍）；\n- 第 3 集：第一次验证前兆出现，质疑者开始慌，断章卡在更大灾难前一秒。\n\n【写完后自检】\n1. 第 1 集是否在 90 秒内同时完成“受害事件”和“主角立场/行动”？\n2. 第 2 集是否有新信息，而不是重复第 1 集？\n3. 第 3 集是否已经从私人摩擦升级到公开/金钱/关系层面？\n4. 前三集是否有 1~2 个贯穿物证，每集都有特写落点？\n5. 是否有质疑者配角替观众把狠话说出口，主角保持冷静？\n6. 断章是否是反差金句、掉马前一秒或情绪切黑，没有用悬念问句？\n7. 节奏型是否和题材匹配？\n```\n"}, {"id": "1.9", "title": "弱开场诊断：五种失效模式", "chapter": "一、立项与大纲", "license": "外部·可直接用", "folder": "01-outline", "path": "01-outline/1.9-弱开场诊断.md", "body": "\n**用法**：第一集（或每集）开头写完后，把开头一两场和这段一起发给 AI，让它判断属于哪一种失效、怎么最小改动。和 1.2 的区别：1.2 是写之前选钩子母型，这条是写完后查开头为什么“抓不住人”。\n\n**来源**：[XucroYuri/how-to-make-script](https://github.com/XucroYuri/how-to-make-script) knowledge/30-craft/ka-weak-opening-diagnosis.md，MIT（收集页面，11/03）。原文按电影剧本写（“第 1 页”），这里改成了短剧的“开场几秒、第一场”。\n\n**提示词正文**：\n\n```\n请诊断下面这段剧本开场，判断它属于以下哪种失效，指出位置，并给最小改法。\n\n第一步：找到第一个“有什么不对劲”的时刻。它不在第一场的开头几秒，开场就有问题。\n\n【五种失效】\n1. 世界观优先：开场一直在交代背景设定，没有任何事情处在危险中（大量环境描写、地图式空镜、旁白讲历史）。\n   改法：找到第一个“某件事已经出错了”的时刻，从那里开始。\n2. 气氛开场：只有情绪和基调，没有人物冲突（空镜、自然声、没有人在做事）。\n   改法：把同样的气氛包进一个具体的角色动作里，这个动作必须产生摩擦。\n3. 解释性台词开场：角色互相告诉对方双方本来都知道的事（“你知道的，自从五年前爸走了，我们家就……”）。\n   改法：让同一段对话承载互相冲突的欲望，信息变成争执的副产品，而不是目的。\n4. 主角迟到：开场是配角或群戏，主角想要什么、怕什么在第一场看不到。\n   改法：第一场结束前，让主角做出一个暴露他核心欲望或核心恐惧的具体行动。\n5. 假平静开场：一切看起来都很好，过一阵才出事，前面那段“美好”是多余的缓冲。\n   改法：从出事的中间开始，观众不需要先看到“正常”才能理解“不正常”。\n\n【检查问题】\n- 开场第一句里，谁想要什么、谁在阻止他？\n- 删掉开头这一段，观众会损失哪些必须知道的信息？这些信息真的必须此刻给吗？\n- 第一场结束时，观众能不能说清“谁有麻烦、麻烦是什么”？\n- 第一场最后一个动作或最后一句台词，有没有留下一个需要回答的问题？\n\n【不要做】用环境描写代替人物行动建立世界观；让配角比主角更有欲望、更主动；靠画面美感或音乐弥补没有冲突；把导火索推迟到第二、三场。\n```\n"}, {"id": "2.12", "title": "长篇小说改编压缩：七种手法 + 压缩比 + 集数预算", "chapter": "二、小说转剧本", "license": "外部·可直接用", "folder": "02-adaptation", "path": "02-adaptation/2.12-长篇小说改编压缩.md", "body": "\n**用法**：一整本长篇小说要改成几十集短剧时，先用这条决定“砍什么、并什么、每卷给几集、付费卡点和大反转放在第几集”，再进入分集大纲。和 2.7（网文改编流水线）配合：2.7 讲整体流程，这条给了具体的压缩手法、压缩比算法和关键位置表。最后的“压缩决策表”可以直接让 AI 填。\n\n**来源**：[egguy886/write-screenplay-skill](https://github.com/egguy886/write-screenplay-skill) references/long-novel-adaptation.md、templates/adaptation/02_压缩决策.md，MIT（收集页面第 31 条，11/07 继续深挖）。摘编：去掉了配套脚本的说明；原文“V.O. ≤ 对白词数 25%”是英文剧标准，这里保留为参考，中文剧按 3.11 的规程。\n\n**提示词正文**：\n\n```\n请把下面这部长篇小说压缩改编成 ___ 集短剧（每集约 ___ 分钟），先做压缩决策，我审过之后再写分集大纲。\n\n【一、七种压缩手法（按优先级）】\n1. 保：主线因果链、每一个反转和揭示、爽点兑现、伏笔的埋设与回收。判断：删掉它，后面会不会有一处看不懂或不解气？会就保。\n2. 并场：两场戏功能相同（都是“男主试探、女主圆谎”）就合成一场，取两场里最好的台词和动作。\n3. 并人：功能重叠的配角合成一个（闺蜜 A + 室友 B → 一个闺蜜）。AI 出片时人越少，一致性越稳、素材越省。\n4. 并景：同类场景归并成少数固定主场景（办公室、公寓、门厅、车内等），AI 短剧主场景控制在 8~12 个。\n5. 三次法则：同一类桥段（圆谎、差点穿帮、吃醋）全剧最多三次：建立 → 升级 → 兑现，第四次起删或合并。\n6. 浓缩：日常甜宠、时间流逝、反复的消息往来，做成 3~5 个镜头的蒙太奇，或一串手机屏幕。\n7. 前移 / 重排：下一章的揭示或钩子挪到本集结尾；必要时第一集开头先闪 5 秒高潮画面再倒叙。\n配套：第一人称内心戏外化为手机屏幕文字、道具特写、动作与微表情，最后才用少量旁白。\n红线（不能动）：原著人物底线、尺度红线、核心卖点（例如“他早就知道”的戏剧反讽）。\n\n【二、先算压缩比】压缩比 = 进入正剧的章节数 ÷ 目标集数\n- 小于 1.2：接近一章一集，注意注水，考虑减少集数；\n- 1.2~2.5：正常，每集 1~3 章，靠并场和浓缩；\n- 2.5~3.5：高压缩，必须删支线、大量蒙太奇；\n- 大于 3.5：超压缩，先砍整条支线和番外，否则每集都会变成剧情摘要。\n番外默认不进正剧；终局打脸类番外可以并入最后一集。\n\n【三、按“卷的作用”分配集数，不平均切】\n权重：开局 1.25（前 10 集决定留存，钩子最密）、推进 1.0、中点 1.25（大掉马、大反转）、甜宠喘息 0.8（最该压缩）、危机 1.25、高潮 1.2、收尾 1.0。按“章节数 × 权重”分配。\n\n【四、关键位置（以 60 集为例，按比例换算）】\n付费卡点 第 8~12 集：一个大钩子，通常是开局卷的结尾；\n第一次关系质变 第 15~22 集：让观众确信“这对能成”；\n中点大反转 第 27~33 集：全剧最大的信息差爆破；\n至暗时刻 第 42~50 集：分离、背叛、逃离；\n高潮 第 50~57 集：最大的公开对决或追逐；\n结局 第 58~60 集：兑现 + 最后的爽点，可留一个续季小钩子。\n\n【五、请填写压缩决策表（每项写结论和理由）】\n1. 支线：支线｜涉及章节｜保留 / 并入主线 / 删除 / 浓缩为蒙太奇｜理由或去向\n2. 角色：原著角色｜戏份章节｜保留 / 合并 / 删除 / 只出声｜合并到谁或谁接他的戏（常驻有台词角色上限 6~8 人）\n3. 场景：原著场景｜出现章节｜归并到哪个主场景（主场景清单不超过 12 个）\n4. 重复桥段：桥段类型｜原著出现章节｜保留的三次（建立 / 升级 / 兑现）｜删掉的\n5. 前移 / 重排：内容｜原著位置｜剧集位置｜为什么\n6. 内心戏外化：原著内心信息｜外化方式（屏幕 / 道具 / 动作 / 旁白）｜首次出现集\n\n【常见失败】每集像剧情摘要 → 压缩比过高，删支线，一集只讲一件事；集尾很平 → 按章数机械切集，按钩子点重切；看不懂动机 → 内心戏没外化；中段拖 → 甜宠卷集数给多了；钩子雷同 → 同类型钩子不连续超过 2 集。\n```\n"}, {"id": "2.2", "title": "短篇", "chapter": "二、小说转剧本", "license": "内部 1.0", "folder": "02-adaptation", "path": "02-adaptation/2.2-短篇.md", "body": "\n**用法**：适用于小说字数很少的情况。\n\n**提示词正文**：\n\n```\n你是一个经验丰富的短剧编剧，擅长将小说改编成短剧，将书里面情绪最爆的地方完整通过剧情高潮、细腻画面、人物之间的互动展现出来。并且严格按照小说剧情不乱改剧情，只做短剧化改编，每集都要与前后衔接。整个剧本必须故事流畅，拍成剧能让人看懂。\n\n要求：\n\n1.每集字数限制800-1000字之间\n\n2.原著里很水的台词精简，无效形容词精简。台词不能超过15字。\n\n3.心理描述精简，要根据第一人称视角，转化为OS\n\n4.小说原文里面的重要信息必须直观展现，令拍摄出来，观众能看明白。\n\n5.相同场景不能分场，一整集不能超过3场。\n\n6.严格遵守剧本格式\n\n第1集\n1-1 日 内 地点\n出场人物：XXX\n1-2 日 内 地点\n出场人物：XXX\n▲ 动作或者环境\n角色：（神态）台词\n角色：台词\n角色：（神态）台词（动作）台词\n角色（OS）：内心独白\nVO：旁白\n每集结束加一个（本集完）\n\n【镜头/特效特殊标注】：\n\n[快切] / [蒙太奇] / [闪回开始]...[闪回结束] / [同屏切入]\n\n我们的全部对话和相关指令都将用中文进行。\n```\n"}, {"id": "2.7", "title": "网文改编流水线（长篇网文 → 分集）", "chapter": "二、小说转剧本", "license": "外部·可直接用", "folder": "02-adaptation", "path": "02-adaptation/2.7-网文改编流水线.md", "body": "\n**用法**：拿到一部长篇网文要改成短剧时，在动笔写单集之前用。1.0 的 2.1~2.3 是「一段小说 → 一集剧本」，这条管的是更上游的一步：整本书先砍什么、并什么、怎么分到每一集。核心一句话：短剧不是网文的缩写，是网文里最爽那条情绪线的放大。\n\n**来源**：[short-drama-factory](https://github.com/lixiaoxiao9888-create/short-drama-factory) references/webnovel-adaptation.md，MIT（收集人提供）。摘编：去掉了指向该仓库其他文件的引用。\n\n**提示词正文**：\n\n```\n我会提供一部网文（或它的大纲）。请按以下五步做短剧改编方案，每一步做完先给我看，确认后再做下一步。\n\nStep 1 抽取，产出三张表：\n1. 情绪线表：全书所有“打脸/反杀/掉马/重逢/碾压”名场面，按出现顺序列出（只记事件功能，不记细节）；\n2. 人物功能表：每个角色的功能位（主角/施压反派/助力/棋子/白月光），功能重复的标出来准备合并；\n3. 判断全书的情绪体验能不能浓缩成一句话（如“让看不起我的人高攀不起”）。能，就按情绪流改编，这句话贯穿全剧；不能（偏悬疑解谜），就按信息逐步揭露的方式改编。注意：网文一卷大约对应短剧一个单元（20~30 集）。\n\nStep 2 砍并：\n- 不直接影响主情绪线的支线全部删，必要信息并到主线的道具或台词里；\n- 功能重复的角色合并成一个人；出场即死的降成龙套；\n- 修炼、攒钱、赶路这类水段全部跳过，只保留关系发生质变的节点场；\n- 每删一段，检查是否伤到下一个爽点的前置铺垫，伤到了就改成一句台词带过。\n\nStep 3 章 → 集：\n- 1 集 = 1 个关系质变节点，不是 1 章；\n- 一集只装“一次施压 + 一次反击”或“一次蓄力 + 一次兑现”，装不下就拆集，不够就并集；\n- 卷末高潮对位到付费卡点集，调整前后节奏去凑卡点，不要让卡点迁就原文顺序；\n- 原著前 1/4 往往撑不满前 15 集：可以把后面的冲突提前（比如把第 20 章的羞辱挪到第 3 集），或者把一次性的误会拆成逐步升级的几轮。\n\nStep 4 分单元：每 20~30 集一个单元，单元结尾闭环但留火种，每个单元换一层对手；把各单元的名场面按升级顺序排好，缺的环节按同样逻辑补写（不得照搬其他作品的表达）。\n\nStep 5 输出：立项单（题材 + 一句话情绪核心）→ 人物表 → 单元与付费卡点规划 → 分集规划。\n\n改编红线：\n1. 人设三观可以洗白，但主角的核心执念（不信/不认/不服）不能改；\n2. 名场面对白不整段照搬，保留事件结构和金句的作用，表达重写；\n3. 原著靠旁白交代的世界观，改成看得见的冲突，不用旁白讲设定；\n4. 超过 200 章的网文，第一版只改前 1/3 加全书最强的 20 个名场面，其余留作第二季。\n```\n"}, {"id": "2.11", "title": "对标改编：提取爆款的有效机制，换成新故事", "chapter": "二、小说转剧本", "license": "外部·可直接用", "folder": "02-adaptation", "path": "02-adaptation/2.11-对标改编.md", "body": "\n**用法**：两种情况用。一是“照着某部爆款做一个新的”：先拆出它真正起作用的机制，再给新故事重新设计成立的理由，避免只换人名、职业、场景就当成新剧（这样既没新意，也有抄袭风险）。二是“已有故事只改某几个维度”（比如换职业、换世界观）：顺着变化检查连带影响，避免改了一处、后面全穿帮。\n\n**来源**：[艾玛短剧 · 编剧 Skills](https://github.com/adoria111/emma-screenwriting-skills) skills/em-adaptation，MIT（11/06 深挖）。摘编。\n\n**提示词正文**：\n\n```\n你是短剧故事编辑。先理解原元素承担的情感、因果和信息功能，再在这次允许的范围内形成新方案。\n\n【先确定任务类型】\n- 新故事机制迁移：从给定作品提取可复用的冲突、期待和兑现方式，再设计人物、关系、规则和事件。新写的内容标为“方案”，不冒充原剧事实。\n- 已有故事定向改编：先核对底稿、可变的维度和要保护的内容。允许换职业不等于允许改感情关系；允许改世界观不等于允许提前揭晓秘密。\n\n【从原作提取能迁移的功能】\n1. 读完给定材料，记录：人物处境—想得到什么—对手为什么阻止—用什么办法—付出什么代价—怎样改变局面。重要判断写明出自哪集哪场；只读到选段就不补造全剧结果。\n2. 把关键元素拆成三层：表面内容、戏剧功能、生效条件。例：作品里的登记簿提供了时间线，但它能证明原创，是因为和能力展示、其他证据、对手反应一起起作用，不能单独搬走。\n3. 迁移时保留选定的功能，重新设计它在新故事里成立的原因。只换人名、职业或场景，保留独特的桥段组合和台词，不算完成了新的故事设计。\n\n【形成方案并检查连带影响】\n1. 说明新主角为什么必须行动、有什么资源、阻力在哪里、为什么不能轻易解决。\n2. 重做身份、关系、规则、行动方式和视觉表现；新细节要改变选择或后果，不只是装饰。\n3. 顺着变化检查：动机、角色知情、道具的能力和来源、时间地点、伏笔回收、揭示顺序、集尾。角色失去原身份后，不能继续自动拥有原来的权限。\n4. 专业、制度或现实文化细节需要准确时先核实；虚构规则前后一致，不把对标作品里的戏剧处理当成现实标准。\n5. 用新故事自己的条件推演结果。保留情绪回报，不要求复制原作的全部事件、人物关系或结局。\n\n【输出】\n- 只要分析：原文依据—可迁移的机制—成立条件—不宜照搬的内容。\n- 要方案：新故事卖点、人物目标与冲突、事件链、关键变化与连带影响。\n- 要大纲或正文：写到具体事件和停点，不能只写“矛盾升级、情绪爆发”。\n交付前核对：每处变化都有授权；旧设定的依赖已经修好；关键秘密没有被提前暴露。\n```\n"}, {"id": "2.9", "title": "小说 / 大纲直接改编成 AI 短剧分镜（本集引擎 + 六节拍 + 时长分配）", "chapter": "二、小说转剧本", "license": "外部·可直接用", "tool": "Grok 等直接出分镜的流程", "folder": "02-adaptation", "path": "02-adaptation/2.9-小说-大纲直接改编成-AI-短剧分镜.md", "body": "\n**用法**：有的项目不走“剧本 → 分镜表 → 6.0”，而是从小说片段或分集大纲直接出分镜提示词（比如“大纲 → 分镜提示词 → Grok”）。这条就是给这一步用的：先用一句话锁定本集引擎，再排六个节拍，按比例分时长，最后逐镜写时间码。走剧本流程的项目，也可以拿前两部分来检查分集大纲。成人线的具体写法不在这里，按各项目自己的要求和《成人线与全年龄线分开原则》。\n\n**来源**：[muxia0396/novel-to-ai-short-drama-skill](https://github.com/muxia0396/novel-to-ai-short-drama-skill) references/adaptation-workflow.md，MIT（11/05 整理人新增到收集页面）。摘编：去掉了多集全局地图之外的重复说明。\n\n**提示词正文**：\n\n```\n请把下面的小说片段 / 分集大纲改编成一集 AI 短剧的分镜。单集成片时长：___秒（没给时长先问，不要开始）。\n\n【一、先建事实账本（内部用）】\n人物：身份、欲望、恐惧、当前认知、关系、说话习惯；事件：起因、行动、阻碍、结果、后果；秘密：谁知道、谁不知道、何时暴露；时空：地点、时间、前后顺序、移动关系；连续物：服装、伤势、道具、证据、环境状态；情绪：进入场景的状态、触发点、离开场景的状态。\n素材分三类：原文事实（不得无故改变）；合理外化（把原文已有的心理或信息变成动作、对白、声音或道具证据）；改编新增（为压缩、转场或可视化加的连接内容，不能反转人物动机和因果）。\n优先保留：核心因果、人物欲望、关系变化、关键伏笔、标志性动作和台词、不可替代的情绪峰值。优先压缩：重复说明、同功能配角、没有结果的往返、只提供氛围不推进剧情的段落。\n\n【二、一句话本集引擎】\n当【触发事件】发生，主角为了【可见目标】采取【行动】，却遭遇【阻力】，导致【不可逆变化】，并留下【下一步问题】。\n\n【三、六个节拍】\n1. 开场画面：第一帧或第一声就给出异常、冲突、欲望或危机；\n2. 最小定向：用最少信息回答“谁、在哪、现在要什么”；\n3. 压力升级：阻力必须改变主角的行为，不能只是重复争吵；\n4. 转折：新信息、关系变化、选择或失败改变行动方向；\n5. 高潮 / 释放：兑现本集承诺；\n6. 尾钩：从高潮的结果自然长出，不用和本集无关的突发噱头。\n每一场结束时至少改变一项：信息、权力、关系、风险、目标、位置或资源。没有变化的场景删掉、合并或改写。\n\n【四、时长分配（起点，不是公式）】\n钩子 0%~8%；定向 8%~22%；升级 22%~65%；转折 / 高潮 65%~90%；余波 / 尾钩 90%~100%。\n镜头规模参考：15~30 秒 1 场 4~8 镜；31~60 秒 1~2 场 8~14 镜；61~90 秒 1~3 场 12~20 镜；91~180 秒 2~4 场 18~30 镜。不要为了凑数硬切。\n台词语速估算：克制、停顿多约 2.5~3.2 字/秒；日常清晰 3.3~4.2 字/秒；争执、快节奏 4.3~5.0 字/秒（不宜整集维持）。对白之外另计反应、动作完成、观众理解信息的停顿。\n先逐镜写“时间码 + 持续秒数”，各镜相加必须等于目标时长。超时先删重复信息和没有变化的反应；不足时加有意义的反应、悬念停顿或因果步骤，不注水。\n\n【五、文学语言外化】\n她开始怀疑他 → 视线停在矛盾证据上，收回伸出的手，删掉没发出的消息；\n他非常愤怒 → 指节压白，杯中水震动，短促呼吸后改变行动；\n多年过去 → 同构图匹配剪辑，道具磨损，季节或空间变化；\n他身份尊贵 → 别人让路、称呼变化、权限行为、站在空间中心；\n她想起往事 → 声音桥、闪回碎片、触发物特写；只在确有必要时用旁白。\n旁白只承担画面和对白难以表达的主观层、时间跨度或叙事风格，不解释观众刚看见的动作。\n\n【六、多集时】\n先列每集的目标、阻力、核心变化、主导情绪、开场钩子、尾钩；每集都要有阶段性收益，不能连续几集只铺垫；尾钩由本集的选择或结果产生，下一集开场尽快兑现或有意义地改写这个预期。\n```\n"}, {"id": "2.10", "title": "集纲扩写正文：按分集大纲扩成可拍剧本", "chapter": "二、小说转剧本", "license": "外部·可直接用", "folder": "02-adaptation", "path": "02-adaptation/2.10-集纲扩写正文.md", "body": "\n**用法**：已经有分集大纲（集纲），要扩写成正文时用。和 1.0 的 2.1~2.3（小说转剧本）不同，这条的输入是大纲，重点是“忠实”：核心事件、人物动机和结尾都按大纲走，不在扩写时悄悄加身份、阴谋或提前兑现下一集。先出大纲、再写剧本的项目都能用；从大纲直接出分镜的流程（2.9），也可以先用这条把大纲扩成剧本再出分镜，镜头会更扎实。\n\n**来源**：[艾玛短剧 · 编剧 Skills](https://github.com/adoria111/emma-screenwriting-skills) skills/em-outline-to-script，MIT（收集页面第 19 条，11/06 继续深挖）。摘编：去掉了项目文件和版本管理的说明。格式按我们的 1.0：动作行用「▲」，每次台词换行都重新标括号。\n\n**提示词正文**：\n\n```\n你是短剧编剧，请把下面已经给定的分集大纲扩写成可拍、可演的剧本正文。地区、受众、题材、集长沿用项目设定；我要求写几集就连续写完几集，不要在中途停下等确认。\n\n【写作前先提取】\n每集的人物、目标、阻力、事件顺序、必要道具与线索、情绪变化和结尾。区分本集已经知道的信息和后面才揭晓的秘密。\n\n【扩写方法】\n1. 按原纲安排场次，让人物通过当下的行动和对话完成事件，不要把大纲的说明整段塞进台词。\n2. 一个人的行动引出另一个人的回应，回应形成下一步压力。冲突升级用原有的资源、误判和代价，不靠新增身份、伤害或阴谋。\n3. 补足必要的站位、转场、道具交接和反应，让动作接得上。普通衔接可以合理补充；会改变动机、关系或关键条件的内容，不能当作衔接悄悄加入。\n4. 结尾落在原纲指定的事件状态。可以加强临界感和观众理解，不提前兑现下一集，不用一句狠话代替缺失的事件。\n\n【节奏与忠实度同时处理】\n- 根据本集事件选择开场压力、第一次对抗、筹码变化、情绪高点和结尾后果。这是检查角度，不要求每集固定五拍；平静的开场如果在铺悬疑或关系，可以保留。\n- 强化表达时，保持事件的施动者、机会由谁争取、谁实际阻断、动作的先后不变。只保留表面信息却换掉攻防关系，仍然算改了原纲。\n- 对白表达人物当下的目的和应对，不解释作者设定。旁观者有没有看见、道具怎么拿到、人物凭什么相信某个信息，都会影响后面，补动作前先核对。没有新增关键事实，也可能因为提前曝光而破坏秘密。\n\n【格式】场头后列出场人物；动作行用「▲」，只写看得见、听得见的内容；情绪提示简短，放在括号里，每次台词换行都重新标注。\n\n【交付前逐集核对】\n原纲事件—正文位置—结尾状态逐项对照：必需事件是否全部写进正文；人物知情是否正确；前后场能否接上；结尾是否和原纲一致。不要用总字数合格掩盖某一集没写完。发现原纲有影响故事的逻辑缺口时标出来，只暂停依赖这个选择的部分，不擅自重构全剧。\n```\n"}, {"id": "2.8", "title": "人物五问 + 语言档案 + 信息差四工具", "chapter": "二、小说转剧本", "license": "外部·可直接用", "folder": "02-adaptation", "path": "02-adaptation/2.8-人物五问+语言档案+信息差四工具.md", "body": "\n**用法**：写正文之前，先让 AI 给主要人物填好“五问”和“语言档案”，再动笔；写完每一集用最后的自检清单过一遍。专治两个问题：人物只有形容词没有选择，以及所有人说话一个腔调。“信息差四工具”用来规划秘密什么时候让观众知道、什么时候让主角知道、什么时候公开。\n\n**来源**：[egguy886/write-screenplay-skill](https://github.com/egguy886/write-screenplay-skill) references/character-and-dialogue.md，MIT（11/02 整理人新增到收集页面）。摘编：原文以海外英文短剧为例，例子保留了思路、改成了中文场景；去掉了推荐其他仓库的说明。\n\n**提示词正文**：\n\n```\n写剧本前，先为每个主要人物填写以下两张表，写完每一集再按自检清单检查。\n\n【一、人物五问】\n1. 他想要什么（外部、看得见）：每集的目标都是它的一小步。\n2. 他需要什么（内在，自己不知道）：全剧弧光的终点，通常在全剧 70%—85% 处被逼着面对。\n3. 他相信的错事是什么：驱动他一次次做错选择；解开它就是情感高潮。把它拆成 3 个试炼点（约 25% / 50% / 80%），每次都要做一次更难的选择。\n4. 他身上最矛盾的一组特质：例如冷血总裁，手腕上却一直挂着她送的廉价钥匙扣。\n5. 他在压力下会怎么选：列 3—5 个关键选择点（标集号），人物真相只在选择里暴露。\n\n规则：\n- 人物卡里的每个形容词，都要在剧本里找到一个代价越来越大的选择来证明。写“她很倔强”没用，要写“她卡里只剩 43 块，却一分不动那笔巨款”。\n- 主角第一次出场的头 5 秒要有一个定义他的“标签动作”。好的：发完分手短信立刻拉黑、删记录、把手机扣在被子上；差的：走进宴会厅，环顾四周。\n- 对手每次出手都要让主角处境更坏，并且对手觉得自己是对的。\n- 配角每人一个功能（闺蜜：替主角说出心里话、撞破秘密；损友：替观众吐槽男主），功能重叠的合并。\n\n【二、语言档案（让每个人说话不一样）】\n- 句长节奏：例如总裁短句、陈述句、很少提问；反骨女主语速快、紧张时越说越长。\n- 用词范围：他习惯用哪一行的词（金融、法律、游戏、农村俚语等）。\n- 口头禅：不超过 3 个。\n- 绝不会说的话：例如总裁不说“请”（直到道歉那一集）、不解释自己；女主不叫他的名字（直到被逼说出口那一集）。\n- 说谎或心虚时的破绽：例如停顿后声音放轻、补充太多细节。\n检验法：遮住说话人名字读一页对白，能认出是谁在说吗？认不出就改。\n\n【三、对白规则】\n1. 每句台词都在对另一个人做一件事（逼问、引诱、拒绝、试探）；表演提示写这个动作，不堆情绪形容词。\n2. 人物很少直说真心；台词和心里话完全一样时，这句通常太直白。\n3. 背景只在冲突中当武器用时才说出来（“你收了我的钱，喊了我三个月宝贝”——既是交代，也是将军）。\n4. 一句话一个意思，删掉寒暄、复述、“我明白你的意思”。\n5. 潜台词要能演：给演员一个可做的动作（“把杯子推回去”），比“内心挣扎”有用。\n6. AI 视频限制：一句台词尽量短；避免两人抢话、同时说话。\n\n【四、信息差四工具】\n- 悬疑：观众知道得比人物少 → 好奇，用于集尾抛问题。\n- 惊奇：观众和人物都不知道 → 一次性冲击，用于反转，每卷 1—2 次。\n- 戏剧反讽：观众知道得比人物多 → 紧张、爽、等爆破，是言情和马甲剧的主发动机：观众先知道真相，看主角一次次差点穿帮。\n- 悬念：观众知道危险将至 → 焦虑，用于倒计时、门外脚步声。\n每个秘密提前排好三个时间点：观众知道 → 主角知道 → 公开；爆破点放在全剧最需要能量的位置（中点、至暗时刻）。\n\n【五、每集自查】\n- 主角本集做了至少一个有代价的选择吗？\n- 每个有台词的人，说话方式和语言档案一致吗？有人说了他“绝不会说”的话吗？\n- 有没有台词只在交代信息、没有在冲突里当武器？\n- 本集结束时，谁知道什么，和上一集相比变了吗？\n```\n"}, {"id": "2.1", "title": "通用", "chapter": "二、小说转剧本", "license": "内部 1.0", "folder": "02-adaptation", "path": "02-adaptation/2.1-通用.md", "body": "\n**用法**：见上方 1.0 原用法。通用场景首选。\n\n**提示词正文**：\n\n```\n【角色设定】\n你是一个拥有丰富经验的“竖屏真人AI短剧编剧”。你的核心能力是将小说文本高效、精准地转化为画面感强、节奏紧凑、可直接用于指导拍摄的短剧剧本。\n\n【任务目标】\n我将提供一段小说内容，请你严格按照以下【改编准则】和【剧本格式规范】，将其改编为竖屏短剧剧本。\n\n【改编准则】\n1、剧情与台词忠诚度：绝对不改变原小说的核心剧情，单集字数：每集字数控制在1200-1500字左右。\n2、人称代词替换：除了台词对话中保留“你、我、他”，在所有剧情动作或环境描述中，\n   必须将“你、我、他”全部替换为对应的具体人物名称，避免指代不清。\n3、视觉化与动作化：\n   - 将原小说中的人物形象描写、心理活动刻画，转化为具象的“人物台词”或“肢体动作”。\n   - 动作要求干脆利落。\n   - 【例外】当人物处于“被注视/被抛弃/隐忍沉默”等极度内敛的情绪状态时，\n     优先使用“人物OS”替代连续肢体动作描写，避免出现大段无台词静默动作堆砌。\n   - 【例外】每场结尾的落点动作，若前文已有充分情绪铺垫，允许仅用1-2个“▲”完成收束，\n     不必将所有肢体反应逐一罗列。\n   - 【可拍摄性原则】所有“▲”引导的动作必须能被镜头直接捕捉。禁止写入：\n     ✗ 心理状态描述（如“紧绷的神经断裂”“她彻底绝望”）\n     ✗ 抽象比喻（如“心脏像被大手捏碎”“痛如刀绞”）\n     ✗ 不可见的内部生理感受（如“胸口一阵绞痛”“她感到天旋地转”）\n     以上内容若需表达，必须转化为人物OS/VO，或转化为可拍摄的外部表现\n     （如“她捂住胸口，冷汗滑落”“她脚步踉跄，扶住墙壁”）。\n4、精简环境描写：环境描写要少而精，只需用概括性、可视化的语言交代清楚必要的时间、\n   地点和氛围，保证导演看一眼就能知道如何布置场景。\n5、直击冲突，省略繁琐：无需事无巨细地描述事件过程，直接抽取事件的“关键点”。\n   例如主角去聚会，只需直接切入聚会现场的矛盾冲突，省略打车、找房间、问路等与主线无关的过场戏。\n6、场景转换即换场：一旦人物发生物理空间的转移（如从门口走进餐厅），必须独立拆分为新的一场戏。\n7、动作描写的精简原则：\n   - 每场戏结尾的连续纯动作描述不得超过3行（以“▲”计）。\n   - 若超过3行，必须将其中至少1行转化为人物OS/VO，或直接删除次要动作。\n   - 优先保留“引发下一情绪转折”的关键动作，删减“姿态维持/情绪酝酿”的过渡性动作。\n8、关键动作的“一动作一情绪”原则：\n   - 每个“▲”引导的动作，必须直接推动情绪变化或剧情转折。\n   - 禁止连续使用多个“▲”描述同一情绪层级下的细微动作变化。\n   - 示例：\n     ✗ 禁止：▲他攥紧拳头。▲他手背青筋暴起。▲他死死盯着她。\n     ✓ 改为：▲他攥紧拳头，手背青筋暴起，死死盯着她。（合并为一个爆发点）\n     或：▲他盯着她的背影消失在门外。傅宴深 os：你竟然真的走了。（用OS替代第二动作）\n9、目前剧本有问题需要修改，1-1 日 内 陆家土屋-里屋\n人物：陆骁\n▲陆骁猛然睁开眼，大口喘气，环顾发黄的报纸和漏风的茅草顶。\n陆骁 os：我竟然真的回到了命运的分水岭——一九八三年。\n陆念念 vo（带哭腔）：妈妈，我肚子好饿，里面像有虫子咬。\n苏清影 vo（极低、慌乱）：嘘！喝口水就不饿了。千万别把你爸吵醒，不然又要挨打。【这一段大量的OS跟VO，对应的视频画面是什么？需要修改，不能再出现类似情况。】陆骁（语气坚定）：没有龙哥。昨天是我混蛋，从今天起，我绝不再碰一下牌，绝不再让你们挨饿。【这种台词太长了，可以断句或者精简来完成。台词长了，语速就会很快。甚至这句话讲不完就结束了。深度学习一下方法，进行修改，现在我告诉你对于处理长台词的方式有2种:\n第一种方法:精简台词，将以下案例傅宴臣说的话在不改变核心要义的原则下，强行缩减\n台词数量至15字\n原文:傅宴臣(语气慵懒，透着寒意):二婶，看来您的养女不仅需要回炉重造金融学，\n还需要去法务部喝杯茶，解释这份内部报告的来源。\n修改后:傅宴臣(语气慵懒，透着寒意):二婶，看来你养女得重学金融并交代报告\n来源。\n第二种方法:不改变原有台词，将原台词进行断句\n原文:傅宴臣(语气慵懒，透着寒意):二婶，看来您的养女不仅需要回炉重造金融学，\n还需要去法务部喝杯茶，解释这份内部报告的来源。\n修改后:傅宴臣(语气慵懒，透着寒意):二婶，看来您的养女不仅需要回炉重造金\n融学\n傅宴臣(语气略带微怒):还需要去法务部喝杯茶，解释这份内部报告的来源。\n深度学习一下以上信息\n注意转场的准确性！比如场景本来是在屋内，随着剧情跑到了屋外或别的地方，那就需要分新的场景！而不能写在一个场景下！\n特别注意！绝对不能有关于警察执法、政治、色情、血腥暴力、外国角色、抽烟等违禁元素！涉及到这些元素的要进行修改和删除！\n\n【正文书写排版】\n1.场次标题：必须清晰标明每集的场次、时间（日/夜/黄昏）、室内/外、场景名。\n【注意】场景名称全剧必须统一（如前面叫“小明家-卧室”，后面绝不能写“大明家-卧室”）；若有特殊天气（雨、雪、大风），需在此列出。\n2.出场人物：列出该场所有出场人物，名字统一。主要人物外的群演（宾客、保安等）需标注数量和身份，有台词或动作的用甲、乙、丙区分。\n3.标明每个场景第场景内容，不得以“同上”、“同上场景”之类的词代替\n4.动作、台词、场景必须单独成行。\n5.人物台词的语气、表情和情绪，放在人物名字后的括号内。\n括号内规则： 括号（）内内容即为 “动作 + 情绪” 或 “单一动词/形容词”。\n动作诱导： 优先标注能揭示角色动机的肢体语言（如：猛地拉近、死死盯住、推开、侧头），AI 将根据此指令生成对应的表情与体态。\n标注规范：\n独立性： 只要台词换行，即便属于同一人物的连续说话，也必须重新标注。\n去重优先： 同个角色的同一场戏，标注词严禁重复，应体现情绪与动机的递进（例如：从“冷笑”递进至“阴寒”或“沉稳”）。\n6.动作描写一律使用“▲”单独成行，内部感受一律转化为OS/VO。\n7.特殊视听语言标记：\nos：内心戏/内心独白（例：沈初晴 os：...）。内心独白与实际台词并存时，各占一行。\nVo：画外音，人未到声先到，或打电话、短信提示音等只能听到声音时使用（例：萧南 vo：...）。\n8.闪回/梦境：标明【闪回开始】，结束时标明【闪回结束】。\n\n【格式参照示例】\n第1集\n1-1 日 内 将军府-产房\n人物：长公主、沈初漓（婴儿）、沈初莹（婴儿）、苏嬷嬷、朱嬷嬷、沈初言、太医、下人*5\n\n▲晴空万里，天空光打雷不下雨。\n▲镜头拉近对准将军府，一路探到床上正在生产的长公主。\n▲产婆下人们手忙脚乱地乱窜。\n长公主（虚弱地）：孩子……我的孩子……\n苏嬷嬷（焦急）：公主用力啊！\n【闪回开始】\n▲长公主站在城墙上，望着远方。\n长公主 os：我定要守住这份家业。\n【闪回结束】\n▲（场景互切/）\n\n1-2 日 外 将军府-大门\n人物：陈将军\n\n陈将军 vo：生了吗？！\n下人vo：生了！生了！\n\n（本集完）\n```\n"}, {"id": "2.5", "title": "单集剧本格式 + 质量要求", "chapter": "二、小说转剧本", "license": "外部·可直接用", "folder": "02-adaptation", "path": "02-adaptation/2.5-单集剧本格式+质量要求.md", "body": "\n**用法**：作为写单集的格式规范发给 AI，可以和 2.1 对照着挑。它比 1.0 多了三样：本集爽点、前情提要、集尾钩子。\n\n**来源**：[0xsline/short-drama](https://github.com/0xsline/short-drama) SKILL.md 的 /episode 部分，MIT（1.1k star）。已去掉原文 emoji 和文件保存指令；原文动作符号是「△」，保留未改。\n\n**提示词正文**：\n\n```\n请按以下格式写第{N}集剧本：\n\n# 第{N}集：{集标题}\n> 本集关键词：{3个关键词}\n> 本集爽点：{爽点类型}\n> 前情提要：{上一集结尾悬念，1-2句}\n\n## 场次一\n场景：内景/外景 · {地点} · 日/夜\n出场人物：{人物列表}\n\n△ （全景）{场景描写，交代环境}\n△ （中景）{人物动作描写}\n{角色名}（{语气/动作指示}）：“{台词}”\n{角色名}：“{台词}”\n△ （特写）{关键细节描写}\n音乐提示：{音乐氛围描述}\n\n## 场次二 ...\n## 场次三 ...\n\n> 本集钩子：{悬念描述}\n> 下集预告：{下一集核心看点，1句}\n\n质量要求：\n- 每集 3-5 个场次\n- 每集 800 字以上\n- 景别提示：全景、中景、近景、特写（至少使用 3 种）\n- 台词带语气或动作指示\n- 每集结尾必须有悬念钩子\n- 第 1 集必须在前 30 秒（约前 3 段）抓住观众\n- 付费卡点集结尾必须制造强悬念\n\n上下文连贯性：\n- 写第 N 集前，回顾前面已完成的集数内容\n- 确保角色行为与人物设定一致\n- 确保剧情推进与分集目录一致\n- 如发现前后矛盾，主动提醒\n```\n"}, {"id": "2.13", "title": "连载写作记忆：每集写之前注入的约束 + 伏笔表", "chapter": "二、小说转剧本", "license": "外部·可直接用", "folder": "02-adaptation", "path": "02-adaptation/2.13-连载写作记忆.md", "body": "\n**用法**：用 AI 一集一集往下写长篇时，最常见的问题是人设前后不一、伏笔埋了忘了收、死了的人又出现。这条的做法是：给项目建几份固定的“记忆”（角色档案、世界观、剧情摘要、伏笔表），每写一集前把它们和硬性规则一起贴给 AI，写完再更新。和 3.17（连续性检查）的区别：3.17 是写完后查穿帮，这条是写之前就防住。\n\n**来源**：[mengxiujie/ManjuForge](https://github.com/mengxiujie/ManjuForge) SKILL.md “连载记忆机制”，MIT-0（11/09）。摘编：原技能用七个文件存在本地，这里改成可以直接粘贴的形式。\n\n**提示词正文**：\n\n```\n（每写一集前，把下面的内容填好，连同本集大纲一起发给 AI。）\n\n【角色锁定】\n（粘贴角色档案。分两部分：）\n- 身份不变量（锁死，只在重大转折时改）：外貌锚点、性格内核、台词风格；\n- 状态变量（每集更新）：当前情绪、服装、伤势、关系阶段。\n\n【世界观锁定】\n（粘贴：时代、规则、势力。）\n\n【前情提要】\n（粘贴最近 5 集的剧情摘要。每集摘要七项：核心事件、情绪曲线、新伏笔、人物变化、主线 A 进度、主线 B 进度、结尾悬念。）\n\n【伏笔表】\n编号｜类型｜埋设集｜重要度｜当前状态（已埋 / 推进中 / 已回收）｜回收集\n\n【硬性规则】\n- 角色性格、说话风格、关系不得与档案矛盾；\n- 已死角色不可复活（除非世界观允许）；\n- 已揭露的伏笔必须有回收或明确延续；\n- 时间线不得跳跃或矛盾；\n- 新伏笔在摘要中记录，并登记到伏笔表（编号、类型、埋设集、重要度）；\n- 伏笔回收必须和埋设内容一致，允许升级、禁止降级；埋设后至少隔 2 集才能回收。\n\n【写完本集后请输出】\n1. 本集剧本；\n2. 更新后的剧情摘要（七项）；\n3. 伏笔表的变动（新埋、推进、回收）；\n4. 角色状态变量的变动；\n5. 如果有关系变化，写出谁和谁、从什么关系变成什么关系、由哪个事件造成。\n\n（每写 5 集，把角色档案、世界观和全剧主线重新整理一遍，作为新的总纲。）\n```\n"}, {"id": "2.3", "title": "长篇（3000 字以上）", "chapter": "二、小说转剧本", "license": "内部 1.0", "folder": "02-adaptation", "path": "02-adaptation/2.3-长篇.md", "body": "\n**用法**：适用于长篇小说、原文 3000 字以上的情况。\n\n**提示词正文**：\n\n```\nRole：殿堂级短剧主编（实战·复合演绎定轨版 V45.0）\n你是精通视听美学、节奏与极简排版的殿堂级编剧。你的最高信仰是：【1:1走完剧情沙盘防斩尾】、【高维折叠及前三集保全】、【微动作防站桩】、【彻底封杀文学病句】、【闪回现场演绎】。\n你深知流水线标准：剧本绝不是写小说，写了摄像机拍不到的内容就是车祸！必须绝无废话、全是动作对峙。\n\n🔴 严苛短剧工业法典（九大红线，触之即死！）\n1. 🎬 【核心升维】复合演绎型闪回 ＆ VO引子法则：\n终结PPT默片：交代前史的闪回，绝对禁止变成全员哑巴、只靠主角VO配音解说的“幻灯片”！\nVO引人入戏 ＋ 现场真刀真枪：主角VO只作为开头交代年份/背景的【引子】，或转折时的【桥梁】。闪回场景内部的NPC、过去的自己，必须亲口说出当年的台词（爆出绝情狠话/交锋）！配合肢体动作，将当年的绝望现场原汁原味地演出来！\n2. 📷 摄像机的客观绝对外化（防文学病句）：\n▲ 后面只能写摄影机能拍到的物理动作和视觉画面！\n【全网最高排雷】：永久封杀“前世的惨剧在脑海中闪过”、“心里想着”等文学主观病句！摄像机拍不到脑海！ 所有心理惊惧必须转化为纯物理动作（如：▲瞳孔骤缩/指甲掐出血），然后直接切入【闪回】展现，绝不允许用“脑海闪过”敷衍！\n3. 🌍 高维信息折叠 ＆ 前三集扩容控字：\n字数铁律：严查全篇！常态单集控在 800-1200 字符！第1、2、3集特批纵深，但也绝对死死卡在 1300 字符以内！！\n信息折叠：严禁抄写大段世界观/身份设定！必须将百字设定折叠提炼为【极简名词/名头】，揉进主角VO或旁人的惊呼台词中，一招解构时地人设！\n4. 🗺️ 剧情映射沙盘 ＆ 反斩尾绝杀装甲：\n沙盘导航定位：第一步必列“事件1、2、3...”，正文必须1:1走完！哪怕字数快爆，也去压缩中间平淡过场，【绝对禁止】砍掉最后半段老底剧情！\n结尾靶点死锁：结局必须死死卡在原著本章的【最后一句话或最后动作】上！精准定格打板，严禁提前太监，严禁脑补生造后续！\n5. ✂️ 原味纯提纯 ＆ 极简破站桩（防干聊抄书）：\n留原味不生造：最大化提取原著台词精髓，绝不瞎编，但要用手腕榨干原著水词！\n50字斩 ＆ 微动作断句：任何发言（含VO）绝不超50字/两行！长话必须物理斩断：“原声短句 + （冷笑/摔杯/断裂等外化微动作） + 余下原话”。死守动作张力防站桩聊天！\n6. ⏳ 黑洞蒙太奇 ＆ 出场名单置顶：\n保留区：装X交锋、身份揭秘、首尾大戏。多用 【特写：信物/表情】。\n黑洞压缩区：赶路、啰嗦解说，残忍切掉！用一行 ▲ 蒙太奇流转瞬间跨越！\n强制罗列：标题下方强制显式列出场全员名单！绝不可省！\n7. 📐 动作绝对隔离 ＆ 阅后即焚排版：\n角色名后只跟台词或 (情绪)。客观物理动作必须 ▲ 【另起一行独立】！\n【阅后即焚死令】：输出最终正文中，必须彻底焚烧切除所有模板里带 (注：) 的编剧提示语，交出如盲盒般的纯净剧本！\n8. 🔀 物理连切转场起手式：\n进任何回忆前，必有 ▲突感耳鸣/死死盯紧某物 等极致外化的客观物理驱动！\n⚙️ 编剧双步工作流（每次强制执行）\n只要收到小说素材，严格按两步依次输出：\n\n第一步：【流水线查漏 ＆ 剧情沙盘靶点锁定】（非正文区）\n集数扩容与防雷发誓：指出第几集！1-3集开启【保全设定且死控1300字内】！若是首集发誓：“闪回必定是VO做引子+当事人真实台词对峙！绝不搞默片配音！绝不写‘脑海闪过’等文学病句！”\n信息折叠清单：指出原著核心设定，发誓折叠进台词。\n【防太监导航：剧情映射沙盘】：逐条列出“事件1...2...3...”，发誓1:1全走完！\n【防斩尾：原著末尾靶点提取】（最高警戒）：强制逐字摘录原著最后一句话/动作定海神针，两头堵死绝不漏底牌！\n去括号防站桩宣言：发誓台词全嵌动作打断、彻底删光正文提示格式。\n第二步：【正文剧本创作】（工业级视听排版）\n（绝对不准带(注)说明入正文！外化客观，VO做引，原境重现！）\n\n✍️ 剧本格式模版：\n\n第X集\nX-1 日/夜 内/外 场景名称\n人物：[在此强制列出所有出场角色]\n\n▲极少且绝对摄影机能拍到的客观肢体环境起手。\n（回忆起手必须全视觉外化！严禁写“在脑海中闪过”）\n▲张三瞳孔骤缩/死死捏紧病危通知单。\n【闪回开启】\n主角 VO：（低沉娓娓道来）交代年份与背景的引子叙述。（如：1993年，我女儿坠井，换来的却是一张血型不符的化验单！）\n▲客观起因物理画面。\n过去的反派：（绝情狠话）还原当年最刺痛人心的原声台词！\n▲客观背叛极惨画面。\n过去的主角：（绝望对峙）还原当年场景的台词反击或嘶吼。\n主角 VO：（极点沉重）作为桥梁承接惨烈后果的背景音收尾。\n【闪回结束】\n▲现实中猛地大口喘息（客观承接动作）。\n▲（时空流转）接下来的干瘪剧情全用蒙太奇快切。\n角色A：（情绪）原声提纯短句……（指尖掐出血/猛退半步等极具视觉冲击的物理微动作）高维折叠信息的杀伤短句！\n▲纯视觉外化的动作交锋折行。\n【特写：带出核心设定的信物/微表】\n众人：（震撼）点出设定的台词。\n\n角色A：（压迫感）完美复刻第一步锁定的【结局原句】，粗口也原封不动！字字定音！\n（本集完）\n\n如果你彻底明悟，请回复：“实战演绎流水线大总编已就位！我已彻底焊死V45.0大成法典！我已检索确认全体高压约束完好无损：【前三集扩容1300上限】、【剧情沙盘导航123】、【反斩尾结局靶点死锁】、【折叠设定信息】、【彻底粉碎动作防站桩】、【客观折行排版】、【提纯原味台词】、【人物名单必写】、【百分百切除阅后即焚备注指导】，九星连珠全线运作！\n同时，我庄严接受双重视听核心升维：第1，【绝对斩杀‘脑海闪过/心里想着’等文学病句】，全部转化为瞳孔、关节肌肉的外部机械反应切画面！第2，【终结闪回幻灯片化】，回忆中除了VO作为年份和情绪引子外，里面的角色必须活过来！亲口念出当年的绝情台词、咆哮出冲突，现场演绎当年之恨！请发送原著，看我毫秒不差、极具张力的殿堂级完美转化！”\n```\n"}, {"id": "2.4", "title": "单集剧本标准模板（含本集物证、结算、断章）", "chapter": "二、小说转剧本", "license": "外部·可直接用", "folder": "02-adaptation", "path": "02-adaptation/2.4-单集剧本标准模板.md", "body": "\n**用法**：写单集前，让 AI 先填完「集头信息卡」再写正文。和 1.0 相比，多了几项 1.0 没有的硬约束：本集物证、质疑者配角、主角主动目标、本集结算、时长倒推。可以和 2.1 一起用：2.1 管格式，这条管戏。\n\n**来源**：[short-drama-factory](https://github.com/lixiaoxiao9888-create/short-drama-factory) templates/episode-format.md 与 SKILL.md，MIT（收集人提供）。摘编：去掉了机检编号（E1~E26），保留规则本身。原模板用「△」标动作，这里统一改成我们用的「▲」。\n\n**提示词正文**：\n\n```\n请按以下模板写第【XX】集。先填集头信息卡，再写正文。\n\n第【XX】集：【集名/核心爽点标签】\n【黄金前3秒钩子】：六母型之一（生死绝境/极端羞辱/身份暴涨/物证背叛/规则悬念/萌系治愈反差）\n【冲突形态】：对话型 / 行动坚持型 / 身份错位型 / 关系情感型 / 规则谜题型 / 混合\n【情绪流变】：A ➔ B ➔ C ➔ 绝命断章\n【本集物证】：1~2 个贯穿本集的物件（碗/账本/群聊截图/到账页等，特写好拍，情绪落在物证上）\n【质疑者配角】：本集替观众说狠话、发问的人（无则填“无”）\n【对手要什么】：反派本集的即时目标和筹码\n【本集主角主动目标】：主角本集要做的选择或行动（不能只是被动挨打）\n【本集改变了什么】：信息/关系/资源/位置/危险，至少一项可见变化\n【本集结算】：主角本集的可见反将 + 反派为本次施压付出的可见代价\n【本集时长】：__ 秒（按“纯台词字数 ÷ 4.5 字/秒 + 动作行时长 + 留白”倒推，不许虚标）\n\n[场景]：内景/外景・地点・日/夜（全集不超过 2 个场景）\n[人物]：名（状态标签）、名（状态标签）\n\n▲ 特写/中景：只写镜头拍得到的强视觉动作。\n角色名（画面词｜语气词）：台词。\n\n写作规则：\n1. 强画面支撑：每 2~4 句对白必须穿插 1 条 ▲ 动作行，连续纯对白不超过 6 行。每条 ▲ 必须命中三类之一：①物理结果与视觉奇观；②身份反差与手头忙活；③物证亮牌与肢体对抗。不许单写“眼神微动”“微微一怔”“推了半寸”这类拍不出效果的微动作。\n2. 神态短语用“画面词｜语气词”：摄像机拍得到的写在左边（如“一把推开主刀”），麦克风录得到的写在右边（如“厉喝”）。\n3. 快慢变速：每场对白交替使用 3~6 字快刀句和 8~16 字大白话算账句；单句一口气不超过 25 字。\n4. 大白话直给：凡亮出物证，同一轮对话里必须用大白话说出结论；凡出现专业术语或设定词，当句翻译成后果（多少钱、判几年、谁死谁活）。\n5. 内心独白最多 1 处、不超过 25 字，只写“具体的账”，不交代设定；旁白最多 1 处、不超过 12 字；开头 3 秒和断章处禁用。\n6. 结尾单列：【本集断章卡点】：画面停格描述。（黑屏：下滑立即解锁第XX集）\n```\n"}, {"id": "2.6", "title": "三条短指令（大纲 / 分镜表 / 风格）", "chapter": "二、小说转剧本", "license": "外部·仅参考", "folder": "02-adaptation", "path": "02-adaptation/2.6-三条短指令.md", "body": "\n**用法**：需要快速出一版时用，换掉里面的题材和设定即可。\n\n**来源**：[塔猴 · AI观察者](https://www.tahou.com/article/207771002639805445)，文章版权归作者。\n\n**提示词正文**：\n\n```\n【大纲】以古装武侠为背景，写AI漫剧三幕式大纲，包含女主隐藏杀手身份、与暗卫丈夫相爱相杀的核心设定，每幕3个关键情节，符合短剧6步节拍。\n\n【分镜表】将以下剧本转化为分镜表格，包含景别、运镜、台词、时长，遵循30度原则（相邻镜头角度差≥30°），节奏控制在单集2分钟内。\n\n【风格指定】生成一个3分钟的都市复仇短剧剧本。风格类似抖音爆款。包含30个分镜，重点刻画眼神特写、豪车进场、打脸情节。提供每个分镜的详细画面描述。\n```\n"}, {"id": "3.26", "title": "台词字数预算 + “塞不下”怎么改 + 能不露嘴就不露嘴", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/dialogue", "path": "03-revision/dialogue/3.26-台词字数预算+塞不下怎么改+能不露嘴就不露嘴.md", "body": "\n**用法**：写对白、压对白、给分镜表定时长时用。先按语速算出这一集（这一段）能放多少字，超了就砍台词，不加快语速。第三部分是口型的取舍：先问这一镜能不能不露嘴（侧脸、背身、切走、改成 OS/VO），能就不做口型。和 3.11（独白与旁白规程）、3.24（台词引擎）、6.13（对白时长预算）配合用。\n\n**来源**：[liuxiao20051106-prog/ai-manga-drama](https://github.com/liuxiao20051106-prog/ai-manga-drama) references/craft-dialogue-voice-and-sound.md 和 craft-short-form-narrative.md，MIT。摘编；原文面向漫剧，口型部分按真人短剧的情况做了提醒。\n\n**提示词正文**：\n\n```\n请按以下规则检查并修改这一集的对白和旁白。\n\n【一、先算字数预算】\n中文配音常见语速约 4–5 字/秒（情绪激动可以稍快）。\n30 秒 ≈ 90–130 字，60 秒 ≈ 180–250 字（含旁白和 OS）。\n先算出这一集（或每一段）的有效台词字数上限，再开始写。\n交给画面的信息越多，留给台词的字数就越少：能用一个动作、一个道具、一个表情说清的，不写进台词。\n\n【二、超了怎么改】\n- 砍台词，不要加快语速（语速一快，情绪就没了）；\n- 一句只放一个信息：“因为三年前那件事，所以我一直不敢回来”拆成两句，中间给一个画面；\n- 不写解释性台词：人物不解释自己为什么这么做，让画面和后果说明；\n- 每句要念得顺，念不顺就改，不靠配音硬扛；\n- 每 2–3 句之间留半拍到一拍的空隙，给音效和情绪留位置。\n\n【三、口型怎么取舍（先问能不能不露嘴）】\n1. 不露嘴：侧脸、背身、镜头切到听者或道具，或者把这句改成 OS / VO —— 代价最低，也不露破绽；\n2. 正脸说话的中近景，靠模型自带的口型能力；\n3. 必须看嘴的特写，才考虑用专门的口型工具。\nOS / VO 一律不做口型，也不要让画面里的人物张嘴。\n提醒：真人短剧观众对口型比漫剧更敏感，关键对白镜头不要全部用不露嘴的方式回避。\n\n【四、常见问题】\n| 症状 | 原因 | 改法 |\n| 台词塞不下 | 超过字数预算 | 砍台词，不加速 |\n| 听着假 | 每句都是完整书面句 | 改口语，加停顿、语气词 |\n| 口型对不上 | 时长估错，或这一句本不必露嘴 | 先按字数定时长；或改成 OS/VO、切到听者 |\n\n【输出】\n先给出预算（总时长、字数上限、现有字数），再逐句列出：原句 → 改后 → 改法（砍 / 拆 / 改口语 / 改 OS/VO / 切到听者）。\n```\n\n---\n"}, {"id": "3.15", "title": "台词效率逐句评分（功能分 F / 情绪分 E，低于 5 删、5—7 重写）", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/dialogue", "path": "03-revision/dialogue/3.15-台词效率逐句评分.md", "body": "\n**用法**：台词“句句都在说事，但整场很拖”时用。把一集或几集剧本和这段一起发给 AI，它会逐句打两个分，按门槛删、改，最后交完整改稿和评分表。适合交稿前压字数、提密度。和 3.9（A—B—C 试删）的区别：3.9 按段落试删，这条细到每一句；和 3.12 的区别：3.12 找车轱辘话，这条连“有用但不够有用”的句子也会处理。\n\n**来源**：[艾玛短剧 · 编剧 Skills](https://github.com/adoria111/emma-screenwriting-skills) skills/em-dialogue-efficiency，MIT（收集页面，11/02 继续深挖）。摘编：原技能有大量针对作者某部剧的修改记录（女王穿越、家暴戏等），这里只保留评分规则和能通用的几条经验。\n\n**提示词正文**：\n\n```\n你是短剧台词主编。请对指定范围内的每一句对白（包括内心 OS、电话、画外音、闪回）打分并删改，交付可以直接用的正文。不默认全员愤怒、短句或金句，人物声音按原稿。\n\n【评分口径】\n- 功能分 F（满分 10）：是否改变接下来的行动、决定、筹码、关系或后果；补充当前需要的世界观；提供真正的新信息；明确人物下一步做什么。\n- 情绪分 E（满分 10）：是否让观众感到人物从一个状态转到另一个状态，比如自信到破防、压抑到开心、得意到嫉妒、戒备到接受照顾。只写“愤怒地”、加感叹号、重复说很难受，都不算转折。\n- 按上下文的“净贡献”打分：对话、动作或前一场已经传达过的内容再说一遍，不能因为字面上“有信息”给高分。删掉它不影响任何人的认知、行动或情绪，就是低分。\n- 处理分 S = F 和 E 中较高的一个（允许纯功能句或纯情绪句成立）。\n- S 低于 5：删除；5 到 7 之间：从原有冲突出发重写；7 及以上：保留有效部分。\n\n【步骤】\n1. 先看整场戏值不值得写：这场戏里正在发生什么、谁阻止谁、结果改变了谁？如果整场只是手续、解释或准备过程，先指出来，不要靠删字假装修好。\n2. 按集、场、说话轮次编号；同一轮里作用不同的句子拆开打分。\n3. 每句给 F / E / S 和一句证据，再给处置。\n4. 把改动写进正文，处理好前后衔接：删掉“是”“好”“为什么”之后，不能留下没有对象的回答；删掉唯一必要的事实时，说明由哪句已有台词或哪个可见动作接住，不能让人物无缘无故就知道了。\n5. 连读成稿，检查人物声音、攻防推进、情绪转折、集尾和下集第一句。\n\n【特别注意】\n- 删掉“我能做这个，但那个需要人教”式的简历解释，以及“我教你、先填表、按工时算、好的谢谢”这类成串手续话；手续只有在改变利益、风险或当场选择时才值得说。\n- 不要用完整的礼貌问答拖慢反击。\n- 不要为了缩短而删掉亲情、羞辱后的爆发或对手破防——情绪有效本身就合格。\n- 有情绪升级、并和具体动作相连的重复可以保留（例如“我现在过去！我现在就过去！”）。\n- 求救、争执不必把话说完整，被打断能让压迫继续发生。\n- OS 可以承担“她现在经历了什么、想怎么办”，但不要复述画面里已经清楚的过程。\n- 不能为了提分改变已经定下的剧情、人物动机、证据和秘密揭示顺序；不能塞新阴谋、新履历硬造“信息量”。\n\n【交付】\n1. 评分表：编号｜场次｜说话人｜原句｜F｜E｜S｜理由｜删除 / 重写 / 保留｜新句（或删除后由谁承接）；\n2. 完整修改稿；\n3. 处置数量统计（删几句、改几句、留几句）。\n```\n"}, {"id": "3.12", "title": "对白诊断：车轱辘话判断", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "status": "二轮实测：已用于生产", "folder": "03-revision/dialogue", "path": "03-revision/dialogue/3.12-对白诊断.md", "body": "\n> **实测（11/03 第二轮）：已用于生产。** 已并进 6.0。\n\n**用法**：一场戏成立，但台词来回绕、原地打转时用。它的价值在于分清「该删的重复」和「该留的重复」，不会把所有直白、喊满的台词都当成坏台词删掉。和 3.3 的区别：3.3 按七个维度重构台词，这条专门判断哪些台词在空转。\n\n**来源**：[艾玛短剧 · 编剧 Skills](https://github.com/adoria111/emma-screenwriting-skills) skills/em-dialogue，MIT（收集页面）。摘编。\n\n**注意和 1.0 的一处差别**：原技能默认把同一角色中间没被打断的连续几句合成一段、只写一次人名；1.0 的 3.1 要求每次台词换行都重新标注括号。用的时候按我们 1.0 的格式来，提示词里已经写明。\n\n**提示词正文**：\n\n```\n请诊断这场戏的对白（只诊断，先不要给完整改写稿；我确认后再改）。\n\n【三个判断问题】每句台词都问：\n- 特定性：这个人为什么此刻对这个对象说这句？\n- 目的性：他希望对方听完怎么回应？\n- 必要性：删掉会损失什么信息、关系变化或情绪体验？\n\n【车轱辘话的定义】不是字面重复，而是：同一信息或态度 + 同一策略 + 同一力度 + 没有新的剧情、情绪、关系或表演后果 = 戏原地不动。\n\n【分别判断三种作用】（不要求每句三样都有）\n- 剧情作用：新信息、新筹码、新策略、新决定或新后果；\n- 情绪作用：蓄压、释放、宣判、站队、替观众出气、关系结算；\n- 表演作用：爆发、停顿、反转、崩溃、冷下来决裂、类型卡点。\n\n【直白喊情绪的台词分三种】\n- 有效爆发：第一次公开反抗、情绪结算、划清阵营，并且改变了关系或行动——保留；\n- 纯宣泄：没有新信息，但承担唯一的情绪峰值或演员爆点——保留核心句，检查后面是否需要落到行动上；\n- 无效空喊：没有铺垫、不是新的情绪阶段、对方可以原样回嘴、没有后果——删除、合并或挪到真正的峰值。\n\n【步骤】\n1. 先概括场景契约：谁为了什么对谁说话、对方怎么抵抗、这场戏最终改变了什么；列出必须保留的事实、动作、关系、情绪节点和结尾。\n2. 把同功能、同力度的请求、拒绝、指责、威胁、背景复述归成一组，指出它为什么停滞。\n3. 目的相同但策略、压力、意义发生变化的重复要保留，说明它带来了什么新作用。\n4. 改写时让每一轮回应上一轮、并给下一轮制造新麻烦（新筹码、反制、被迫选择或具体代价）；背景信息要作为冲突的武器出现，不要让人物停下来念履历。\n\n【不能做】不新增事实、伤害、证据或往事；不把所有人改成同一种简短、会说金句的声音；不把所有高强度表达都降成克制冷感；不删掉让背叛、拒绝、动手成立的情绪台阶。\n\n【括号提示】只在会改变一句话读法的地方加（哭腔、强压怒火、讥讽、哀求、突然转冷等），平铺直叙或紧邻动作已经说明白的不加。格式按我们的规范：每次台词换行都重新标注括号。\n\n【输出】场景契约 / 重复链（哪几句、为什么停滞）/ 应保留的重复及理由 / 优先修改建议。\n```\n"}, {"id": "3.14", "title": "对白与潜台词：五步改法", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/dialogue", "path": "03-revision/dialogue/3.14-对白与潜台词.md", "body": "\n**用法**：台词生硬、人物在轮流交代背景时，把这段和要改的那场戏一起发给 AI，让它直接给可替换的对白。和 3.3 的区别：3.3 是七个维度的全面诊断，这条只做一件事——让每个人说话时都在“要”点什么。\n\n**来源**：[geslie1/kunka-screenwriting-master](https://github.com/geslie1/kunka-screenwriting-master) plugins/kunka-screenwriting/skills/kunka-dialogue，MIT（11/02 整理人新增到收集页面）。原文照录，只把开头改成了指令语气。\n\n**提示词正文**：\n\n```\n请润色下面这场戏的对白。先弄清台词正在做什么：争取、试探、回避、安慰、拖延、逗弄，或共同维持某个日常仪式。不是每句都需要隐瞒，直说也可以很有力量。\n\n【修改顺序】\n1. 标出不能丢的信息、关系状态和我指定要保留的句子。\n2. 为各人找出此刻想从对方获得的反应。调整说话策略，避免大家只负责轮流交代背景。\n3. 区分声音：关注什么、习惯何时回答、用什么比喻、是否纠正别人。词汇和节奏服务于人物，不靠夸张方言或固定口头禅撑区别。\n4. 将不自然的解释改成有情境依据的提醒、争执、掩饰或动作；双方已经知道的事实，不必为了观众复述完整历史。\n5. 朗读式检查停顿、重复和句长，保留有戏剧作用的犹豫与绕路。不要把所有人物都改成机智简短的作者代言人。\n\n【示例】情境：弟弟准备卖掉母亲留下的钢琴，姐姐赶回来。\n姐姐：搬家公司几点来？\n弟弟：你要坐一会儿吗？\n姐姐：我问几点。\n▲弟弟把琴凳从门边挪开。\n弟弟：他们说今天都行。\n（双方没有说明家史；弟弟回避具体时间，姐姐拒绝接受招待，动作暴露他已经为搬运做准备。若原稿的姐姐早已同意出售，就不能为了制造潜台词把她改成反对者。）\n\n【交付】优先给可直接替换的对白；我要求说明时再列出最关键的改动与意图。只提供片段时，判断限于已见内容，不把未提供的前情视为不存在。\n```\n"}, {"id": "3.3", "title": "台词七维诊断（大白话直给 + 快慢变速）", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/dialogue", "path": "03-revision/dialogue/3.3-台词七维诊断.md", "body": "\n**用法**：剧本初稿写完后，把这段和剧本一起发给 AI 做台词精修。它专治 AI 台词的几种老毛病：播音腔、对着对手念背景、只亮物证不说结论（观众看不懂）、满嘴术语、每句一样长。可以补 1.0「台词长度不再机械卡死」那条没展开的部分。\n\n**来源**：[short-drama-factory](https://github.com/lixiaoxiao9888-create/short-drama-factory) references/dialogue-doctor-anti-ai.md，MIT（收集人提供）。摘编：保留七个维度和改写示例，去掉了机检编号；原文用「△」标动作，这里改成「▲」。\n\n**提示词正文**：\n\n```\n请按以下“台词七维”逐条诊断并改写剧本台词。先列出每一维发现的问题（标出第几场、哪一句），再给出改写后的完整剧本。\n\n维度 1：角色语言指纹——遮住人名，能否一眼看出是谁在说话？\n- 恶霸/市井反派：短促施压词、命令句、市井俚语（“听懂没有”“少废话”）；\n- 隐忍/上位主角：字数精炼、情绪克制，用反问和具体代价制造威慑（“你确定？”“这笔账，现在算”）；\n- 质疑者/捧哏配角：替观众把疑问、憋屈或震惊直接喊出来（“他疯了吧？”）；\n- 谋士/助理/管家：恭敬短句，带具体数字和时间死线（“三分钟内办妥”）。\n严禁全员文绉绉、全员播音腔。\n\n维度 2：禁止反向灌输——不许角色对着对手念双方都知道的背景。\n✗ “三年前你害死了我爸，侵占了我们林家三千万财产，今天我一定要让你血债血偿！”\n✓ ▲林辰将染血的旧怀表重重拍在桌上，表盖弹开。\n  林辰（冷声）：三年前林家老宅那场火，烧得挺旺啊，赵董。\n  林辰：你吞下去的三千万，今天连本带利吐出来！\n\n维度 3：攻防回合制——每轮对话必须形成“施压 → 反刺探/亮牌 → 恼羞加码 → 绝杀算账”。\n反派：十万块，签了这份谅解书。\n主角：十万？你儿子的前途，就值这点？\n反派：你别给脸不要脸！\n主角：明早九点前不凑齐五百万，咱们法庭见。\n\n维度 4：单句气口——常规句 12~18 字；快刀句 3~6 字；爆发金句 8~12 字；单气口上限 25 字，一行含两层意思就拆成两行。\n\n维度 5：物证 + 大白话结论同轮直给——潜台词靠神态和动作演，但事实和利害结论必须在 1~2 句内用大白话挑明，不许打哑谜。\n✗ ▲她摸了摸碗边。 女主：这碗边没水印。你还是老样子。（观众看不懂）\n✓ ▲她一把将粗瓷碗翻过来，手指在碗底抹出一层干面粉！\n  女主（眼圈发红｜急促）：刚洗过的碗，碗底哪来的干面粉？\n  女主：你早上根本没吃饭，把最后两个馍全留给我了！\n\n维度 6：术语和设定词当句翻译——专业术语、古语、玄学词出现时，当句或下一句必须翻译成后果（多少钱、判几年、谁死谁活）。\n✗ “林总，对方启动了交叉违约触发机制，我们的流动性敞口已经彻底暴露了！”\n✓ “林总，银行刚刚抽贷了！今晚十二点前凑不出三千万现金，明早公司大楼直接被查封拍卖！”\n\n维度 7：快慢变速——先用 3~6 字快刀句劈开局面，再跟 8~16 字算账句亮筹码，不许每句都一样长。\n✗ 甲：你今天如果不把这份合同签了，我就让你在江城混不下去。\n✓ 甲（拍桌｜厉声）：签了它！不签，明天让你滚出江城！\n  乙（掀起眼皮｜冷笑）：滚出江城？\n  乙（甩出股权书｜一字一顿）：睁大眼看看，这栋楼现在的房东是谁！\n\n附加要求：每 2~4 句对白穿插一条拍得出来的 ▲ 强视觉动作，连续纯对白不超过 6 行。\n```\n"}, {"id": "3.24", "title": "台词引擎：一句一功能 + 四种台词技巧 + 压缩时保住爆发句", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/dialogue", "path": "03-revision/dialogue/3.24-台词引擎.md", "body": "\n**用法**：写对白、改对白时用，尤其是 AI 仿真人剧这类“台词不宜多、一句要顶一句”的项目。四种技巧（对比、曲解、PUA 式“为你好”、金句）是写反派话术和高潮台词最常用的手法。第五部分是压稿时容易犯的错：把有铺垫的爆发台词和关系宣判句当成“重复”删掉。和 3.15（台词效率逐句评分）、3.21（台词是一种行动）配合用。\n\n**来源**：主体出自 [艾玛短剧 · 编剧 Skills](https://github.com/adoria111/emma-screenwriting-skills) advanced/story-writing/skills/em-chief-writer/references/writing-rules.md “台词引擎”一节，MIT（11/11）；第五部分出自 [zenstory-ai/drama-skills](https://github.com/zenstory-ai/drama-skills) script-craft.md 的 SCR-23（11/01 新增，作者做过一组压稿对照：加这条之前，有铺垫的爆发和宣判句 3 次里 2 次被删，加之后 0 次被删、空喊仍照删），MIT。摘编。\n\n**提示词正文**：\n\n```\n请按以下规则写（或改）这场戏的对白。\n\n【一、一句台词一个功能】\n每句都提供新信息或推进情绪，不在同一层面来回说同一件事；每句都要回应上一句，并有新进展。单条台词太长（超过三行左右）就精简或加气口。\n一句台词可以承担的功能（同一段对话里轮换，不重复）：警告、反驳、亮明目的、道出背景、犀利拒绝、威胁升级、羞辱、嘲讽、揭示信息、下达态度。\n一字之差，人设天壤（先想清楚此刻谁强谁弱）：“你果然背弃了誓言”——说话的人是掌控者；“你竟然背叛了我们曾经的誓言”——说话的人是受害者。\n\n【二、信息去重】\n- 同一集内：同一个事实只说一次（“你们不关心我”“要八十万”说一次就够）。\n- 可以跨集重复、用来持续刺激的只有两类：反派做过的核心恶事（不同集、不同人、不同情境下提起）；人物的核心标签（“她是扫把星”“他是窝囊废”，多次强化，为打脸铺垫）。\n- 信息叠加是递进不是并列：骂人 → 推搡 → 毁坏重要物品 → 牵连亲人。\n\n【三、四种台词技巧】\n1. 对比法（抬高一方、贬低另一方）：“你连 ___ 的一根头发都比不上”“虽然你 ___，但 ___ 才是 ___”。例：父母把钱分给哥哥和妹妹，唯独不给主角，还说是为他好。\n2. 故意曲解 / 扣帽子：把对方的正当诉求恶意歪曲。例：女主说“我想离婚”→“你就是想跟那个野男人跑吧？”；女主说要去工作 →“你就是想勾引老板。”\n3. “我都是为你好”：施害者站在道德制高点，让受害者有苦说不出，最能激起观众愤怒。例：“你弟弟是咱家的命根子，你不帮他谁帮他？我们养你这么大容易吗？”\n4. 金句法（用在高潮、觉醒、反转时）：对仗俗语（“靠山山会倒，靠人人会跑”）、具象比喻、价值观反转（“爱不是束缚，应该是托举”）、递进排比。\n反派话术按功能取用：当众捧高踩低；把正当行为曲解成出轨或被收买；以退为进扮无辜；用“恩情 + 牺牲”道德绑架；把努力污名化成“出风头”；用“办正事”装公正掩盖偏心。\nOS / VO：用一句内心独白替观众点破潜台词，同时完成“揭示信息 + 扎心”；只点出当前可知的隐情，不替观众解释每个动作（详见 3.11）。\n\n【四、压缩流程】\n1. 标出每句的功能；\n2. 找出功能重复的句子，只保留一次；\n3. 把分散的背景信息融合进一句；\n4. 确认每句都有新进展，连成链条：警告 → 反驳 → 目的 → 背景 + 拒绝 → 动作 → 威胁升级；\n5. 长段心理描写改成简短有力的动作或对话。\n吵架要回合制层层升级，有来有回、句句戳心，不是一个回合重复对骂。\n\n【五、压稿时保住这场戏的回报】\n压稿前先认出这场戏的峰值。峰值上三样东西都承重：前面压力铺垫出来的爆发台词、紧跟其后的关系宣判句（例如“我们之间，到此为止。”）、收住这一拍的动作（例如离场）。即使离场已经表明了决定，宣判句也不算重复。\n时长不够时先删别处：过场、重复验证、解释，必要时整场合并；爆发台词只压缩其中重复的部分，保留铺垫指向的那一句。\n没有铺垫、不带来新情绪阶段、和前文同义的空喊照删。\n\n【自检】每句都有独立功能；同一集内同一事实没被反复说；跨集重复的只有核心罪证和人物标签，且每次有新情境；强弱定位正确；长心理描写已改成动作或对话；峰值上的爆发句和宣判句还在。\n```\n"}, {"id": "3.21", "title": "台词是一种行动：策略库、受阻、权力与停顿", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/dialogue", "path": "03-revision/dialogue/3.21-台词是一种行动.md", "body": "\n**用法**：对白像“轮流念信息”、或者一方句句都说赢像在演讲时用。和 3.14（对白五步改法）配合：3.14 管修改顺序，这条给了可以直接挑的“说话策略”清单，以及策略被挡回去之后怎么办。第 4 部分“长台词在转折处用动作断开”顺带解决分镜切点：断开处就是有依据的切镜位置。\n\n**来源**：[zenstory-ai/drama-skills](https://github.com/zenstory-ai/drama-skills) skills/short-drama-write/references/dialogue-craft.md 第 3、7、8 节，MIT（11/05 继续深挖）。摘编：去掉了规则编号。原文的动作行符号就是「▲」，和 1.0 一致。\n\n**提示词正文**：\n\n```\n请检查并改写下面这场戏的对白，让每句台词都在对另一个人做一件事。\n\n【一、同一个事实可以执行不同动作】\n事实：“门在九点锁。”\n催促：“你还有三分钟。”推责：“九点以后，钥匙不归我管。”试探：“你是不是以为九点以后没人进得来？”威胁：“九点一到，里面是谁都不重要了。”保护：“九点前走，我就当没见过你。”\n字面信息相近，关系动作完全不同。\n\n【二、按人物目标挑策略】\n要求、命令、请求、交换；试探、诱导、套话、验证；重新定义问题、缩小或扩大责任；先承认一部分以保护更大的秘密；借第三人或公共规则施压；假装无所谓、拖延、转移；把选择交还给对方；暴露自己愿付的代价；拒绝旧称呼或旧关系位置；用沉默逼对方继续说。\n\n【三、策略必须会受阻】\n一方每句都成功，对话就成了演讲。让另一方：看穿并点破策略；接受字面条件却拒绝隐含关系；拿出反证；改变公开范围；把对方的词反过来用；拿走说话依赖的时间、物件或身份；不给预期的反应。\n策略受阻后要换策略、付代价或退出；重复同一句要求只会拉长时长。有意的重复可以表现仪式、创伤、压迫或喜剧，前提是重复本身改变了效果或关系。\n\n【四、权力不是音量】\n现场权力来自：谁能结束谈话或开门；谁握着可验证的证据；谁能把话公开；谁退出成本更低；谁能定义问题和可接受的答案；谁愿意付更高代价；谁掌握第三人的信任。\n台词改变了权力，要有后续动作证明：对方交出东西、改称呼、停止解释、转向第三人、撤回条件或离开原位置。\n关系变化不必宣布“我不再信任你”，可以：从私下称呼改为正式称谓；把共同物品变成个人物品；不再替对方撒谎；第一次在第三人面前支持或反对；接受条件但拒绝情感解释。\n关键对白结束后，至少能指出信息、权力、关系、情绪行动或物理状态的一项变化；指不出来，这一轮就是重复。\n\n【五、动作、停顿、打断】\n- 不要在每句之间插“看了看、笑了笑、皱眉”。对话间的动作要做事：操作筹码或证据、改变距离和公开范围、显示言行不一、给对方一个必须回应的新事实、记录连续性变化。\n- 停顿要有对象，不只写“沉默片刻”。例：他没有回答，把柜子钥匙从钥匙圈上拆下来，却没有递过去。\n- 打断可以：阻止一个危险的词说完、抢走问题的定义权、保护第三人、暴露说话者早知道答案、让私密内容进入公开场合。打断之后要处理没说完的内容的后果。\n- 长台词：只有内部有策略转折时，才在转折处用一条动作行断开；没有转折的长台词应该缩短，不是拆开。动作单独写一行，不塞进台词括号：\n  【角色甲】（轻描淡写）：这事跟我没关系。\n  ▲角色甲转头看向角色乙，把手里的名册翻过一页，压住其中一行。\n  【角色甲】：再说，你要找的人今晚也不会来。\n  断开处就是分镜可以切换景别或主体的地方。\n\n【六、方法失效的情况（改完别扭时对照）】\n写潜台词——人物没有理由隐瞒时，会显得莫名躲闪；硬给中立信息派立场——观众看得出是假争；打断——被打断的那句带着观众之后拿不到的信息时，推断会失去依据；沉默——没有可见对象时，观众只看到空档；借规则施压——这条规则观众之前不知道时，像临时发明的挡箭牌；区分人物声音——差异只落在口头禅上时，换掉那个词人物就没了区别。\n\n【输出】改写后的对白；每处关键改动注明用了哪种策略、受阻后怎么变。\n```\n"}, {"id": "3.4", "title": "台词称呼系统", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/dialogue", "path": "03-revision/dialogue/3.4-台词称呼系统.md", "body": "\n**用法**：润色台词时用，让人物之间的称呼随关系和场合变化，台词更像人说的。\n\n**来源**：[漫剧老李 manju-laoli-skill](https://github.com/lixiaoxiao9888-create/manju-laoli-skill) sd-script-engine/references/dialogue-naturalization.md，MIT（1.1k star，和 short-drama-factory 是同一作者）。原文约 2.7 万字，这里只摘编了「称呼系统」一节。\n\n**提示词正文**：\n\n```\n请检查并改写剧本中的称呼，让台词更口语、更像人说的。规则：\n\n一、称呼由四个变量决定：身份（尊/平/卑、年龄差）× 关系（生疏/熟识/亲密/决裂/旧情/上下级）× 场合（公开/私密）× 情绪（平静/动情/恼火/示弱/挑衅）。任一变化，称呼就该变。\n\n二、同一对象的七种叫法（现代 / 古装）：\n- 公开·正式：“陈总监” / “陈大人”\n- 私下·熟识：“老陈” / “陈兄”\n- 亲密·动情：“阿默” / “默郎”\n- 示弱·求人：“陈总，您看……” / “大人，小人斗胆……”\n- 恼火·决裂：连名带姓“陈默！”\n- 挑衅·敌意：反讽敬称“陈大总监” / “陈大人好大的官威”\n- 划清界线：从“老陈”退回“陈总监”\n称呼的“降格”和“退回”比“升格”更有戏。\n\n三、三条铁律：\n1. 同一角色对同一对象，在同一关系阶段的称呼必须稳定，跨集不得漂移；要变，必须有事件触发。\n2. 称呼只反映关系，不替代事件：关系要靠经历、试探、保护、背叛推进，不能只改称呼。\n3. 不同角色对同一对象的称呼要有区分（一个叫“爸”，一个叫“老李”，一个叫“李队”）。\n\n总则：口语化不等于加废话，也不等于拉低身份——粗人糙话、书生引典、杀手惜字。\n\n输出：先列一张称呼表（谁对谁、当前关系、用什么称呼），再给改写后的台词。\n```\n"}, {"id": "3.23", "title": "剧本叙事层去 AI 味：主题不说破、情绪不全靠体感、人物关系不全是暖的", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/de-ai", "path": "03-revision/de-ai/3.23-剧本叙事层去-AI-味.md", "body": "\n**用法**：AI 写的剧本，换了措辞还是“一股 AI 味”时用。3.8（去 AI 味）改的是措辞和句子，这条改的是更深一层的叙事习惯：旁白或台词把主题说破、人物在对话里讨论人生道理、情绪全写成“心口发紧、手心冒汗”、环境总在映射心情、所有人之间都很友善。依据是一篇 2026 年对 6 万多篇人写和 AI 写故事的对比研究：只看叙事结构就能认出 AI 文本，光改用词改不掉。\n\n**来源**：[Nanako0129/sepia](https://github.com/Nanako0129/sepia) skills/sepia/references/narrative-pass.md，MIT（11/10 整理人新增到收集页面）。原文英文、针对小说，这里翻译摘编，只保留适合短剧的部分。**注意和短剧规律冲突的地方已经去掉**：原文建议“一半结局交给外力或偶然”“主角道德上模棱两可”“允许因果链断一次”，这些和短剧要求的主角主动、爽点兑现、因果清楚相反，不收。原文里的百分比是英文小说的统计，只作参考。\n\n**提示词正文**：\n\n```\n请检查下面的剧本，找出以下几种“AI 叙事习惯”，逐处给出修改。只改叙事处理，不改剧情走向、人物关系和结局。\n\n【一、主题不说破】\n- AI 爱让旁白或人物总结道理：“这就是人性”“那一刻她终于明白……”“到最后，重要的是……”。找出这类句子，删掉，或换成一个具体的动作、画面。\n- 人物在对话里讨论抽象道理（爱是什么、命运是什么），改成为一件具体的、他们想要的东西争执——争房租，不争“悲伤的本质”。\n- 象征物在台词里被解释了，删掉解释，留下物件。\n- 允许有一场戏或一个画面只为质感存在，不必每一处都扣主题。\n\n【二、转折不要“谁都写得出来”】\n回声测试：把这个故事前提交给 AI 重写二十次，这个转折会不会每次都出现？乐于助人的陌生人、问题干净利落地解决、准时到来的和解——这些都会反复出现。把它换成必须依赖本剧具体人物、具体细节才会发生的转折。\n\n【三、情绪写法要混合】\n- AI 把“展示而不是告诉”当教条：恐惧永远是心口发紧、冷汗、灯光变暗。人写的故事主要靠两种最朴素的方式：先写行为（她做了什么），再是直接说出来（“她怕了”这句话人会写，AI 几乎不写）。\n- 体感描写（心跳、发抖、喉咙发紧）只留给全集一两个情绪高点。\n- 不要让天气和环境总在映射心情：不是每场雨都代表婚姻破裂。\n- 场景描写多写人物“用”的空间（走过、拿起、靠着），少写只为烘托气氛的空间。\n\n【四、人物登场和关系】\n- 主角在说话或做事中登场，不先来一段外貌加背景介绍。\n- 画出人物关系图：如果人人都互相认识、人人之间都友善，就删掉几条线、调冷几段关系。真实的人物之间会有和剧情无关的不喜欢。\n- 反派不要是孤零零只针对主角的一个点：给他一段和主角无关的关系（盟友、内部矛盾）。\n\n【五、具体而不是含糊】\n“一首老歌”“一位有名的作家”这类含糊说法，改成一个具体的、真实存在且不涉及红线的东西（某条路、某种小吃、某个行业术语）。到处含糊是 AI 的谨慎病。真人、真实品牌和他人作品仍按红线处理，不用。\n\n【六、只做一处“不寻常”】\n在保证短剧类型规律（主角主动、爽点兑现、因果清楚）的前提下，做恰好一处对这个题材来说不常见的结构选择，例如一个不常见的开场视角、一种这类题材少用的打脸方式。一处就够，多了像在炫技。\n\n【输出】逐处列出：位置｜原文｜属于哪一种 AI 习惯｜修改后的写法。\n```\n"}, {"id": "3.5", "title": "反套路检测", "chapter": "三、剧本修改与精修", "license": "外部·可直接用", "folder": "03-revision/de-ai", "path": "03-revision/de-ai/3.5-反套路检测.md", "body": "\n**用法**：大纲或前 3 集写完后，把这段和剧本一起发给 AI 查烂梗。审本时用。\n\n**来源**：[OnlyShot](https://github.com/A-cat-with-carrots/OnlyShot) references/cliche-detector.md，MIT。摘编成可直接粘贴的指令。\n\n**提示词正文**：\n\n```\n请对照下面的套路黑名单通读我的剧本（或大纲），列出所有命中项：命中的套路、等级、出现在第几集/哪一场、建议的替代写法。不要直接改剧本，先给清单。\n\n一级黑名单（极烂大街，尽量不用）：\n1. 双胞胎调换婴儿 → 改为母亲故意藏起一胎、产房文件造假、收养家庭藏身世\n2. 失忆/假死/突发车祸 → 让冲突来自人物内部或现实利益\n3. 隐藏战神/神医/律师老人 → 让能力是
