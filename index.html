  novel:{tab:'汇入小说', step:'汇入小说', btn:'资产库生成', sub:'产生影片内的生动角色与故事场景'},
};
const wzEps = W => W.eps==='自定义' ? (+W.epsCustom||0) : W.eps;
const wzMins = W => W.mins==='自定义' ? (+W.minsCustom||0) : W.mins;
const nfmt = n => n.toLocaleString('en-US');
function wzScore(W){
  return (W.pitch.trim()?2:0)+(W.hooks.length?1:0)+(W.core.trim()?2:0)+(W.diff.trim()?2:0)+(W.rival.trim()?1:0)+(W.hero.trim()?1:0)+(W.world.trim()?1:0);
}
function wzTitle(W){
  if(W.title.trim()) return W.title.trim();
  const src = W.mode==='novel' ? W.novel : W.doc;
  const m = src.match(/《([^》\n]{1,30})》/) || src.match(/(?:剧名|片名|作品名称?)[:：]\s*([^\n]{1,30})/);
  return m ? m[1].trim() : '';
}
function wzNeeds(W){
  const n=[];
  if(W.mode==='paste' && !W.doc.trim()) n.push('贴上你的剧本');
  if(W.mode==='novel' && (W.novel.length<2000||W.novel.length>400000)) n.push('放进小说（2,000–400,000 字）');
  if(W.mode==='auto' && !W.pitch.trim()) n.push('说一句你的故事');
  if(!wzEps(W)||!wzMins(W)) n.push('选好集数和每集时长');
  if(!W.adult) n.push('勾选「所有角色均已年满 18 岁」');

}
function wzSettings(W){
  const eps=wzEps(W), mins=wzMins(W), per=mins*W.wpm;
  const s=[`作品名称：${wzTitle(W)||'（未定，请依内容取名）'}`,
    `受众：${W.aud}　配对：${W.pair}　类型：${W.genre}`,
    `一句话卖点：${W.pitch.trim()||'（未填）'}`,
    `核心爽点：${W.hooks.join('、')||'（未选）'}`,
    `台词用语：${W.lang}；剧本字形：${W.glyph}`,
    `第一季规格：共 ${eps} 集，每集约 ${mins} 分钟、约 ${nfmt(per)} 字（每分钟约 ${W.wpm} 字），合计约 ${nfmt(per*eps)} 字。`];
  if(W.style&&W.style!=='无') s.push(`画面风格：${W.style}`);
  if(W.ratio) s.push(`画面比例：${W.ratio}`);
  if(W.sequel) s.push('预留续季空间：最后一集留下 2–3 条可延续的线，不把伏笔收完。');
  s.push('所有角色均已年满 18 岁。');
  const sup=SUPP.filter(([k])=>W[k].trim()).map(([k,l])=>`${l}：${W[k].trim()}`);

【参考：灵感到成稿工作流（提示词库 1.1）】
${lib('1.1')}`;

【长篇压缩规则（提示词库 2.12）】
${lib('2.12')}

${W.novel.trim()}`;

function wzDupCheck(W){

  const me=grams(wzTitle(W)+W.pitch+W.core);
  const hits=works.map(w=>{const o=grams((w.title||'')+(w.W.pitch||'')+(w.W.core||''));let c=0;me.forEach(x=>o.has(x)&&c++);
    const sim=me.size&&o.size?c/Math.min(me.size,o.size):0; return {title:w.title||'（未命名）',pitch:w.W.pitch,sim, same:w.W.genre===W.genre}})

async function readAnyFile(file){
  const name=file.name.toLowerCase(), buf=await file.arrayBuffer();
  const loadJs=src=>new Promise((ok,bad)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>bad(new Error('载入失败')); document.head.appendChild(s); });
  if(name.endsWith('.docx')){
    await loadJs('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    return (await mammoth.extractRawText({arrayBuffer:buf})).value;
  }
  if(name.endsWith('.pdf')){
    await loadJs('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:buf}).promise; const out=[];
    for(let i=1;i<=pdf.numPages;i++){ const c=await (await pdf.getPage(i)).getTextContent(); out.push(c.items.map(x=>x.str+(x.hasEOL?'\n':'')).join('')); }
    return out.join('\n');
  }
  // txt / md：依序试 UTF-8、GB18030、Big5
  for(const enc of ['utf-8','gb18030','big5']){ try{ return new TextDecoder(enc,{fatal:true}).decode(buf).replace(/^﻿/,''); }catch(e){} }
  return new TextDecoder('utf-8').decode(buf);
}

function micListen(btn, ta, sep){
  if(btn._rec){ btn._rec.stop(); return; }
  if(!SpeechRec||!ta) return;
  const rec=new SpeechRec(); rec.lang='zh-CN'; rec.interimResults=true; rec.continuous=true;
  const base=ta.value.replace(/\s+$/,''), join = !base ? '' : sep!=null ? sep : (/[，。！？、,.!?\n]$/.test(base)?'':'，');
  btn._rec=rec; btn.classList.add('on');
  rec.onresult=e=>{ let t=''; for(const r of e.results) t+=r[0].transcript; ta.value=base+join+t; ta.dispatchEvent(new Event('input',{bubbles:true})); };
  rec.onend=rec.onerror=()=>{ btn._rec=null; btn.classList.remove('on'); };
  try{ rec.start(); }catch(err){ btn._rec=null; btn.classList.remove('on'); toast('这个浏览器不支持语音输入'); }
}

  if(k) T.push(`${k}归来`,`${k}不好惹`,`重生之${k}`,`这个${k}有点狠`,`${k}的逆袭`,`惊鸿${k}`,`${k}今天也在翻盘`,`锦绣${k}`,`我家${k}是大佬`,`${k}她杀疯了`);

function bindWcard(root, W, save, close){
  const q=sel=>root.querySelector(sel), O=wcardOpts(W);
  W.adult=true; W.dup=null;
  const refresh=()=>{ q('.wc-go').disabled = !W.pitch.trim(); const {dup,...keep}=W; save(keep); };
  const core=q('[data-c=core]');
  const grow=el=>{ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; };
  root.querySelectorAll('[data-seed]').forEach(b=>b.onclick=()=>{
    const t=core.value.replace(/\s+$/,''); core.value=(t?t+'\n':'')+b.dataset.seed; W.core=core.value; grow(core); refresh();
    core.focus(); core.setSelectionRange(core.value.length, core.value.length);
  });
  requestAnimationFrame(()=>root.querySelectorAll('textarea.wc-story').forEach(grow));
  const mic=q('[data-mic]');
  if(mic) mic.onclick=e=>{ e.preventDefault(); micListen(mic, core, '\n'); };
  addMic(q('[data-c=pitch]'));
  { const tw=q('.wc-think'), pw=q('[data-c=pitch]').closest('.mic-w')||q('[data-c=pitch]').parentElement; pw.classList.add('has-think'); pw.append(tw); }
  q('[data-dice]').onclick=()=>{ const t=q('[data-c=title]'); t.value=wzRollTitle(W, t.value); t.dispatchEvent(new Event('input',{bubbles:true})); };
  root.querySelectorAll('[data-c]').forEach(el=>{
    el.oninput=el.onchange=()=>{
      const k=el.dataset.c;
      W[k] = el.type==='checkbox' ? el.checked : el.value;
      if(el.tagName==='TEXTAREA'){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }
      refresh();
    };
  });
  root.querySelectorAll('[data-dd]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const m=b.nextElementSibling, open=m.classList.contains('open');
    document.querySelectorAll('.cpop').forEach(p=>p.classList.remove('open')); if(!open) m.classList.add('open');
  });
  root.querySelectorAll('[data-menu] button').forEach(it=>it.onclick=e=>{
    e.stopPropagation();
    const m=it.parentElement, k=m.dataset.menu, o=O[k], v=o.num?+it.dataset.v:it.dataset.v; W[k]=v;
    m.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===it)); m.classList.remove('open');
    const b=m.previousElementSibling, cur=o.items.find(x=>String(x.v)===String(v));
    b.innerHTML=`${o.lead?o.lead(v):''}<span>${esc(String(o.label?o.label(v):cur.l))}</span>${ico('chev')}`;
    if(k==='aud'){ const Q=QIXING[qxSide(W)]; if(!Q.role.includes(W.qxRole)) W.qxRole=''; if(!Q.mode.includes(W.qxMode)) W.qxMode='';
      refresh(); root.innerHTML=wcardHtml(W); bindWcard(root, W, save, close); return; }
    refresh();
  });
  root.querySelectorAll('.ck[data-h]').forEach(c=>c.onclick=()=>{
    const h=c.dataset.h; W.hooks=W.hooks.includes(h)?W.hooks.filter(x=>x!==h):[...W.hooks,h]; c.classList.toggle('on'); refresh();
  });
  q('.wc-go').onclick=()=>{ if(!authGet()){ openLogin(); toast('输入手机号就能开写'); return; } W.ai=(store('chat')||{}).ai||W.ai; const it=wzSaveWork(W,'vibe'); const {dup,...keep}=W; save(keep); location.hash='#/script/v/'+it.id; };
  q('[data-x]').onclick=close;
  { const tb=q('[data-think]'), tp=q('[data-thinkpop]');
    const drawT=()=>{ const d=depthOf(W), k=DEPTH.indexOf(d); tb.querySelector('span').textContent=d.slice(0,1)+'度思考';
      tp.innerHTML=`<div class="tk-h"><b>${d.slice(0,1)}</b><span>${DEPTH_TIME[d]}</span></div><input type="range" class="tk-r" min="0" max="2" step="1" value="${k}" style="--p:${k*50}%"><div class="tk-l"><span>轻</span><span>中</span><span>重</span></div>`;
      tp.querySelector('input').oninput=e=>{ W.depth=DEPTH[+e.target.value]; const C=store('chat')||{}; C.depth=W.depth; store('chat',C); refresh(); drawT(); }; };
    tp.onclick=e=>e.stopPropagation();
    tb.onclick=e=>{ e.stopPropagation(); const o=tp.classList.contains('open'); document.querySelectorAll('.cpop').forEach(p=>p.classList.remove('open')); if(!o) tp.classList.add('open'); };
    drawT(); }
  refresh();
}

/* 从一句话猜受众、配对、类型、爽点（只在作品卡第一次出现时套用，之后随用户改） */
function wzGuess(t){
  const g={}, has=re=>re.test(t);
  if(has(/男男|耽美|BL/i)) g.pair='男男（BL）'; else if(has(/女女|百合|GL/i)) g.pair='女女（GL）';
  if(g.pair==='男男（BL）') g.aud='女性向';
  else if(has(/千金|王妃|皇后|嫡女|女主|她|闺蜜|婆婆|前夫/)) g.aud='女性向';
  else if(has(/战神|兵王|赘婿|神医|他|少年|废柴|老板/)) g.aud='男性向';
  g.genre = has(/重生|穿越|穿成|回到/) ? '重生穿越' : has(/系统|异能|读心|透视/) ? '能力系统' : has(/修仙|仙|魔|妖|玄/) ? '玄幻'
    : has(/古代|王府|宫|皇|将军|侯府|嫡/) ? '古装' : has(/总裁|霸总|豪门|首富/) ? '霸总' : has(/公司|职场|上司|同事/) ? '职场' : '都市';
  const h=[]; if(has(/千金|身份|身分|假|真/)) h.push('身分反转'); if(has(/逆袭|翻盘|崛起/)) h.push('逆袭'); if(has(/打脸|嘲笑|看不起/)) h.push('打脸');
  if(has(/追妻|火葬场/)) h.push('追妻'); if(has(/先婚|契约|闪婚/)) h.push('先婚后爱'); if(has(/重逢|前任|破镜/)) h.push('破镜重圆'); if(has(/宠|偏爱/)) h.push('被偏爱');
  g.hooks=h; return g;
}

function epMat(t){
  const people=new Set(), locs=new Set();
  for(const m of t.matchAll(/^出场人物：(.+)$/gm)) m[1].split(/[、，,]/).map(x=>x.trim()).filter(Boolean).forEach(x=>people.add(x));
  for(const m of t.matchAll(/^场景：[^·]*·\s*([^·\n]+?)\s*·/gm)) locs.add(m[1]);
  for(const m of t.matchAll(/^#{2,4}\s*场\s*\d+\s*[｜|]\s*([^（(\n]+)/gm)) locs.add(m[1].trim());
  for(const m of t.matchAll(/^([一-龥]{2,5})(?:（[^）]*）)?：[「“]/gm)) people.add(m[1]);
  return {people:[...people], locs:[...locs]};
}

async function yqChat(model, content, max_tokens){
  const A=authGet();

  const left=r.headers.get('X-Points'); if(left!==null&&A){ A.user.points=+left; authSet(A); }
  const j=await r.json().catch(()=>({}));
  if(r.status===401){ authSet(null); openLogin(); throw new Error('请先登录'); }
  if(r.status===402){ toast('今天的积分用完了，明天 0 点补满'); throw new Error('积分不足'); }
  if(!r.ok) throw new Error((j.error&&(j.error.message||j.error))||('HTTP '+r.status));

}

      if(!outline.length) throw new Error('outline empty');
      const castSrc=card&&(card.cast||[]).length?card.cast.map(c=>({...c, bio:[c.want&&`想要${c.want}`, c.flaw&&`弱点：${c.flaw}`, c.voice&&`说话：${c.voice}`].filter(Boolean).join('；')})):(pl.cast||[]);
      const data={title:((card&&card.title)||pl.title||'').trim(), logline:(card&&card.logline)||pl.logline||'', outline, eps:[], card, fixed:[],
        cast:castSrc.filter(c=>c&&c.name).map(c=>({name:String(c.name).trim(), role:String(c.role||'配角'), bio:`${c.age?c.age+' 岁，':''}${c.bio||''}`, look:c.look||''}))};

          if(iss.length){ const fx=await yqChat(writer, yqFixPrompt(d, Wx, i, txt, iss), mx); if(fx&&fx.length>txt.length*.5){ txt=fx; fixedN=iss.length; } } }catch(e){ if(/登录|积分/.test(e.message)) throw e; }
      }

      w2.gen.data.eps[i]=txt; (w2.gen.data.fixed=w2.gen.data.fixed||[])[i]=fixedN; updateGen(wid,{data:w2.gen.data}); yqRefresh(wid);
    }

}

      {name:'资产/资产清单.json',text:JSON.stringify({characters:[s.name,s.name2,'对手'],scenes:['主要场景'],ratio:W.ratio||'9:16'},null,2)}

    s.outline.forEach(([title,outline],i)=>{const no=String(i+1).padStart(2,'0'),t=epTxt(i),m=epMat(t);files.push({name:`剧本/第${no}集-大纲.txt`,text:`第 ${i+1} 集：${title}\n\n${outline}`},{name:`剧本/第${no}集-剧情对话.txt`,text:t},{name:`分镜/第${no}集.json`,text:JSON.stringify({episode:i+1,title,ratio:W.ratio||'9:16',characters:m.people,scenes:m.locs,prompt:t},null,2)});});

  $('exportXtasy').onclick=()=>{const x=exportFiles();saveBlob(x.blob,`${x.safe}-XTASY导入包.zip`);$('exportMenu').classList.remove('open');window.open('https://xtasyart.com/','_blank','noopener');toast('XTASY 导入包已下载，请在新页面选择导入');};
  $('vtAI').onclick=e=>{

      '1. 红线：未成年、暴力色情、政治敏感、违法引导等合规问题，指出位置并直接给出改法。',
      '2. 前后文：人名、身份、伏笔、设定是否前后一致；改一处要同步改哪些地方。',
      '3. 节奏与钩子：每集开头 3 秒是否抓人、结尾是否留钩子，冲突是否成立。',
      '4. 对白：是否口语、有没有说明腔，人物说话是否有辨识度。',

    copyText(review, e.currentTarget); if(site) window.open(site,'_blank','noopener'); toast(site?`已复制，到 ${ai} 贴上就开始审稿`:'已复制审稿提示词'); };

  v.innerHTML=`

      <span class="badge">${ico('check').replace('<svg','<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="3"')}${fresh?'剧本大纲完成！':'我的剧本'}</span>
      <h1>《${esc(s.title)}》</h1>

    </section>
    <div class="res-grid">
      <aside class="hero-card">
        <div class="av" style="background:linear-gradient(160deg,${SX_COLORS[DATA.roles[s.g].findIndex(x=>x.type===t.type)%10]||'#4a5d78'},#1a1a1d)">${ico(s.g==='male'?'user':'female')}</div>
        <h3>${esc(s.name)}</h3><div style="color:var(--text-3);font-size:13px">${s.g==='male'?'男频':'女频'} · ${esc(t.type)}</div>

      </aside>
      <div>
        <div class="rtabs">
          <div class="gseg" id="rtab"><button data-t="outline">分集大纲</button><button data-t="script">完整台词</button></div>
          <button class="btn-o" id="redo">${ico('dice')}<span class="lbl">重写</span></button><button class="btn-o" id="seePrompt">${ico('sparkle')}<span class="lbl">AI 精写提示词</span></button>
          <div class="act" id="scAct"><button class="btn-o" id="scCopy" title="复制全部">${ico('copy')}<span class="lbl">复制全部</span></button><button class="btn-o" id="scDl" title="下载 .txt">${ico('dl')}<span class="lbl">下载 .txt</span></button></div>
        </div>
        <div id="rbody"></div>
        <div class="next">
          <h4 id="nxH"></h4>
          <div class="row">
            <button class="magic" id="toScript" style="height:44px">${ico('script')}完整台词</button>
            <a class="btn-o" href="#/script" style="text-decoration:none">再来一部</a>
            <button class="btn-o" id="toPro">到 PRO 版细修</button>
            <a class="btn-o pt-entry" href="#/partner" style="text-decoration:none">${ico('sparkle')}AI短剧伙伴计划</a>
            <button class="btn-o" id="delWork" style="margin-left:auto">删除</button>
          </div>
        </div>
      </div>
    </div>`;
  const $=id=>document.getElementById(id);
  let tab=s.seed?'script':'outline', anim=fresh;
  function draw(){
    document.querySelectorAll('#rtab button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
    $('scAct').style.visibility = tab==='script'?'visible':'hidden';

    $('rbody').innerHTML = tab==='outline'
      ? `<div class="eps">${s.outline.map(([h,b],i)=>`<div class="ep" style="${d(i)}"><div class="h"><b>EP${String(i+1).padStart(2,'0')}</b><span>${esc(h)}</span></div><p>${esc(b)}</p></div>`).join('')}</div>`

    anim=false;
    $('nxH').textContent = tab==='script' ? '10 集完整台词已生成' : '下一步：把大纲写成完整台词';
    $('toScript').style.display = tab==='script'?'none':'';

  document.querySelectorAll('#rtab button').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; if(tab==='script'&&!s.seed) setSeed(); draw(); });

  $('scDl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(["\uFEFF"+sxScriptText(s)],{type:'text/plain;charset=utf-8'}));a.download=`${s.title}-10集完整台词.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
  $('redo').onclick=()=>{ setSeed(); tab='script'; anim=true; draw(); toast('已重写一版台词'); };
  $('seePrompt').onclick=()=>showModal(`《${s.title}》10 集剧本提示词`, prompt, `${s.title}-10集剧本提示词.txt`);
  draw();
  document.getElementById('toPro').onclick=()=>{ store('pro',true); location.hash='#/script/w/'+w.id; };
  document.getElementById('delWork').onclick=()=>{ if(!confirm('删除这部剧本？')) return; store('works',(store('works')||[]).filter(x=>x.id!==w.id)); location.hash='#/script'; };
}

const isPro = () => store('pro') !== false;

const FUNCS = [
  {k:'script', icon:'script', label:'剧本', href:'#/script'},
  {k:'assets', icon:'assets', label:'资产库', href:'#/assets'},
  {k:'storyboard', icon:'play', label:'分镜', href:'#/storyboard'},

function drawNav(route){
  const cur = route.folder || '';
  const ch = chapterOf(cur);
  const fn = funcOf(route);
  const hash = location.hash || '#/';

  document.getElementById('tbSeg').innerHTML = FUNCS.map(f =>
    `<a href="${f.href}" class="${fn===f.k&&route.view!=='start'&&route.view!=='partner'?'on':''}">${ico(f.icon)}${f.label}</a>`).join('');

  // 目录面板：四大功能各自一套
  const A = (href, label, o={}) => `<a class="${o.cls||''} ${o.on ?? hash===href ? 'on':''}" href="${href}">${o.icon?ico(o.icon):''}<span>${esc(label)}${o.d?`<span class="d">${esc(o.d)}</span>`:''}</span>${o.n!=null?`<span class="n">${o.n}</span>`:''}${o.pro?'<span class="ptag">PRO</span>':''}</a>`.replace('<a ', o.pro?'<a data-pro ':'<a ');
  const T = (t, icon) => `<div class="ps-title">${icon?ico(icon):''}${esc(t)}</div>`;
  const PICK = `<div class="ps-hr"></div>` + T('精选提示词','grid');
  const F = FUNCS.find(f=>f.k===fn);
  const title = fn==='prompts' ? (ch ? ch.label : '目录') : (route.view==='start'||route.view==='partner') ? '目录' : F.label+'目录';
  const pill = `${esc(title)} ${ico('panel')}`;
  let h = `<div class="ps-row"><button class="pill" id="psClose" title="收起">${pill}</button></div>`;

function authGet(){ return store('auth'); }
function authSet(a){ if(a) store('auth',a); else localStorage.removeItem('pl.auth'); drawAccount(); }
const maskPhone=p=>p&&p.length>6?p.slice(0,3)+'****'+p.slice(-3):(p||'');
const ROLE_NAME={free:'免费',member:'会员',tester:'内部测试'};
async function api(path, opt){
  const A=authGet(), o=opt||{};
  const r=await fetch(TJ_API+path,{method:o.method||'GET', headers:{'Content-Type':'application/json',...(A?{'Authorization':'Bearer '+A.token}:{}),...(o.headers||{})}, body:o.body});
  const j=await r.json().catch(()=>({})); if(r.status===401&&A&&!o.noLogout) authSet(null);
  if(!r.ok) throw Object.assign(new Error(j.error||('HTTP '+r.status)),{status:r.status}); return j;
}
async function doLogin(phone){
  const d=String(phone||'').replace(/\D/g,'');
  if(d.length<8||d.length>11){ toast('请输入 8–11 码手机号'); return false; }
  try{
    const j=await api('/auth/login',{method:'POST', body:JSON.stringify({phone:d})});
    authSet({token:j.token, user:j.user}); toast('已登录'); await cloudPull(); return true;
  }catch(e){ toast(e.message||'登录失败'); return false; }
}
let cloudHash={}, cloudTimer=null;
const workHash=w=>{ const t=JSON.stringify(w); let h=0; for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))|0; return h+':'+t.length; };
async function cloudPull(){
  if(!authGet()) return;
  try{
    const j=await api('/works'), local=(JSON.parse(localStorage.getItem('pl.works'))||[]), byId=Object.fromEntries(local.map(w=>[w.id,w]));
    for(const r of j.works){ const l=byId[r.id]; if(!l || (r.data.time||0)>(l.time||0)) byId[r.id]=r.data; }
    const merged=Object.values(byId).sort((a,b)=>(b.time||0)-(a.time||0));
    cloudHash=Object.fromEntries(j.works.map(r=>[r.id,workHash(r.data)]));
    localStorage.setItem('pl.works', JSON.stringify(merged)); cloudPush(true);
    if(/^#\/(script|$)/.test(location.hash)||location.hash==='#/'||!location.hash) dispatchEvent(new HashChangeEvent('hashchange'));
  }catch(e){}
}
function cloudPush(now){
  if(!authGet()) return; clearTimeout(cloudTimer);
  cloudTimer=setTimeout(async()=>{
    const list=JSON.parse(localStorage.getItem('pl.works'))||[];
    for(const w of list){ const hsh=workHash(w); if(cloudHash[w.id]===hsh) continue;
      try{ await api('/works/'+encodeURIComponent(w.id),{method:'POST', body:JSON.stringify(w)}); cloudHash[w.id]=hsh; }catch(e){ break; } }
  }, now?50:1500);
}
window.cloudPush=cloudPush;

  const A=authGet(), u=A&&A.user, pts=u?(u.points===null?'∞':u.points):'登录';

    document.getElementById('accForm').onsubmit=async e=>{ e.preventDefault(); await doLogin(document.getElementById('accPhone').value); };

const state = {q:'', lic:'all', prod:false};
function filtered(list){
  const q=state.q.trim().toLowerCase();
  return list.filter(e=>{
    if(state.lic==='direct' && !e.license.includes('可直接用')) return false;
    if(state.lic==='ref' && !e.license.includes('仅参考')) return false;
    if(state.lic==='int' && !e.license.startsWith('内部')) return false;
    if(state.prod && !(e.status||'').includes('已用于生产')) return false;
    if(q && !(e.id+' '+e.title+' '+e.body).toLowerCase().includes(q)) return false;
    return true;
  });
}
function cardsHtml(list){
  if(!list.length) return '<div class="empty">没有符合条件的提示词</div>';
  return '<div class="grid">'+list.map(e=>`<a class="card" href="#/e/${e.id}" style="text-decoration:none">
    <span class="id">${e.id}</span>
    <h3>${esc(e.title)}</h3>
    <div class="desc">${esc(usage(e.body))}</div>
    <div class="tags">${tagsHtml(e)}</div></a>`).join('')+'</div>';
}

function viewList(route){

  const base = isHome ? ENTRIES : inFolder(folder);
  const v = document.getElementById('view');
  v.innerHTML = `

    <svg class="rings" viewBox="0 0 200 200" fill="none" stroke="#ff3355" stroke-width=".4">
      <circle cx="100" cy="100" r="96"/><circle cx="100" cy="100" r="80"/><circle cx="100" cy="100" r="58" stroke-dasharray="2 3"/>
      <path d="M100 4 183 148H17Z"/><path d="M100 196 17 52h166Z"/></svg>
    <h1>短剧提示词<br>从灵感到成片的模块库</h1>
    ${composer()}
  </section>` : `<div class="sec-head" style="margin-top:36px"><h2>${esc(label)}</h2><span class="meta" id="cnt"></span></div>${composer(true)}`}
  ${isHome ? `<div class="sec-head"><h2>全部提示词</h2><span class="meta" id="cnt"></span><span class="sp"></span>
    <a class="btn-white" href="#/assembler">${ico('wand')}组装视频提示词</a></div>` : '<div style="height:18px"></div>'}

/* 搜索时一并找出剧本 / 资产库 / 分镜里的相关功能 */
function funcIndex(){
  const L=[];
  const add=(fn,title,desc,href,kw,pick)=>L.push({fn,title,desc,href,kw:(title+' '+desc+' '+kw).toLowerCase(),pick});
  add('script','人物即剧本','标准版：选主角，一键产出 10 集剧本','#/script','剧本 编剧 人物 角色 主角 男主 女主 男频 女频 一键 10集',{pro:false});
  add('script','新增作品','PRO：策划文件 → 骨架 → 规格 → 补充设定 → 确认','#/script/new','剧本 编剧 策划 大纲 小说 改编 卖点 作品 男主 女主 主角 对手',{pro:true});
  for(const g of ['male','female']) DATA.roles[g].forEach((t,i)=>add('script',t.type,`${g==='male'?'男频':'女频'} · ${t.gold}`,'#/script',
    `剧本 人物 角色 主角 ${g==='male'?'男频 男主':'女频 女主'} ${Object.values(t).join(' ')}`,{pro:false,g,idx:i}));
  for(const m of ASSET_MENUS) for(const i of m.items) add('assets',i.label,i.desc,'#/assets/'+i.id,
    `资产 ${m.title} ${m.key==='role'?'角色 人物 主角 男主 女主 对手 设定 三视图 特写':'场景 空镜 设定 天气 昼夜'}`);
  add('storyboard','分镜','把剧本拆成分镜表，再组装成视频提示词','#/storyboard','分镜 镜头 视频 分镜表 成片');
  add('storyboard','6.0 组装器','组装每集 4～6 段视频提示词，可换画风','#/assembler','分镜 视频 组装 6.0 画风 镜头');
  return L;
}
function drawFuncHits(on){
  const box=document.getElementById('fhits'); if(!box) return;
  const toks=state.q.trim().toLowerCase().split(/[\s,，、]+/).filter(Boolean);
  if(!on || !toks.length){ box.innerHTML=''; return; }
  const hits=funcIndex().filter(x=>toks.every(t=>x.kw.includes(t))).sort((a,b)=>!!(a.pick&&a.pick.g)-!!(b.pick&&b.pick.g));
  if(!hits.length){ box.innerHTML=''; return; }
  const F=Object.fromEntries(FUNCS.map(f=>[f.k,f]));
  const show=hits.slice(0,9);
  box.innerHTML=`<div class="sec-head" style="margin:30px 0 12px"><h2 style="font-size:18px">相关功能</h2><span class="meta">${hits.length} 项${hits.length>show.length?' · 显示前 '+show.length+' 项':''}</span></div>
    <div class="fhits">${show.map((x,k)=>`<a class="fhit" href="${x.href}" data-k="${k}"><span class="ft">${ico(F[x.fn].icon)}${F[x.fn].label}</span><b>${esc(x.title)}</b><span class="fd">${esc(x.desc)}</span></a>`).join('')}</div>
    <div class="sec-head" style="margin:30px 0 0"><h2 style="font-size:18px">提示词</h2></div>`;
  box.querySelectorAll('.fhit').forEach(a=>a.onclick=()=>{
    const p=show[+a.dataset.k].pick; if(!p) return;
    store('pro',p.pro);
    if(p.g) store('sxPick',{g:p.g,idx:p.idx,name:'',title:'',q:''});
  });
}
function grouped(list){
  return DATA.groups.map(g=>{
    const l=list.filter(e=>e.folder===g.key); if(!l.length) return '';
    return `<div class="sec-head" style="margin:30px 0 12px"><h2 style="font-size:18px">${esc(g.label)}</h2><span class="meta">${l.length} 条</span></div>${cardsHtml(l)}`;
  }).join('');
}
function composer(compact){
  return `<div class="composer" ${compact?'style="margin:0;max-width:none"':''}>
    <div class="top">Prompt Library<span style="margin-left:auto;text-transform:none;letter-spacing:0">${esc(versionLine())}</span></div>
    <label class="search">${ico('search')}<input id="q" placeholder="搜索，如：剧本、角色、男主、女主、分镜" value="${esc(state.q)}"></label>
    <div class="row">
      <span class="seg" id="lic">
        <button data-v="all">全部来源</button><button data-v="direct">可直接用</button><button data-v="ref">仅参考</button><button data-v="int">内部</button>
      </span>
      <button class="chip-btn ${state.prod?'on':''}" id="prod">${ico('check')}只看已用于生产</button>
    </div></div>`;
}
function bindComposer(update){
  const q=document.getElementById('q');
  q.oninput=()=>{state.q=q.value;update()};
  document.querySelectorAll('#lic button').forEach(b=>{
    b.classList.toggle('on',b.dataset.v===state.lic);
    b.onclick=()=>{state.lic=b.dataset.v;document.querySelectorAll('#lic button').forEach(x=>x.classList.toggle('on',x===b));update()};
  });
  const p=document.getElementById('prod');
  p.onclick=()=>{state.prod=!state.prod;p.classList.toggle('on',state.prod);update()};
  update();
}
function versionLine(){const m=DATA.changelog.match(/版本：([^｜\n]+)/);return m?m[1].trim():''}

  const e=byId[id]; const v=document.getElementById('view');
  if(!e){v.innerHTML='<div class="empty">找不到这条提示词</div>';return}

  const prev=sib[i-1], next=sib[i+1];

/* ---------- 6.0 assembler ---------- */
const OPT_INFO = {'成人内容':'6.0【一】第 7 条：成人镜头的详细描写要求。只用于成人线项目，全年龄线不要打开（和第七章合规红线冲突）。'};
/* 分镜默认画风：依作品的题材与故事关键字 */
function asmGenreStyle(w){
  const W=Object.assign({},WZ_DEF,w.W), t=`${W.genre} ${W.pitch||''} ${W.core||''}`;
  const R=[[/末日|废土|丧尸|核战|灾变/,'末日废土写实'],[/医院|医生|护士|急诊|手术/,'都市医疗写实，冷色医院灯光，克制压抑，电影感写实'],
    [/古装|古代|宫廷|王爷|皇|侯府|穿越成.{0,4}(千金|嫡女|王妃)/,'古装写实，宫廷与宅院实景，烛火与自然光，厚重电影感'],
    [/玄幻|修仙|仙|宗门|妖|魔/,'东方玄幻写实，仙山云海与宗门殿宇，光效克制，史诗电影感'],
    [/系统|异能|读心|超能/,'都市奇幻写实，真实城市场景，能力光效克制点到，电影感'],
    [/霸总|总裁|职场|公司|法务|律师/,'都市职场写实，高级写字楼与城市夜景，冷暖对比光，精致电影感']];
  const hit=R.find(([re])=>re.test(t)); return hit?hit[1]:'都市写实，现代城市与室内实景，自然光与夜景霓虹，电影感写实';
}
function viewAssembler(ep){
  const styles=Object.keys(DATA.core.styles);
  const saved=store('asm')||{};
  const st={style:saved.style&&(saved.style==='__custom'||styles.includes(saved.style))?saved.style:styles[0],
            custom:saved.custom||'', opts:{}};
  const SEC='一二三四五六七';
  const patches={}; ENTRIES.forEach(e=>(e.patches||[]).forEach(s=>(patches[s]=patches[s]||[]).push(e)));
  const v=document.getElementById('view');
  let epTxt='', head=`<h2>6.0 视频专用提示词 · 组装器</h2><span class="meta">分镜表 → 每集 4~6 段长视频提示词（生产在用）</span>`;
  const ew = ep && (store('works')||[]).find(x=>x.id===ep.wid);
  if(ew){ const mine=(store('asmW')||{})[ew.id];
    if(mine){ st.style=mine.style; st.custom=mine.custom||''; }
    else { const g=asmGenreStyle(ew); if(g==='末日废土写实'&&styles.includes(g)) st.style=g; else { st.style='__custom'; st.custom=g; } } }
  if(ew){ const {s:sx, eps}=vibeData(ew), i=Math.min(ep.i, eps.length-1);
    epTxt=eps[i]; head=`<h2>第 ${i+1} 集：${esc(sx.outline[i][0])}</h2><span class="meta">《${esc(ew.title)}》· 分镜图编辑</span>`; }
  v.innerHTML=`${backBar(ew?`#/script/v/${ew.id}/board`:null)}<div class="sec-head" style="margin-top:56px">${head}</div>
  <div class="asm">
    <div>
      <div class="panel"><h4>统一视觉风格（第三部分）</h4>
        <span class="seg" id="sty">${styles.map(s=>`<button data-v="${esc(s)}">${esc(s)}</button>`).join('')}<button data-v="__custom">自定义</button></span>
        <textarea class="style" id="customStyle" placeholder="粘贴这个项目的画风描述，会替换【三、统一视觉风格】的正文" style="display:none">${esc(st.custom)}</textarea>
      </div>
      <div class="panel"><h4>可选条款</h4>
        ${Object.keys(DATA.core.options).map(o=>`<div class="toggle"><div class="t"><b>${esc(o)}</b><span>${esc(OPT_INFO[o]||'')}</span></div><button class="sw" data-o="${esc(o)}" aria-label="${esc(o)}"></button></div>`).join('')}
        <div class="warn" id="optWarn" style="display:none">已打开成人内容条款，请确认这是成人线项目。</div>
      </div>
      <div class="panel"><h4>可补进各部分的条目</h4><div class="plist">
        ${[...SEC].filter(s=>patches[s]).map(s=>patches[s].sort((a,b)=>cmpId(a.id,b.id)).map(e=>`<a href="#/e/${e.id}"><span class="s">【${s}】</span><span>${e.id} ${esc(e.title)}</span></a>`).join('')).join('')}
      </div></div>
    </div>
    <div>
      <div class="code" style="margin:0">
        <div class="bar"><span id="stat"></span><span class="sp"></span>
          <button class="btn-dark" id="dl" style="height:30px">${ico('dl')}下载 .txt</button>
          <button class="copy" id="cpAll">${ico('copy')}复制全部</button></div>
        <pre id="out" style="max-height:calc(100vh - 220px)"></pre>
      </div>
    </div>
  </div>`;
  const out=document.getElementById('out'), ta=document.getElementById('customStyle');
  function assemble(){
    const style = st.style==='__custom' ? st.custom : DATA.core.styles[st.style];
    let text = DATA.core.parts.join('\n');
    text = text.replace(/^\{\{OPT:([^}]+)\}\}\n?/gm,(m,n)=> st.opts[n] ? DATA.core.options[n]+(m.endsWith('\n')?'\n':'') : '');
    return text.replace('{{STYLE}}', style) + (epTxt ? '\n\n' + epTxt : '');
  }
  let ready=false;
  function update(){
    document.querySelectorAll('#sty button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.style));
    ta.style.display = st.style==='__custom'?'block':'none';
    document.querySelectorAll('.sw[data-o]').forEach(b=>b.classList.toggle('on',!!st.opts[b.dataset.o]));
    document.getElementById('optWarn').style.display = st.opts['成人内容']?'block':'none';
    const t=assemble(); out.textContent=t;
    document.getElementById('stat').textContent=`${t.length} 字 · 风格：${st.style==='__custom'?'自定义':st.style} · 可选条款：${Object.keys(st.opts).filter(k=>st.opts[k]).join('、')||'无'}`;
    const keep=()=>{ if(ew){ const m=store('asmW')||{}; m[ew.id]={style:st.style,custom:st.custom}; store('asmW',m); } else store('asm',{style:st.style,custom:st.custom}); };
    if(!ew) keep();
    if(ready) backDirty(()=>{ keep(); toast('已储存'); });
  }
  document.querySelectorAll('#sty button').forEach(b=>b.onclick=()=>{st.style=b.dataset.v;update()});
  ta.oninput=()=>{st.custom=ta.value;update()};
  document.querySelectorAll('.sw[data-o]').forEach(b=>b.onclick=()=>{st.opts[b.dataset.o]=!st.opts[b.dataset.o];update()});
  document.getElementById('cpAll').onclick=e=>copyText(assemble(),e.currentTarget);
  document.getElementById('dl').onclick=()=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(["\uFEFF"+assemble()],{type:'text/plain;charset=utf-8'}));
    a.download='6.0视频专用提示词.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  update(); ready=true;
}

/* ---------- router ---------- */
function parse(){
  const h=location.hash.replace(/^#\/?/,'');
  if(h==='membership') return {view:'membership'};
  if(h.startsWith('e/')) {const e=byId[h.slice(2)];return {view:'entry',id:h.slice(2),folder:e&&e.folder}}
  if(h.startsWith('f/')) return {view:'list',folder:h.slice(2)};
  if(h==='assembler'||h==='changelog'||h==='admin'||h==='hotwords') return {view:h};
  if(h.startsWith('assembler?ep=')){ const [wid,i]=h.slice(13).split('.'), w=(store('works')||[]).find(x=>x.id===wid);
    return w ? {view:'assembler', ep:{wid, i:+i}, vibe:{id:wid, title:w.title, tab:'board'}} : {view:'assembler'}; }
  if(h.startsWith('script/s/')) {const [id,q]=h.slice(9).split('?');return {view:'tool',tool:'script',sub:'result',sid:id,fresh:q==='new=1'}}
  if(h==='script/new') return {view:'tool',tool:'script',sub:'new'};
  if(h.startsWith('script/v/')){ const [wid,vtab]=h.slice(9).split('/'); return {view:'tool',tool:'script',sub:'vibe',wid,vtab}; }
  if(h.startsWith('script/w/')) return {view:'tool',tool:'script',sub:'new',wid:h.slice(9)};
  if(h.startsWith('assets/')) {const [fn,q]=h.slice(7).split('?i=');return {view:'tool',tool:'assets',fn,idx:q==null?null:+q}}
  if(h==='partner') return {view:'partner'};
  if(TOOLS[h]) return {view:'tool',tool:h};
  if(h==='prompts') return {view:'home'};
  return {view:'start'};
}
function route(){
  const r=parse(); drawNav(r);
  // 手机上每次换页都收起面板；电脑上沿用上次的展开/收起状态
  document.body.classList.toggle('ps-off', matchMedia('(max-width:760px)').matches || store('panel')===false);
  document.querySelector('.tb-logo').classList.toggle('on', r.view==='start');
  if(r.view==='start') viewScriptSimple();
  else if(r.view==='membership') viewMembership();
  else if(r.view==='admin') viewAdmin();
  else if(r.view==='hotwords') viewHotwords();
  else if(r.view==='entry') viewEntry(r.id);
  else if(r.view==='assembler') viewAssembler(r.ep);
  else if(r.view==='tool' && r.tool==='assets') r.fn ? viewAssetEditor(r.fn, r.idx) : viewAssets();
  else if(r.view==='tool' && r.tool==='script'){
    if(r.sub==='result') viewScriptResult(r.sid, r.fresh);
    else if(r.sub==='vibe') viewVibeScript(r.wid, r.vtab);
    else if(!isPro()) viewScriptSimple();
    else r.sub ? viewScriptNew(r.wid) : viewScriptHome();
  }
  else if(r.view==='tool') viewTool(r.tool);
  else if(r.view==='partner') viewPartner();
  else if(r.view==='changelog') viewDoc('更新记录', DATA.changelog);
  else viewList(r);
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);
route();
